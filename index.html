n nach wie vor vor allem Privatautos. Und die wenigen, die keins haben, können nur auf Bus oder Taxi ausweichen. In Großstädten sind Carsharing-Angebote inzwischen Standard. In über 90 Prozent von ihnen können sich Menschen ein Auto leihen. Enno Schöningh Grafik: Anna Eschenbacher, Johanna Hartmann, Francesca Morini. Quelle: Bundesverband Carsharing. Fotos: stock.adobe.com"},{"date":"2.3.2024","title":"Griechenland legalisiert die Ehe für alle","author":"Maria Disman","link":"https://taz.de/die-gute-nachricht/!5993290&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Einander das Ja-Wort geben: Für heterosexuelle Paare auf der ganzen Welt ist das eine Selbstverständlichkeit. Ganz anders sieht es bei queeren Paaren aus. In einem Großteil der Welt ist Heiraten für sie nicht erlaubt, in einigen Ländern droht homosexuellen Männern sogar die Todesstrafe. Doch jetzt zur guten Nachricht: Im Februar hat das griechische Parlament ein Gesetz verabschiedet, das die Ehe und dasAdoptionsrecht für nichtheterosexuelle Paare öffnet.Damit ist Griechenland weltweit das erste mehrheitlich christlich-orthodoxe Land mit der Ehe für alle. Vor der Abstimmung sagte der konservativeMinisterpräsident Kyriakos Mitsotakis: „Wir entscheiden hier nicht über einen gesellschaftlichen Wandel. Dieser Wandel hat längst stattgefunden.“ Und das nicht nur in Griechenland: Weltweit ist die Ehe für alle nun in knapp 40 Staaten legal. Als erstes Land führte die Niederlande sie 2001 ein, seitdem folgten etwa Südafrika 2006, Deutschland im Jahr 2017 und zuletzt Estland im Jahr 2023. Maria Disman"},{"date":"24.2.2024","title":"Menschen würden fürs Klima zahlen","author":"Enno Schöningh","link":"https://taz.de/die-gute-nachricht/!5991734&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Wären Sie dazu bereit, monatlich ein Prozent Ihres Einkommens für den Klimaschutz abzugeben? In Deutschland und der Schweiz antworteten 68 Prozent der Befragten mit Ja, in Österreich sogar knapp 73 Prozent. Ein deutsches Forschungsteam hat 130.000 Stu­di­en­teil­neh­me­r:in­nen aus 125 Ländern befragt. Sie stellten fest: In kühleren und reicheren Ländern ist die Bereitschaft geringer als in wärmeren und ärmeren Ländern. Länder, die vom Klimawandel besonders bedroht sind, zeigen eine besonders hohe Bereitschaft, einen Beitrag zu leisten. Auffallend großzügig wären die Menschen in Myanmar und Usbekistan, ausgesprochen knauserig die Menschen in den USA, Kanada, Australien, Neuseeland und Nordosteuropa. Die deutschsprachigen Länder liegen nahe am globalen Durchschnitt von 69 Prozent. Interessant: In allen untersuchten Ländern trauen die Befragten ihren Mitmenschen weniger Klimabewusstsein zu als sich selbst. So glauben die Menschen in Deutschland, dass nur etwa 40 Prozent ihrer Mit­bür­ge­r:in­nen dazu bereit wären, für das Klima auf einen Teil ihres Einkommens zu verzichten. Auch in großzügigen Ländern wie Myanmar und Usbekistan unterschätzen die Befragten ihre Mitmenschen. Bis auf wenige Ausnahmen ergibt sich weltweit folgendes Bild: Viele Menschen sind grundsätzlich bereit, selbst etwas für das Klima zu tun und sogar dafür zu bezahlen, glauben aber gleichzeitig, dass die Mehrheit in ihrem Land anders denkt. Enno Schöningh"},{"date":"17.2.2024","title":"Ärz­t*in­nen erkennen Endometriose häufiger","author":"Anton Benz","link":"https://taz.de/die-gute-nachricht/!5990199&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Kann es eine gute Nachricht sein, wenn immer mehr Frauen bescheinigt wird, eine Krankheit zu haben? Bei einer Erkrankung mit einer so hohen Dunkelziffer wie Endometriose schon. 2022 wurde bei 399.718 Frauen und Mädchen in Deutschland Endometriose nachgewiesen. Das ist ein Anstieg um 65 Prozent in zehn Jahren, laut einer Studie des Zentralinstituts für die kassenärztliche Versorgung. Die Entwicklung wird auf ein verstärktes Bewusstsein für das Krankheitsbild zurückgeführt, für das Betroffene seit Langem kämpfen. Bei Endometriose wächst Gewebe, das der Gebär­mutter­schleimhaut ähnelt, außerhalb der Gebärmutter. Chronische Entzündungen können zu extremen Schmerzen und anderen Symptomen wie eingeschränkter Fruchtbarkeit führen. Schätzungen zufolge gibt es in Deutschland mehr als zwei Millionen Betroffene. Um die Krankheit noch zuver­lässiger zu diagnostizieren, schlagen die Stu­di­en­­au­to­r*in­nen vor, die Möglichkeiten der Ärz­t*in­nen zu verbessern, die komplexen Untersuchungen abzurechnen. Anton Benz"},{"date":"10.2.2024","title":"Eine Zuckersteuer wirkt","author":"Alena Wacenovsky","link":"https://taz.de/die-gute-nachricht/!5988572&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Durch die Einführung einer Zuckersteuer soll unter anderem der Konsum von Softdrinks eingedämmt werden. Dass das tatsächlich funktionieren kann, zeigt eine Studie aus den USA. Fünf Städte mit über 26.300 Läden nahmen teil und führten eine Teststeuer auf stark zuckerhaltige Getränke ein.Durchschnittlich stiegen die Preise so um 33,1 Prozent, also um 44 Cent pro Liter. Die Wirkung: In den zwei Jahren nach der Preiserhöhung wurden stark zuckerhaltige Getränke um 33 Prozent seltener gekauft.Gezeigt hat sich auch: Je höher die Steuer, desto größer die Wirkung. Das bestätigt der Blick auf die einzelnen Städte: Mit einer Steuer von 58 Prozent konnte der Konsum in Philadelphia etwa um ganze 46 Prozent verringert werden.Untersucht wurde ausschließlich das Kaufverhalten, nicht die gesundheitlichen Auswirkungen auf die Konsument*innen. Die Forschenden hoffen aber, dass so in Zukunft Volkskrankheiten wie Adipositas oder Diabetes Typ 2 vorgebeugt werden könne. Alena Wacenovsky"},{"date":"3.2.2024","title":"Die Amazonas-Abholzung geht zurück","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!5987698&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Zerstörung des Amazonas-Regenwaldes in Brasilien verlangsamt sich. Insbesondere seit dem Amtsantritt von Präsident Luiz Inácio Lula da Silva Anfang 2023 wird deutlich weniger Urwald abgeholzt. Das zeigen Daten des brasilianischen Weltraumforschungsinstituts Inpe. Demnach sind in den zwölf Monaten von August 2022 bis Juli 2023 rund 9.000 Quadratkilometer gerodet worden. In den zwölf Monaten zuvor waren es noch etwa 11.600 Quadratkilometer. Das ist ein Rückgang um 22 Prozent. Inpe berechnet die Statistiken jeweils von August bis Juli. Für das Kalenderjahr 2023 – also die bisherige Amtszeit Lulas – schätzt die Nichtregierungsorganisation MAAP den Rückgang auf fast 60 Prozent. Die Rodungen gehen überall außer in der Cerrado-Region im südöstlichen Inland zurück. Dort liegen sie auf dem höchsten Stand seit 2018. Die Zahlen zeigen, dass politische Wechsel deutliche Veränderungen vor Ort hervorbringen können.Seit Lulas Antritt werden die Gesetze zum Schutz des Regenwaldes wieder strenger durchgesetzt. Unter seinem Vorgänger, dem rechtsextremen Präsidenten Jair Bolsonaro, der von 2018 bis 2022 regierte, hatte die Zerstörung des Amazonas-Regenwalds zugenommen. Bolsonaro wollte die wirtschaftliche Ausbeutung der Region vorantreiben. Wenige Jahre zuvor, während Lulas erster Amtszeit zwischen 2003 und 2010, war die Abholzungsrate am Amazonas um fast 75 Prozent gesunken. Dieses Mal versprach der wiedergewählte Präsident bei seinem Amtsantritt, die Abholzung bis 2030 ganz zu stoppen. Lalon Sander"},{"date":"27.1.2024","title":"Unser Strom ist zur Hälfte grün","author":"Anja Krüger","link":"https://taz.de/die-gute-nachricht/!5985365&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Im Jahr 2023 haben erneuerbare Energien zum ersten Mal mehr als 50 Prozent des Stromverbrauchs in Deutschland gedeckt. Das zeigt die enormen Fortschritte, die vor allem beim Ausbau der Windkraft und der Photovoltaik erreicht worden sind – und die vor nicht allzu langer Zeit etliche Po­li­ti­ke­r:in­nen und Ex­per­t:in­nen für unmöglich hielten. Über viele Jahre galt: Aus Atomkraft und Kohle auszusteigen, ist unmöglich. Die Realität beweist das Gegenteil. Die hochriskante Atomkraft ist in Deutschland seit 2023 Geschichte, die extrem klimaschädliche Kohleverstromung wird spätestens 2038 zu Ende sein. Anfang der 1990er kam kaum Strom aus erneuerbaren Energien. Die rot-grüne Regierung hat zwischen 1998 und 2005 die Weichen für den Ausbau gestellt. Die anschließenden Großen Koalitionen und die gelb-schwarze Regierung waren weniger ehrgeizig. Von 2015 auf 2016 stieg der Anteil nur um 0,1 Prozentpunkte auf 29,4 Prozent. Doch aufhalten konnten die Geg­ne­r:in­nen die erneuerbaren Energien nicht. Bei Antritt der Ampelregierung im Jahr 2021 lag der Anteil an der Stromerzeugung bei rund 40 Prozent. Bis 2030 soll sich der Anteil auf 80 Prozent verdoppeln. Das ist ein ehrgeiziges Ziel. Aber der Ausbau schreitet massiv voran. Im vergangenen Jahr wurde so viel Photovoltaik wie nie zuvor installiert, mehr als für das Erreichen des Ziels nötig ist. Anja Krüger Grafik: Anna Eschenbacher, Johanna Hartmann, Francesca Morini. Quelle: AG Energiebilanzen. Fotos: Unsplash"},{"date":"20.1.2024","title":"Auch in Westdeutschland sind Mütter häufiger erwerbstätig","author":"Alena Wacenovsky","link":"https://taz.de/die-gute-nachricht/!5984054&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Traditionelle Geschlechterrollen sind auch lange nach der Wende in Westdeutschland stärker verbreitet als im Osten. Sichtbar wird das etwa in den Erwerbstätigkeitsquoten von Müttern minderjähriger Kinder. Deutschlandweit ist die Quote zwischen 1997 und 2022 nur um 11 Prozentpunkte angestiegen – sie lag 2022 bei 69 Prozent. Allerdings holten zumindest westliche Bundesländer in dem Zeitraum ordentlich auf. 1997 waren in Westdeutschland 55 Prozent aller Mütter erwerbstätig, 2022 waren es schon 68 Prozent. Im egalitär geprägten Osten stieg die Erwerbstätigkeit der Mütter im angegebenen Zeitraum von 70 auf 79 Prozent.Innerhalb von 25 Jahren ist das Ost-West-Gefälle also um gut ein Viertel geschrumpft. Vor allem der Ausbau der Kinderbetreuungsangebote dürfte dazu beigetragen haben, dass Westdeutschland um ganze 13 Prozentpunkte nachzog. Bei den Vätern hat sich seit 1997 kaum etwas geändert – bleibt die Frage, wer sich trotz Erwerbsarbeit um Sorge- und Hausarbeit kümmert. Alena Wacenovsky"},{"date":"13.1.2024","title":"Wir produzieren weniger Müll","author":"Alena Wacenovsky","link":"https://taz.de/die-gute-nachricht/!5982720&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Deutschen machen ordentlich Dreck. 40,3 Millionen Tonnen an Abfällen wurden 2021 allein von privaten deutschen Haushalten produziert, das ist im EU-Vergleich überdurchschnittlich viel, nämlich 484 Kilogramm pro Person. Trotzdem ist das Müllverhalten hierzulande Grund für eine gute Nachricht: Die Gesamtmenge an Haushaltsabfällen ist im Jahr 2022 im Vergleich zum Vorjahr um ganze 8,2 Prozent gesunken. Das bedeutet 3,3 Millionen Tonnen weniger an Haus-, Bio-, Sperr- und sonstigem Müll.Und das, obwohl die Bevölkerung im gleichen Zeitraum um 1,1 Millionen Menschen gewachsen ist. Diese Entwicklung ist überraschend, denn das Pro-Kopf-Aufkommen an Haushaltsabfällen war in den Jahren davor stetig gestiegen. Grund dafür war nicht zuletzt die Pandemie, während der weltweit mehr Verpackungsmüll produziert wurde. Für deutsche Haushalte bedeutete dies einen Anstieg von insgesamt 2,3 Millionen Tonnen jährlich.2022 sank die Müllproduktion pro Kopf dann um 19 Kilo, auf den tiefsten Stand seit Beginn der Erhebung im Jahr 2004. Sind da bloß nicht mehr so viele Masken im Müll gelandet oder haben wir generell weniger konsumiert? Schwer zu sagen. Sicher ist: Den größten Rückgang hat der Biomüll zu verzeichnen: 11,4 Prozent weniger Nahrungsmittel und Gartenabfälle landeten 2022 in der Tonne. Alena Wacenovsky"},{"date":"6.1.2024","title":"Die Straßen werden sicherer","author":"Dunja Batarilo","link":"https://taz.de/die-gute-nachricht/!5981379&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Im Jahr 2023 sind von Januar bis September 2.750 Menschen im Straßenverkehr gestorben. Das sind 40 Personen weniger als im Vorjahr. Auch wenn der Rückgang gering erscheint, zeigt sich mit Blick auf die langfristige Entwicklung ein beeindruckendes Bild: 1970 waren es noch knapp achtmal so viele, nämlich etwa 21.000 Verkehrstote. Vier Jahre später waren es rund 17.000. In der Zwischenzeit wurde Tempo 100 auf Landstraßen eingeführt, außerdem durften Au­to­fah­re­r:in­nen nur noch maximal 0,8 Promille haben. Ordnungspolitische Entscheidungen haben also durchaus eine reale Auswirkung. Die Autos wurden dazu immer sicherer und mit der Gurtpflicht, eingeführt im Jahr 1984, sanken die Zahlen weiter: Im Jahr 1998 waren es noch knapp 8.000 Verkehrstote jährlich. Heute befinden sie sich, auch dank der 0,5-Promille-Grenze, auf einem Tiefstand. Einzig 2021 wurde er noch unterboten, was wohl daran lag, dass die meisten pandemiebedingt zu Hause geblieben sind. Dunja Batarilo"},{"date":"30.12.2023","title":"Anzahl der Versuchstiere sinkt im dritten Jahr in Folge","author":"Hanna Kopp","link":"https://taz.de/die-gute-nachricht/!5979595&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Tierversuche sind ethisch höchst umstritten. Dennoch werden in Deutschland Mäuse, Fische und Vögel eingesetzt, um beispielsweise Impfstoffe oder Krankheiten wie Krebs zu erforschen. Allerdings ist die Zahl der Versuchstiere in den vergangenen Jahren kontinuierlich gesunken: Für 2022 meldete das Deutsche Zentrum zum Schutz von Versuchstieren rund 1,73 Millionen Tiere – 134.000 weniger als im Vorjahr. Damit gibt es zum dritten Jahr in Folge weniger Versuchstiere in Deutschland. Während die Zahlen bei Mäusen, Ratten, Fischen und Katzen sanken, wurden Hunde, Kaninchen und Affen öfter für Versuche eingesetzt. Mehr als die Hälfte der Tierversuche diente der Erforschung biologischer Abläufe und Funktionsweisen im Körper, der sogenannten Grundlagenforschung. Der Grund für die rückläufigen Zahlen ist die zunehmende Verbreitung von Alternativmethoden. Wie diese weiter verbessert werden können – auch daran wird weiter intensiv geforscht.Hanna Kopp"},{"date":"23.12.2023","title":"Weniger Weihnachtsbäume werden importiert","author":"Leyli Nouri","link":"https://taz.de/die-gute-nachricht/!5979117&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Wir verbrauchen mehr, als wir haben – das trifft auch auf Weihnachtsbäume zu. Viele der Bäume, die buntgeschmückt in deutschen Stuben Feststimmung verbreiten, haben einen Migrationshintergrund. Der Großteil, 83 Prozent, stammt aus Dänemark. Auch aus Polen und den Niederlanden kommen Bäume. Jetzt aber die gute Nachricht: Der Weihnachtsbaum-Import nimmt rasant ab. 1,8 Millionen Bäume sind dieses Jahr nach Deutschland importiert worden, das sind gut 24 Prozent weniger als im Vorjahr. Verglichen mit dem Rekordjahr 2014 sind wir sogar um gut 37 Prozent lokaler geworden. Ein Drittel der gekauften Bäume kommt derzeit aus Nordrhein-Westfalen. Bei aller Freude an Lichterglanz und Tannenduft: Es bleibt ein fragwürdiger Brauch, zum Fest der Liebe kleine Bäume umzuhauen. Aber immerhin wird er lokaler und regionaler. Leyli Nouri"},{"date":"16.12.2023","title":"Weniger Menschen stecken sich weltweit mit HIV an","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!5977466&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Wer HIV-positiv getestet ist, trägt das Humane Immundefizienz-Virus in sich. Die Infektion ist nicht heilbar und kann ohne Behandlung zu einer Erkrankung mit Aids führen. Das Immunsystem wird geschwächt. Seit einigen Jahren gibt es wirkungsvollere Behandlungsmöglichkeiten. Außerdem reduzieren verbesserte Medikamente das Risiko einer Übertragung deutlich. Zusammen mit einer frühen gesundheitlichen Aufklärung schlägt sich das in den weltweiten Neuinfektionen nieder: Laut UNAIDS infizierten sich im Jahr 2000 jährlich 2,8 Millionen mit dem HI-Virus, 2022 waren es nur noch 1,3 Millionen Die Neuinfektionen haben sich somit mehr als halbiert. Gleichzeitig nimmt die Gesamtzahl der HIV-Positiven zu. Das liegt im Wesentlichen daran, dass diese deutlich besser behandelt werden können und HIV seltener zu Todesfällen durch Aids führt. Einige Gebiete, beispielsweise das lange stark betroffene Südafrika, melden einen deutlichen Rückgang von Neuinfektionen, was den weltweiten Abwärtstrend erklärt. Yannik Achternbosch"},{"date":"9.12.2023","title":"Weniger Feinstaub liegt in der Luft","author":"Melina Moehring","link":"https://taz.de/die-gute-nachricht/!5976667&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Immer wenn etwas verbrannt wird, etwa im Automotor oder in einem Kraftwerk, entsteht gesundheitsschädlicher Feinstaub. Im Straßenverkehr kommt Bremsen- und Reifenabrieb dazu. Aber die Luftbelastung in Deutschland geht zurück, wie Messdaten des Umweltbundesamtes zeigen. Seit 2002 ist der Jahresmittelwert von Feinstaubpartikeln mit einem Durchmesser von zweieinhalb bis zehn Mikrometern von 26 auf 16 Mikrogramm pro Kubikmeter gesunken. Auch bei den winzigsten Feinstaubpartikeln und bei Stick­stoff­dioxid ist der Trend erkennbar. Wichtige Gründe für den Rückgang sind verbesserte Filtersysteme und die in den 2010er Jahren eingeführten Umweltzonen, mit denen schmutzige Fahrzeuge aus den Städten verbannt wurden. Obwohl große Städte und Industriestandorte oft über dem Mittelwert liegen, haben es die meisten Standorte mittlerweile trotzdem unter den EU-Grenzwert geschafft. Deutlich strenger ist die Weltgesundheitsorganisation. Ihre Grenzwerte werden weiterhin überschritten. Melina Möhring"},{"date":"2.12.2023","title":"Arbeiten in Deutschland wird sicherer","author":"Sophie Fichtner","link":"https://taz.de/die-gute-nachricht/!5973706&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Die Zahl der Unfälle am Arbeitsplatz sinkt. Im Vergleich zu 1992 gab es im vergangenen Jahr 63 Prozent weniger meldepflichtige Unfälle. Gemeldet werden müssen diese, wenn die Verletzten mehr als drei Tage arbeitsunfähig waren oder starben. Am stärksten gefährdet sind Menschen in Baukonstruktionsberufen wie Maurerinnen oder Zimmerleute. In dieser Berufsgruppe wurden 2022 124 Unfälle auf 1.000 Arbeitskräfte gemeldet. Diese Unfallquote liegt deutlich über der durchschnittlichen Quote von 18,27. Überdurchschnittlich riskant ist auch die Arbeit mit Kindern. 87 von 1.000 Er­zie­he­r:in­nen oder Lehrkräften verletzen sich bei der Arbeit durch Stolpern, Ausrutschen oder bei Sportübungen. Am sichersten ist es im Büro, hier liegt die Unfallquote bei 1,8.Jedoch zeigt ein neuer Bericht der UNO-Arbeitsorganisation, dass sich dieser positive Trend weltweit noch nicht durchsetzt. Vor allem in der Land- und Forstwirtschaft, im Bauwesen und der Fischerei muss der Gesundheitsschutz ausgebaut werden. Sophie Fichtner"},{"date":"25.11.2023","title":"Forscher finden immer weiter entfernte Planeten","author":"Konrad Bierl","link":"https://taz.de/die-gute-nachricht/!5972544&s=gute%2Bnachricht&SuchRahmen=Print/","category":"technology_science","text":"„Der Weltraum – unendliche Weiten“: So beginnt die Sendung „Star Trek“ und jedes Mal entdeckte die Crew des Raumschiffes Enterprise neue, weiter entfernte Planeten. Obwohl für Menschen noch keine Reisen in Überlichtgeschwindigkeit möglich sind, haben Wis­sen­schaft­le­r:innen wie in dem Film in den vergangenen Jahren mehr als 5.000 Exoplaneten aufgespürt – Planeten außerhalb unseres Sonnensystems.1992 wurden die ersten Exoplaneten, Poltergeist und Phobetor, entdeckt. Durch die technische Entwicklung der vergangenen Jahrzehnte, etwa das 2008 gestartete Kepler-Weltraumteleskop, nahm die Zahl der entdeckten Planeten zu. So nähern sich Wis­sen­schaft­le­r:in­nen der Antwort auf die Frage, was sich in den riesigen dunklen Gebieten zwischen den Sternen befindet. Das Weltraumteleskop James Webb sucht seit fast zwei Jahren nach noch mehr Planeten. Es kann nicht nur Planeten finden, sondern auch deren Atmosphäre analysieren. Das könnte Hinweise auf Leben außerhalb unserer Erde geben. Konrad Bierl"},{"date":"18.11.2023","title":"Immer mehr Betriebe bieten eine Vier-Tage-Woche an","author":"Elisa Pfleger","link":"https://taz.de/die-gute-nachricht/!5970951&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Immer mehr Betriebe schaffen Stellen mit verkürzter Arbeitszeit. Das geht aus einer Analyse der Employer Branding Agentur index hervor. Dafür werteten sie Stellenausschreibungen in Zeitungen, Online-Stellenportalen und Firmenwebsites aus. Die Zahl der ausgeschriebenen Positionen mit Vier-Tage-Woche stieg von 6.563 Stellen in 2019 auf bisher 48.890 in 2023 an. Für viele Ar­beit­neh­me­r:in­nen ist entscheidend, ob sich ihr Lohn verändert. Knapp 73 Prozent der Deutschen gaben in einer Studie der Hans-Böckler-Stiftung an, sie würden nur bei gleichbleibendem Lohn eine Vier-Tage-Woche bevorzugen. Die positiven Effekte bestätigt im Frühjahr 2023 ein britisches Pilotprojekt: Die teilnehmenden Ar­beit­neh­me­r:in­nen sind aufgrund der verkürzten Arbeitszeit motivierter, produktiver und seltener krank als zuvor. In Deutschland versucht die IG Metall in ihren aktuellen Tarifverhandlungen eine Vier-Tage-Woche durchzusetzen. Es wäre schön, wenn es zukünftig eine Option für alle wäre. Elisa Pfleger"},{"date":"11.11.2023","title":"Mehr Betriebe kümmern sich um die Gesundheit des Personals","author":"Anastasia Zejneli","link":"https://taz.de/die-gute-nachricht/!5969252&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Stress, Schlafstörungen, Rückenschmerzen: Arbeit kann krank machen. Das wissen anscheinend immer mehr Betriebe und versuchen, mit Sportangeboten und Kursen zu Ernährung und Stressbewältigung ihre Belegschaft fit zu halten. Die Zahl der Unternehmen, die betriebliche Gesundheitsförderung anbieten, ist von 50,4 Prozent in 2015 auf 73,5 Prozent in 2021 gestiegen. Das hat eine Befragung bei Firmen und öffentlichen Arbeitgebern mit Betriebs- oder Personalräten ergeben.Die Programme und Kurse bieten die Unternehmen freiwillig an. Ein Grund für die positive Entwicklung ist die Corona­pandemie. Sie hat gezeigt, wie wichtig die Gesundheit der Mitarbeitenden ist. Auch in Zeiten, in denen Firmen um gutes Personal werben müssen, können Yogakurse oder eine Mitgliedschaft im Fitnessstudio den Betrieb attraktiver machen. Die Initiative Gesundheit und Arbeit bestätigt in einem Report aus 2018, dass betriebliche Bewegungs- und Ernährungsangebote positive Entwicklungen auf die Gesundheit haben. Anastasia Zejneli"},{"date":"4.11.2023","title":"TikTok macht Books hot","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5968019&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Auf Drachen fliegen und Liebe mit Vampiren machen – mit einem Buch in der Hand kann man der Gegenwart entfliehen. Lesen ist wieder im Trend, das zeigen auch die Zahlen: Laut dem Globalen Buchmarkt Report, der Mitte Oktober erschienen ist, sind die Umsätze im letzten Jahr gewachsen, in Deutschland beispielsweise um 5,1 Prozent. Grund für die globale Entwicklung sind vor allem die steigenden Preise. In Dreiviertel der untersuchten Länder sind die Verkaufszahlen insgesamt rückläufig. Es werden also weniger Bücher verkauft, aber für höhere Preise. Dadurch ergibt sich ein höherer Umsatz. In Deutschland ist das anders. Der Durchschnittspreis ist zwar um 2,6 Prozent gestiegen, aber ebenso die Zahl der verkauften Bücher, nämlich um 2,4 Prozent. Einer der wichtigsten Gründe für den Buch-Boom könnte Social Media sein. Auf TikTok haben sich mittlerweile große Communities gebildet, die sich über Bücher austauschen. Videos mit dem Hashtag #BookTok wurden auf TikTok 191 Milliarden mal angeschaut. Alexandra Hilpert"},{"date":"28.10.2023","title":"Europas größtes Gasfeld wird geschlossen","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!5966591&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Mehr als 20 Jahren lang protestierten Bür­ge­r:in­nen im niederländischen Groningen gegen die Gasförderung. Dort liegt ein gewaltiges Erdgasfeld unter der Erde. Etwa 2,74 Billionen Kubikmeter umfasste es zu Beginn seiner Ausbeutung. Zum Vergleich: Der Jahresverbrauch Deutschlands lag 2022 bei etwa 77 Milliarden Kubikmetern. Der Abbau in Groningen ließ den Boden absinken. Seit den neunziger Jahren kam es immer wieder zu Erdbeben, bei denen zehntausende Gebäude beschädigt wurden.Doch nun gibt es Grund zur Freude. Am 1. Oktober 2023 haben die Niederlande die Förderung eingestellt. Bereits zuvor wurde die Fördermenge reduziert. Zur Notfallversorgung in einem besonders kalten Winter bleiben noch elf Bohrlöcher bis Oktober 2024 in Bereitschaft, planmäßig soll jedoch kein Gas mehr gefördert werden. Jeder Kubikmeter Erdgas, der nicht verbrannt wird, sondern unberührt unter der Erde bleibt, kann keine Treibhausgase freisetzen, die dann wiederum die Klimakrise befeuern. Yannik Achternbosch"},{"date":"21.10.2023","title":"Mehr Auszubildende entscheiden sich für grüne Berufe","author":"Melina Moehring","link":"https://taz.de/die-gute-nachricht/!5964981&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Welche Jobs haben Zukunft? Auch das ändert sich durch die Klimakrise. Junge Menschen haben das mehr und mehr verstanden, wie eine neu erschienene Studie des Instituts für Arbeitsmarkt- und Berufsforschung zeigt, für die Ausbildungsverträge zwischen 2013 und 2021 auswertet wurden. Immer mehr Auszubildende entscheiden sich für einen Beruf, der einen umwelt- oder klimafreundlichen Aspekt hat. Dass Hei­zungs­tech­ni­ke­r sich heute mit klima­freundlichen Wärmepumpen auskennen sollten, ist logisch. Aber auch Dach­de­cke­rin­nen beraten einen mittlerweile, wo und wie eine Solaranlage montiert werden kann. Obwohl die Zahl der Auszubildenden insgesamt zurückgeht, stieg die Zahl der neu abgeschlossenen Ausbildungsverträge mit „Green Skills“ zwischen 2013 und 2021 um 14 Prozent.Parallel gingen die Zahlen der neu besetzten Ausbildungsstellen in umwelt- und klimaschädlichen Berufen, etwa in der Autoindustrie, um 15 Prozent zurück.Melina Möhring"},{"date":"14.10.2023","title":"Nashörner trotzen Wilderern","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!5963323&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Am 22. September findet jährlich der Weltnashorntag statt. Nach einigen Jahren mit schlechten Nachrichten konnten wir ihn dieses Jahr tatsächlich feiern: Laut der internationalen Naturschutzunion IUCN lebten 2022 23.321 Nashörner auf dem afrikanischen Kontinent. Das ist eine Zunahme von fünf Prozent im Vergleich zum Vorjahr und der erste Anstieg seit 2012. Obwohl der Handel mit Nashornprodukten seit mehr als 45 Jahren verboten ist, werden die Nashörner wegen ihrer auffälligen Hörner aus Keratin oft illegal erlegt. Der Anstieg der Nashornpopulationen zeigt, dass die Schutzmaßnahmen der Staaten nun Erfolg haben. Auch im vergangenen Jahr gab es bereits gute Nachrichten für Nashörner: Vor der Weltartenkonferenz scheiterte das im südlichen Afrika gelegene Königreich Eswatini mit einem Antrag, der den Handel mit Nashornprodukten legalisieren sollte. Yannik Achternbosch"},{"date":"7.10.2023","title":"Parlamente werden weiblicher","author":"Malina Dittrich","link":"https://taz.de/die-gute-nachricht/!5962028&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Wir leben in einer Welt, in der rund die Hälfte der Bevölkerung weiblich ist. Dieses Verhältnis spiegelt sich so in den Parlamenten noch nicht wider, doch es geht voran: Der Frauenanteil in Parlamenten hat sich seit 1997 weltweit mehr als verdoppelt! Vorreiter für weibliche Parlamentarierinnen war Finnland, damals noch unter Herrschaft des Russischen Reichs. Schon 1907 wurden dort die ersten Frauen in die Volksvertretung gewählt. Somit war Finnland das erste Land der Welt, in dem Frauen nicht nur wählen durften, sondern auch selbst im Parlament saßen. Mit 19 Vertreterinnen bildeten sie damals einen Anteil von 9,5 Prozent. An dritter Stelle, hinter Schweden und Norwegen, führte Finnland so 90 Jahre später die Liste der Länder mit dem höchsten Frauenanteil im Parlament an. Heute ist Ruanda mit 61 Prozent ganz vorn. Eine Folge des Völkermordes von 1994, nach dem Frauen etwa 70 Prozent der Bevölkerung ausmachten. Mehr Frauen als Männer gibt es sonst nur in den Parlamenten von Kuba und Nicaragua. In Andorra, Mexiko, Neuseeland und den Vereinigten Arabischen Emiraten ist das Verhältnis immerhin ausgeglichen: gleich viele Frauen wie Männer im Unterhaus beziehungsweise Parlament. Deutschland liegt in diesem Ranking mit einem Frauenanteil von 35,1 Prozent übrigens auf Platz 44. Malina Dittrich"},{"date":"30.9.2023","title":"Das Lastenrad boomt","author":"Sean-Elias Ansa","link":"https://taz.de/die-gute-nachricht/!5960806&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Lastenräder sind vielseitig einsetzbar – ob mit großer Einkaufskiste, als schmaler Einsitzer oder als halber Kleiderschrank. Und sie werden immer beliebter. Wie der Zweirad-Industrie-Verband vor einiger Zeit ermittelt hat, verzeichnet der Markt 2022 für Lastenräder eine Zuwachsrate von 37,5 Prozent im Vergleich zum Vorjahr. Über 212.800 Lastenräder seien 2022 verkauft worden, über zwei Drittel mit elektrischem Antrieb.Aber bringt das auch etwas fürs Klima? In dem Projekt „Ich entlaste Städte“ erforscht das Institut für Verkehrsforschung im Deutschen Zentrum für Luft-und Raumfahrt (DLR), wie praxistauglich die gewerbliche Nutzung von Lastenrädern ist. Dabei wurden in der Testphase zwischen 2017 und 2019 zwei Drittel der Fahrten, die eigentlich mit Verbrennern erledigt worden wären, mit Lastenrädern absolviert – erfolgreich. Laut der Studie ist das E-Rad in Klein- und Großstädten auf Kurzstrecken unter 3 Kilometern fast genauso schnell wie das Auto. Selbst bei Strecken bis zu 20 Kilometern ist es nur zwei bis zehn Minuten langsamer. Auf Fahrradstraßen fallen etwa Ampeln weg, Staus können einfacher umfahren werden. Sean-Elias Ansa"},{"date":"23.9.2023","title":"Viele bedrohte Pflanzen könnten in Gärten gerettet werden","author":"Anton Benz","link":"https://taz.de/die-gute-nachricht/!5959206&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Hallo, Sie da draußen in Ihrem Garten oder auf Ihrem Balkon. Sie könnten Deutschland artenreicher gärtnern. Wie wäre es mit kugelköpfigem Lauch auf dem Leipziger Balkon? Edel-Schafgarbe im Kölner Grün?Es ist nämlich so: Im Mittel stehen die Hälfte aller bekannten Gefäßpflanzenarten, also die meisten Pflanzenarten außer Moosen und Algen, auf den Roten Listen der Bundesländer und sind gefährdet. Daher ist das sogenannte Conversation Gardening, also das Aussähen und Anpflanzen von gefährdeten einheimischen Pflanzen, wichtig.Laut dem Biologen Ingmar Staude und seinem Team hat das Hobby­gärtnern großes Potential in Deutschland: Ungefähr 41 Prozent dieser gefährdeten Pflanzen gedeihen in jedem Garten. Die Forschenden veröffentlichten eine Studie im Fachjournal Scientific Reports dazu. Sie trugen alle gefährdeten oder in der Wildnis schon ausgestorbenen Arten zusammen. Und kamen dabei insgesamt auf 3.400.Um Hob­by­gärt­ne­r:in­nen zu unterstützen, stellt das Team eine frei zugängliche Web-App zur Verfügung. Nut­ze­r:in­nen können die Bedingungen in ihrem Garten auswählen und bekommen darauf basierend Pflanzen vorgeschlagen. Anton Benz"},{"date":"16.9.2023","title":"Immer mehr ausländische Abschlüsse werden anerkannt","author":"Jean Dumler","link":"https://taz.de/die-gute-nachricht/!5957935&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Die Gesellschaft altert und der Fachkräftemangel nimmt zu. Deshalb ist es gut, dass die Zahl der im Ausland erworbenen Berufsabschlüsse, die in Deutschland anerkannt werden, steigt. Wie das Statistische Bundesamt mitteilt, ist sie von 2021 auf 2022 um 11 Prozent auf 52.300 gewachsen. Seit 2016 hat sich die Zahl der Verfahren mit positiver Entscheidung damit nahezu verdoppelt. Rund zwei Drittel, also 35.400 aller anerkannten Berufsabschlüsse, stammen aus dem Bereich der medizinischen Gesundheitsberufe. Mit deutlichem Abstand folgen die Berufe In­ge­nieu­r:in mit 2.300 und Leh­re­r:in mit 1.700 Anerkennungen. Dass so viele Abschlüsse aus dem Gesundheitsbereich anerkannt werden, liegt an dem seit 2013 bestehenden Programm „Triple Win“. Deutschland wirbt damit Pflegekräfte aus anderen Ländern ab. Die meisten kommen aus europäischen Nicht-EU-Ländern, wie zum Beispiel Bosnien und Herzegowina. Um den Fachkräfte­mangel zu bekämpfen, könnten solche Programme auch für andere Berufsgruppen sinnvoll sein. Jean Dumler"},{"date":"9.9.2023","title":"Londons Umweltzone wird größer","author":"Tabea Kirchner","link":"https://taz.de/die-gute-nachricht/!5956379&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Jedes zehnte Auto in London ist zu dreckig – so dreckig, dass es nicht mehr einfach so in London herumfahren darf. Die britische Hauptstadt hat nämlich Ende August seine Umweltzone vergrößert. Be­sit­ze­r:in­nen von Fahrzeugen, die nicht den Emissionsstandards entsprechen, müssen nun innerhalb der gesamten Stadtgrenze eine Gebühr von 12,50 Pfund pro Tag zahlen, wenn sie fahren wollen. Das sind umgerechnet knapp 15 Euro. Davor galt diese sogenannte Ultra Low Emission Zone nur für die inneren Stadtteile.Die Londoner Emissionsstandards sind im Vergleich zu den deutschen grünen Umweltzonen strenger. Benzinfahrzeuge müssen dem Standard Euro 4 und Dieselfahrzeuge dem höchsten Standard Euro 6 entsprechen. In Deutschland gelten dagegen nur Euro 3 und Euro 4. Um weniger zu emittieren, muss man kein neues Auto kaufen, sondern kann auch nachrüsten. Feinstaub und Stickoxide gefährden die Gesundheit. NGOs fordern deshalb, auch hierzulande strengere Vorgaben einzuführen. Tabea Kirchner"},{"date":"2.9.2023","title":"Immer mehr Männer werden Erzieher","author":"Nicole Opitz","link":"https://taz.de/die-gute-nachricht/!5954763&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Innerhalb von zehn Jahren hat sich der Männeranteil beim pädagogischen Personal in Kitas und Horteinrichtungen laut Statistischem Bundesamt verdoppelt: 2012 lag der Anteil bei 4,1 Prozent, vergangenes Jahr bei 7,9 Prozent. Nachdem Feminist_innen jahrzehntelang gefordert haben, dass Männer mehr Care-Arbeit übernehmen sollen, ist das ein gutes Zeichen. Acht Prozent sind allerdings trotzdem noch sehr wenig. So kritisiert Bettina Kohlrausch, Direktorin des Wirtschafts- und Sozialwissenschaftlichen Instituts der Hans-Böckler-Stiftung: „Noch immer arbeiten in Kitas ganz überwiegend Frauen. Das spiegelt eine geschlechts­spezifische Segregation des Arbeitsmarktes wider, die zur Folge hat, dass Frauen häufig in schlechter bezahlten Jobs und unter schlechteren Bedingungen arbeiten.“ Ein Hoffnungsschimmer: Vor allem jüngere Männer werden Erzieher. In der Erzieher_innen-Ausbildung steigt der Anteil der Männer zudem nach und nach: Waren es 2012 noch 13,3 Prozent, lag der Anteil 2021 bei 17,7 Prozent. Nicole Opitz"},{"date":"26.8.2023","title":"DAX-Vorstände kriegen weniger Kohle","author":"Simon Poelchau","link":"https://taz.de/die-gute-nachricht/!5952684&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Jahrelang hieß es immer nur: Die Ungleichheit zwischen Arm und Reich nimmt zu. Nun könnte sich der Trend gewendet haben: Verdiente im Jahr 2021 ein Vorstand in einem DAX-Konzern das 52-Fache einer einfachen Arbeitskraft, schrumpfte der Abstand im vergangenen Jahr auf das 38-Fache. Denn zum einen verdienten die Ma­na­ge­r*in­nen in Deutschland weniger – im Schnitt rund 3,3 statt 3,6 Millionen Euro. Zum anderen konnten die Beschäftigten deutliche Lohnerhöhungen erzielen. Das zeigen Zahlen der Deutschen Schutzvereinigung für Wertpapierbesitz.Der Rückgang der Ungleichheit könnte auch gut für die jüngst eher nur noch mau laufende Konjunktur sein. Zumindest theoretisch. So zeigte vor einigen Jahren der französische Starökonom Thomas Piketty, dass das Wirtschaftswachstum unter zunehmender Ungleichheit leidet. Die Verringerung der Kluft zwischen Arm und Reich ist also so etwas wie ein Konjunkturprogramm, das den Staat nichts kostet. Simon Poelchau"},{"date":"19.8.2023","title":"Es wird immer mehr gegen das Rauchen unternommen","author":"Marlena Wessollek","link":"https://taz.de/die-gute-nachricht/!5950496&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Immer weniger Menschen rauchen, und das unabhängig vom Einkommensniveau. Laut Weltgesundheitsorganisation (WHO) sind heute 71 Prozent der Weltbevölkerung durch Anti-Rauch-Maßnahmen geschützt, das sind fünfmal mehr als noch 2007. In knapp 40 Prozent der Länder ist das Rauchen in öffentlichen Innenräumen nun fast vollständig verboten. Aber auch Steuererhöhungen auf Tabak, Werbeverbote für Tabakprodukte sowie Hilfsangebote für Aus­stei­ge­r*in­nen tun ihre Wirkung. Die größten Fortschritte zur Eindämmung des Tabakkonsums haben übrigens Mauritius und die Niederlande erzielt. Mit Brasilien und der Türkei zählen sie zu den Ländern mit den meisten Vorkehrungen.Ex­per­t*in­nen vermuten, dass bis 2025 etwa 10 Prozent weniger Menschen als noch Anfang der 2000er rauchen werden. Und davon profitiert auch das Gesundheitssystem, weil weniger Menschen rauch- oder passivrauchbedingt Herz- oder Atemwegserkrankungen, Schlaganfälle oder Krebs bekommen. Marlena Wessollek"},{"date":"12.8.2023","title":"Menschen machen seltener Überstunden als vor 20 Jahren","author":"Eva Keller","link":"https://taz.de/die-gute-nachricht/!5949679&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Viele Menschen legen steigenden Wert auf eine bessere Work-Life-Balance. Sinkt dabei die Bereitschaft fürs Überstundensammeln? Daten vom Statistischen Bundesamt legen nahe: Ja, denn der Anteil der Vollzeitbeschäftigten mit überlangen Arbeitszeiten sinkt. „Überlang“ bedeutet hier länger als 48 Stunden pro Woche. 2002 waren es noch 12,3 Prozent, die zu lange arbeiteten, zehn Jahre später 13,6 Prozent. 2022 waren es dann aber nur noch 8,3 Prozent. Selbständige scheinen insgesamt anfälliger für Überstunden zu sein als Angestellte. Dafür fiel ihr Anteil stärker ab, nämlich um 22,1 Prozentpunkte in zwanzig Jahren: von 60,7 Prozent 2002 auf 38,6 Prozent in 2023. Laut einer aktuellen Studie der Bundesanstalt für Arbeitsschutz und Arbeitsmedizin wollen mehr als die Hälfte aller Beschäftigten ihre Arbeitszeit reduzieren. Lange Arbeitswochen können die Gesundheit belasten. Dem wollen sich viele offenbar nicht mehr aussetzen. Eva Keller"},{"date":"5.8.2023","title":"Der Kākāpō ist nicht mehr am Arsch","author":"Salome Neumann","link":"https://taz.de/die-gute-nachricht/!5944234&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Der Kākāpō ist ein einzigartiger Papagei. Er fliegt nicht, dafür kann er auf Bäume klettern, wird bis zu 95 Jahre alt und ist nachtaktiv. Aber die ersten Siedler Neuseelands schleppten vor 700 Jahren Fressfeinde wie Katzen, Wiesel und Ratten ein, vor denen sich der Kākāpō nicht schützen konnte. Dazu rodeten sie Wälder und damit den Lebensraum der Papageien.Das führte dazu, dass die Papageienpopulation bis 1995 auf ein Minimum von 51 Kākāpōs schrumpfte, wie Daten der neuseeländischen Naturschutzbehörde Department of Conservation zeigen. Die Umweltschützer begannen gemeinsam mit Maori, Schutzräume für die Vögel zu schaffen. Einige der kleinen Inseln wurden von Fressfeinden befreit und Vögel gezielt in sichere Gebiete umgesiedelt. Die Strategie ist erfolgreich. Bis heute gibt es wieder 250 Kākāpōs. Ein neuer Rekord. Damit hat sich die Population in sieben Jahren verdoppelt.Vier männliche Kākāpōs wurden nun von der kleinen Insel Whenua Hou/Codfish Island in ein geschütztes Gebiet in der Waikato-Region der großen Nordinsel ausgesetzt. Noch ist es ein Test, wie geeignet das neue Habitat ist. Doch damit leben nach 40 Jahren nun wieder 4 Kākāpōs auf neuseeländischem Festland. Das Ziel: Kākāpōpapageien auch dort wieder fest zu etablieren.Salome Neumann"},{"date":"29.7.2023","title":"Weniger Menschen müssen wegen Flüssigkeitsmangels ins Krankenhaus","author":"Salome Neumann","link":"https://taz.de/die-gute-nachricht/!5947587&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"2 bis 3 Liter Wasser braucht der menschliche Körper durchschnittlich am Tag. Klettern die Temperaturen auf über 30 Grad, auch deutlich mehr, sonst droht Flüssigkeitsmangel. Für ältere Menschen ist das Risiko besonders hoch. Mit dem Klimawandel werden in Deutschland die Sommer heißer und damit gesundheitsgefährdender. Gleichzeitig altert die Gesellschaft. Das führte lange dazu, dass immer mehr Menschen wegen Flüssigkeitsmangel im Krankenhaus stationär behandelt werden. Im Hitzejahr 2018 erreichten diese Zahlen einen Höchstwert von 141.600. Damit haben sich die Fälle innerhalb von 13 Jahren mehr als verdoppelt. Doch 2019 markiert eine Trendwende: von 2019 bis 2021 sind die Fälle nämlich wieder auf 107.500 jährliche Behandlungen gesunken. Darin steckt natürlich zuerst einmal ein Pandemie-Effekt. Die Krankenhäuser konnten in dieser Zeit weniger Menschen aufnehmen, sagt ein Sprecher der Krankenhausgesellschaft. Allerdings stiegen die Zahlen auch zuletzt nicht. Dafür könne es noch viele andere Gründe geben. Zum Beispiel klären Pflegeeinrichtungen verstärkt darüber auf, in Hitzeperioden ausreichend zu trinken. Salome Neumann"},{"date":"22.7.2023","title":"China baut Erneuerbare schneller aus als geplant","author":"Leon Holly","link":"https://taz.de/die-gute-nachricht/!5946712&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"China hat einen gewaltigen Energiehunger. Um ihn zu sättigen, baut das Land seit Jahren massiv erneuerbare Energien aus. Dabei gelten in China eigene Maßstäbe: So hat das Land mit über 310 Gigawatt (GW) installierter Windkraftleistung fast so viel wie der Rest der Welt zusammen. Bei großflächiger Fotovoltaik sind es mit fast 228 GW sogar etwas mehr als die Hälfte. Dazu kommen riesige Wasserkraftkapazitäten. Mit allen derzeit geplanten und im Bau befindlichen Projekten dürfte sich die Leistung bis Ende 2025 nochmal mehr als verdoppeln, wie die Organisation Global Energy Monitor berichtet. Sie geht davon aus, dass China dann sein für 2030 angesetztes Ziel von 1.200 GW Kapazität bereits erreicht haben wird – fünf Jahre früher als geplant.Gleichzeitig baut China auch klimaschädliche Kohlekraftwerke zu, wobei der Anteil der Kohle am Energiemix seit Jahren sinkt. Mit dem Ausbau muss aber bald Schluss sein, denn China will bis 2060 CO2-neutral werden. Bis dahin hat sich die Regierung ein weiteres Ziel für 2030 gesteckt: Spätestens dann sollen die Emissionen gipfeln – und anschließend abfallen. Leon Holly"},{"date":"15.7.2023","title":"Mehr Meer unter Schutz","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5944662&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Klimakrise, Plastikmüll, industrielle Fischerei – die Ozeane der Welt leiden unter der Menschheit. Es gibt aber Grund für Optimismus: Die Fläche der geschützten Meeresgebiete in der EU wächst. Von 2012 bis 2021 hat sie sich von 4 auf 12 Prozent verdreifacht. Bis 2030 sollen es 30 Prozent werden. Dazu hat sich die EU im Rahmen des Übereinkommens über die biologische Vielfalt verpflichtet.Deutschland macht das gut. Rund 26.000 Quadratkilometer, also 45 Prozent der Meeresfläche, sind hier geschützt – so viel wie Mecklenburg-Vorpommern und das Saarland zusammen. Frankreich schützt zwar mit 140.000 Quadratkilometern EU-weit die größte Meeresfläche, die macht aber nur einen Anteil von ungefähr 37 Prozent der landeseigenen Meeresfläche aus. Wie die konkreten Schutzmaßnahmen aussehen, ist je nach Gebiet unterschiedlich. Fischfang und sogar Schleppnetzfischerei sind nicht generell verboten, solange bestimmte Arten in diesem Gebiet nicht gefährdet werden.Alexandra Hilpert"},{"date":"8.7.2023","title":"Weniger Menschen arbeiten für Niedriglohn","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5943098&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"12,76 Euro pro Stunde oder 2.218 Euro brutto pro Monat – wer weniger verdient, arbeitet offiziell für Niedriglohn. Diese Zahlen richten sich nach dem mittleren Verdienst in Deutschland. Was mehr als ein Drittel darunter liegt, ist Niedriglohn. Zum Vergleich: Die Armutsgrenze liegt bei etwa 1.250 Euro netto im Monat. Die gute Nachricht: Der Anteil der Jobs im Niedriglohnsektor ist gesunken – in dem halben Jahr zwischen April und Oktober 2022 von 19 auf 12 Prozent. Das sind 1,4 Millionen Stellen. Grund dafür ist wahrscheinlich der Mindestlohn: Diesen hat die Bundesregierung im Oktober 2022 auf 12 Euro erhöht. Dadurch scheint das Gehalt der gesamten Lohngruppe gestiegen zu sein. Auch die Zahl der Jobs hat leicht zugenommen, es gibt also insgesamt mehr Arbeit. Und mehr Arbeit, die besser bezahlt wird. 6,1 Millionen Jobs bleiben im Niedriglohnsektor übrig. Laut EU-Daten betrifft das vor allem Frauen, junge Menschen und Arbeitnehmer:innen mit befristeten Verträgen. Auszubildende kommen in der Statistik nicht vor. Alexandra Hilpert"},{"date":"1.7.2023","title":"Europas Badegewässer haben eine gute Qualität","author":"Leon Holly","link":"https://taz.de/die-gute-nachricht/!5941551&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Dem Sprung ins kühle Nass steht diesen Sommer wenig im Weg, denn um die Qualität der Badegewässer in Europa ist es gut bestellt, teilte die Europäische Umweltagentur (EEA) diesen Juni mit. Knapp 96 Prozent der rund 20.000 untersuchten Badestellen genügten vergangenes Jahr den EU-Anforderungen. Mit Abstand die meisten von ihnen wurden als „exzellent“ bewertet, manche als „gut“ oder „ausreichend“. Deutschland liegt mit gut 90 Prozent „exzellenter“ Gewässer im oberen Mittelfeld. Am schlechtesten ist die Qualität aktuell in Polen, Ungarn und der Slowakei. Wer dagegen in besonders reinem Wasser schwimmen will, ist auf Zypern richtig. Auf der Insel und entlang ihrer Küsten stuften die Prü­fe­r fast alle Gewässer in die höchste Kategorie ein.Während sich die Qualität von Flüssen und Seen in den letzten Jahren etwa stabil gehalten hat, ist besonders das Wasser vor den Küsten so sauber wie lange nicht mehr. Das liegt laut EEA vor allem daran, dass der Wasseraustausch in den Meeren besonders groß ist, was bei der Selbstreinigung hilft. Leon Holly"},{"date":"24.6.2023","title":"In Europa werden mehr Bienen für die Landwirtschaft gehalten","author":"Nanja Boenisch","link":"https://taz.de/die-gute-nachricht/!5939814&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Bienen sind für Ökosysteme und Landwirtschaft unentbehrlich. Viele Wild- und Nutzpflanzen sind auf ihre Bestäubung angewiesen. Seit Jahren leidet die Biene aber genau wie andere Insekten unter chemischen Spritzmitteln, Parasiten, Viren oder Schädlingen. In Deutschland nimmt immerhin die Zahl der Im­ke­r:in­nen zu, und Städte versuchen, Flächen bestäuberfreundlich zu begrünen. In der EU wächst vor allem die Zahl der kommerziell gezüchteten Honigbienen: 2020 gab es mehr als acht Millionen Bienenstöcke in landwirtschaftlichen Betrieben, besonders viele in Rumänien. Die EU unterstützt den Bienenschutz mit Geld und Forschung. Auch die Länder, deren Bienenvölker bis 2020 geschrumpft sind, handeln: Frankreich etwa hat 2021 einen Aktionsplan für Bestäuber ins Rollen gebracht. Um Wildbienen jedoch steht es nach wie vor nicht gut, in Europa ist fast jede zehnte Art vom Aussterben bedroht. Aber: Insektenfreundliche Begrünung und weniger Pestizide helfen ihnen genauso wie den Honigbienen. Nanja Boenisch"},{"date":"17.6.2023","title":"Fleischersatzprodukteboomen in Deutschland","author":"Tim Kemmerling","link":"https://taz.de/die-gute-nachricht/!5937125&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Steht man vor dem Kühlregal mit den Fleischalternativen, bleibt kaum ein Traum aus Soja, Erbse oder Seitan unerfüllt: vegane Speckwürfel, Veggie-Gyros, kurze, dicke, scharfe Würstchen. Diese prall gefüllten Regale spiegeln sich auch in den vom Statistischen Bundesamt veröffentlichten Zahlen wider: 2022 wurden in Deutschland 6,5 Prozent mehr Fleischersatzprodukte produziert als im Vorjahr. Gleichzeitig sank die Fleischproduktion um 8,1 Prozent.Immer mehr Unternehmen steigen in diesen Markt ein. Vergangenes Jahr produzierten 51 Firmen Fleischalternativen, 2021 waren es 44. Darüber freuen sich nicht nur alle, denen Fleischersatzprodukte schmecken, sondern auch die Umwelt. Die wird wegen der kürzeren Transportwege durch die inländische Produktion nämlich weniger belastet.Gleichzeitig sinkt der Fleischkonsum pro Kopf in Deutschland seit 2019 stetig. Er liegt mit 76,4 Kilogramm allerdings noch weit über dem weltweiten Durchschnitt von 43,2 Kilogramm. Tim Kemmerlig"},{"date":"10.6.2023","title":"Mehr Menschen nutzen die Bahn für Reisen ins Ausland","author":"Tim Kemmerling","link":"https://taz.de/die-gute-nachricht/!5938573&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Die Deutsche Bahn holt auf. In den ersten drei Monaten dieses Jahres wurden 40 Prozent mehr internationale Reisen mit der Deutschen Bahn gebucht als im gleichen Zeitraum 2019. Und während der Fernverkehr der Bahn boomt, gerät die Luftfahrt ins Trudeln, 2022 lag die Anzahl der Fluggäste in Deutschland weit unter dem Vor-Corona-Niveau. Der Anstieg der Fernreisen mit dem Zug liegt auch am besseren Angebot der Deutschen Bahn: Seit 2016 wurden 20 Prozent mehr Sitzplätze, neue Züge und Direktverbindungen für Reisen ins Ausland geschaffen. Positive Nachrichten in Sachen Verkehrswende, die Deutschland auch bitter nötig hat. Denn hier wird, in absoluten Zahlen, im EU-Vergleich mit Abstand am meisten geflogen. Was es nun für mehr Reisewende braucht? Fernverkehr-Tickets sind immer noch oftmals teurer als Billigflieger, und jeder vierte Zug ist verspätet. Wenn sich das noch ändert, wer weiß, dann werden die Nachrichten von der Bahn vielleicht sogar noch besser.Tim Kemmerling"},{"date":"3.6.2023","title":"Brasilien schützt wieder mehr indigene Gebiete","author":"Fernanda Thome","link":"https://taz.de/die-gute-nachricht/!5935630&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Es mag paradox klingen, doch es stimmt: Die Jahre unter dem ehemaligen brasilianischen Präsidenten Jair Bolsonaro, der als Rechtsextremer auch die Indigenen Brasiliens attackierte, haben die indigene Bewegung des Landes gestärkt. Das Camp „Freies Land“ unter dem Motto „Brasilien zurückerobern“ war 2022 die größte indigene Versammlung der Welt. Dass Lula im letzten Jahr die Wahl gegen Bolsonaro gewann, bedeutet auch für die Indigenen einen Paradigmenwechsel. Dazu gehört, dass Lula sechs neue indigene Gebiete ausgewiesen hat. Die Dekrete garantieren, dass die natürlichen Ressourcen auf diesen Gebieten ausschließlich von Indigenen genutzt werden dürfen. In Brasilien gibt es mehr als 305 indigene Völker. Lange betrachtete der Staat sie als eine vorübergehende, aussterbende soziale Kategorie. Erst 1988 wurde ihr Recht auf organisatorische und kulturelle Unterschiede und vor allem auf ihr angestammtes Land in der Verfassung garantiert. Die Nationale Behörde für indigene Völker zählt derzeit 733 geschützte Gebiete, 13,8 Prozent des Staatsgebiets. Nach Lulas letztem Dekret warten noch 237 Gebiete, in denen Indigene leben, darauf, geschützt zu werden. Fernanda Thome"},{"date":"27.5.2023","title":"Die Zahl der Menschen, die Schutz in Deutschland finden, steigt","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!5934394&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Im Jahr 2022 kamen mehr als eine Million Geflüchtete nach Deutschland, fast alle flohen vor dem Krieg in der Ukraine. Anders als die meisten Geflüchteten aus anderen Ländern konnten sie direkt einreisen, ihren Wohnort frei wählen und auch sofort Arbeit suchen. Insgesamt lebten Ende des Jahres so 3,1 Millionen Menschen als Schutzsuchende in Deutschland. Seit 2006 fragt die Partei Die Linke die Bundesregierung jährlich nach der Zahl der Menschen, die als Schutzsuchende mit unterschiedlichem Status in Deutschland leben. Entstanden ist damit ein einzigartiger Überblick über Geflüchtete in Deutschland. In den vergangenen zehn Jahren hat sich die Zahl der Schutzsuchenden versechsfacht – unter anderem wegen der Kriege in Syrien, Afghanistan, im Irak und in der Ukraine. Das ist selbstverständlich keine gute Nachricht. Aber die Menschen, die nach Deutschland kommen, treffen auf eine verbesserte menschenrechtliche Lage, sodass inzwischen mehr von ihnen einen Schutzstatus erhalten. „Die Aufnahme von einer Million Menschen aus der Ukraine innerhalb kürzester Zeit macht deutlich, dass eine solidarische und unbürokratische Aufnahme möglich ist“, kommentiert die Linken-Politikerin Clara Bünger die aktuellen Zahlen. „Das konnte nur gelingen, weil Geflüchtete aus der Ukraine nicht in die staatlichen Aufnahmelager und Asylstrukturen gezwungen wurden.“ Sie fordert die Abschaffung großer Erstaufnahmeeinrichtungen. Empfohlener externer Inhalt Wir würden Ihnen hier gerne einen externen Inhalt zeigen. Sie entscheiden, ob Sie dieses Element auch sehen wollen: Externen Inhalt erlauben Ich bin damit einverstanden, dass mir externe Inhalte angezeigt werden. Damit können personenbezogene Daten an Drittplattformen übermittelt werden. Mehr dazu in unserer Datenschutzerklärung steffiOtaz_de.WebelementSwitch().setWebelementSwitch(\"html-vjzvyywel\"); Die taz-Grafik zeigt die Zahl der Menschen, die in jedem Jahr als Schutzsuchende in Deutschland leben. Die Differenz zwischen den Jahren bedeutet nicht, dass in einem Jahr so viele Menschen einreisten. Jährlich reisen viele Flüchtlinge auch in andere Länder weiter oder in ihre Heimatländer zurück, zahlreiche werden auch abgeschoben und manche eingebürgert. In all diesen Fällen tauchen sie nicht mehr in dieser Statistik auf. Die Differenz ist also ein Saldo der Ein- und Ausreisen beziehungsweise verschiedener Statuswechsel. In der Grafik sind relativ sichere Status grün und orange eingefärbt, ihr Anteil hat sich seit den 2000er Jahren deutlich erhöht. Hatten 2006 noch fast 50 Prozent aller Geflüchteten in Deutschland einen unsicheren Status als Asylsuchende oder Geduldete, sind es inzwischen nur noch 15 Prozent. Verbesserte Rechtslage für Geflüchtete Dass Kriegsflüchtlinge grundsätzlich überhaupt Schutz erhalten können, wurde erst durch die EU Teil des deutschen Rechts. Bis 2013 hieß es noch im deutschen Asylgesetz, dass ein Asylantrag „offensichtlich unbegründet“ ist, wenn Menschen „nur um einer kriegerischen Auseinandersetzung zu entgehen“ in Deutschland sind. Zuvor erhielten Kriegsflüchtlinge in der Regel eine Duldung. Eindrücklichstes Beispiel dafür sind Geflüchtete während des Bosnienkriegs zwischen 1992 und 1995. Mehr als 300.000 Menschen suchten damals Schutz in Deutschland, doch kaum jemand erhielt einen offiziellen Schutzstatus. Krieg sei keine politische Verfolgung hieß es damals – trotz Vertreibung und Genozid. Stattdessen erhielten sie oft nur kurzfristige Duldungen, die immer wieder verlängert wurden. Das hieß: Die Regierung sah den Aufenthalt der Menschen in Deutschland als unrechtmäßig an, verzichtete aber auf eine Abschiebung, weil diese unzumutbar war. Heute können Geflüchtete aus Kriegsgebieten im Rahmen des „subsidiären Schutzes“ einen rechtmäßigen Schutzstatus erhalten."},{"date":"20.5.2023","title":"Die Lieferketten funktionieren wieder besser","author":"Moritz Müllender","link":"https://taz.de/die-gute-nachricht/!5933073&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Die Bilder von Hunderten Containerschiffen, die vor etwa einem Jahr vor dem Hafen von Shanghai im Wasser dümpelten, gingen um die Welt. Nach Angaben des Datendienstes Marine Traffic stand im April 2022 weltweit etwa jedes fünfte Schiff im Stau. Pandemie, Krieg und Fachkräftemangel verzögerten die Lieferung und Produktion von Rohstoffen und Waren. Das gefährdete nicht nur den reibungslosen Ablauf der Weltwirtschaft, sondern verlangsamte hierzulande zum Beispiel die Wärmewende. Denn auch Wärmepumpen brauchen Bauteile. Doch mittlerweile zeichnet sich Entspannung ab: Laut dem ifo Institut für Wirtschaftsforschung meldeten im April 2023 nur noch rund 39 Prozent der Betriebe Engpässe bei der Materialversorgung. Im Februar waren es noch 45,4 Prozent. Die Industrie wird diese Entwicklung freuen. Allerdings ist eine brummende Wirtschaft für das Klima nur dann eine gute Nachricht, wenn wir sie mit erneuerbaren Energien antreiben. Moritz Müllender"},{"date":"13.5.2023","title":"Die Fahrradbranche boomt","author":"Amelie Sittenauer","link":"https://taz.de/die-gute-nachricht/!5931653&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Das geringe Infektionsrisiko an der frischen Luft machte das Fahrrad zu dem Transportmittel der Pandemie schlechthin. Kein Wunder, dass der Umsatz im Fahrradhandel 2020 kräftig anstieg: Damals erwirtschaftete die Branche im Vergleich zum Vorjahr 32,4 Prozent mehr Umsatz. Doch auch im Jahr 2022 sind die Umsatzzahlen für Fahrräder und Fahrradzubehör in Deutschland gestiegen: preisbereinigt um 2,4 Prozent gegenüber dem Vorjahr, wie das Statistische Bundesamt mitteilte. Damit liegen die Umsätze nur 0,7 Prozent unter dem Fahrrad-Rekordjahr 2020 – und das trotz angespannter Lieferketten und gestiegener Verbraucherpreise. Zum Vergleich: Im Einzelhandel insgesamt, ausgenommen Kraftfahrzeuge, gab es dieses Jahr zum ersten Mal seit 2009 einen realen Umsatzrückgang. Die florierende Entwicklung in der Rad-Branche lässt sich zum einen mit den E-Bikes erklären. Im Jahr 2019 gab es davon in Deutschland noch 4,5 Millionen, im Jahr 2022 waren es schon 8,4 Millionen. Der Boom erstreckt sich aber auf die gesamte Branche: Auch die Produktion „klassischer“ Fahrräder hat zugenommen. 1,7 Millionen wurden 2022 in Deutschland produziert, das sind 250.000 mehr als im Jahr zuvor.Amelie Sittenauer"},{"date":"6.5.2023","title":"In immer mehr Ländern wird queerer Sex entkriminalisiert","author":"Nicole Opitz","link":"https://taz.de/die-gute-nachricht/!5929947&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Obwohl es weltweit immer wieder Rückschläge für LGBTIQ+ gibt, so gibt es auch sie noch: die Fortschritte, die hoffen lassen. Weltweit wird immer häufiger queerer Sex entkriminalisiert. Das fand der Internationale Verband der Lesben, Schwulen, Bisexuellen, Trans und Intersexuellen (ILGA) heraus. Letztes Jahr waren es Antigua und Barbuda, Barbados und Saint Kitts and Nevis, die entsprechende Gesetze abschafften – und zuletzt kam Singapur dazu. Der Paragraf 337A, der 1938 von britischen Kolonialherren eingeführt wurde, sah für queeren Sex zwei Jahre Gefängnis vor. Er war schon von der singapurischen Regierung aktualisiert worden, nun wurde er ganz abgeschafft. Gleichzeitig jedoch wurde die Ehe in Singapur festgeschrieben zwischen einer Konstellation von Frau und Mann. Gesetze anderswo werden strikter: Ein Gesetz aus Uganda, ebenfalls aus der Kolonialzeit, wurde kürzlich verschärft – queeren Menschen droht damit die Todesstrafe. Queere Menschen leben also nicht zwangsweise sicherer, sie müssen sich ihre Rechte weiterhin erkämpfen. Nicole Opitz"},{"date":"29.4.2023","title":"Mehr Länder sind frei von Malaria","author":"Sean-Elias Ansa","link":"https://taz.de/die-gute-nachricht/!5928947&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"In Deutschland sind Mückenstiche zwar nervig, aber meist harmlos. Anders in feuchtwarmen Klimazonen: Hier übertragen Mücken die Krankheit Malaria. Etwa 40 Prozent der Weltbevölkerung lebt in diesen Breiten. Mit dem Stich der weiblichen Anopheles-Mücke gelangen sogenannte Plasmodien in die Blutbahn des Menschen und lösen eine Infektion aus. Die Infektion äußert sich durch grippeähnliche Symptome mit wiederkehrenden Fieberanfällen. Wird Malaria nicht schnell behandelt, ist sie lebensgefährlich. Jährlich sterben etwa 600.000 Menschen an der Krankheit. Daher setzte sich die Weltgesundheits­organisation (WHO) das Ziel, die Krankheit zurückzudrängen. Mit Erfolg: Seit 1955 bis heute kennzeichnete die WHO 41 Länder und die Südseeinsel La Réunion als malariafrei. Seit diesem Jahr zählen Aserbaidschan und Tadschikistan dazu. Die Anti-Malaria-Strategie fußt auf drei Maßnahmen: Moskitonetze, Mücken­schutzmittel und Medikamente. Seit 2021 gibt es außerdem den Impfstoff Mosquirix, der einer schweren Erkrankung vorbeugen kann. Sean-Elias Ansa Grafik: Anna Eschenbacher, Johanna Hartmann, Francesca Morini. Quelle: WHO. Fotos: Unsplash, stock.adobe.com"},{"date":"22.4.2023","title":"Die Windkraft-Flaute ist vorbei","author":"Lena Pinto","link":"https://taz.de/die-gute-nachricht/!5926512&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"In den ersten drei Monaten dieses Jahres sind in Deutschland 117 neue Windräder ans Netz gegangen. Das sind 17 Prozent mehr als im ersten Quartal 2022. Auch die Zahl der Genehmigungen stieg, um fast 40 Prozent. Das ist ebenfalls eine gute Nachricht, denn die größte Hürde beim Bau neuer Windräder – jedenfalls, wenn sie nicht im Meer stehen – besteht darin, dass die zuständige Behörde die Installation erlaubt. Seit 2018 war die Zahl neuer Windkraftanlagen an Land immer weiter gesunken, diese Entwicklung ist nun offenbar gestoppt. Um die Ziele des Erneuerbare-Energien-Gesetzes zu erreichen, müsste der Windkraftausbau allerdings noch deutlich schneller gehen. Zudem sind die neuen Windräder sehr ungleich verteilt.Es gibt ein starkes Nord-Süd-Gefälle: In Baden-Württemberg ist nur eine neue Anlage genehmigt worden, in Bayern zwei. Dass mehr Windräder gebaut wurden, liegt hauptsächlich an Nordrhein-Westfalen, Schleswig-Holstein und Niedersachsen. In Bayern gibt es besonders strenge Abstandsregeln, die den Bau neuer Windräder fast unmöglich machen. Lena Pinto Grafik: Anna Eschenbacher, Johanna Hartmann, Francesca Morini. Quelle: Fachagentur Windenergie an Land. Fotos: stock.adobe.com"},{"date":"15.4.2023","title":"Mehr Väter bleiben zu Hause","author":"Sophie Fichtner","link":"https://taz.de/die-gute-nachricht/!5925340&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"2022 haben 2,1 Prozent mehr Männer Elterngeld bezogen als im Jahr zuvor. Insgesamt sind 482.000 Männer in Deutschland also nicht arbeiten gegangen, sondern haben sich um ihre kleinen Kinder gekümmert. Im Vergleich waren es 1,4 Millionen Mütter. Fast dreimal so viele Frauen wie Männer haben also zwischen Windeln und Wäschebergen ihre berufliche Karriere hintangestellt. Aber immerhin, mehr Männer bleiben zu Hause. Der Väteranteil am Elterngeld steigt damit weiter auf 26,1 Prozent. In Sachsen, wo Frauen schon zu DDR Zeiten seltener am Herd blieben, war dieser Anteil 2022 mit 30,2 Prozent am höchsten. Ein Gleichstand wäre bei 50 Prozent erreicht. Ein Blick auf die Dauer, in der Elterngeld bezogen wurde, zeigt, wie groß die Kluft zwischen den Geschlechtern noch ist: Durchschnittlich bekamen Mütter 2022 für 14,6 Monate Elterngeld, Väter nur 3,6 Monate. Sophie Fichtner"},{"date":"8.4.2023","title":"Abschied von Benzin und Diesel","author":"Franziska Gerneth","link":"https://taz.de/die-gute-nachricht/!5923198&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Das wird auch die FDP nicht mehr verhindern: Spätestens seit die EU beschlossen hat, Autos mit Verbrennungsmotor auslaufen zu lassen, ist klar, dass Au­to­fah­re­r:in­nen auf nachhaltigere Alternativen umsteigen müssen. Und schon jetzt gibt es positive Entwicklungen auf Europas Straßen. Der Anteil neuer Fahrzeuge, die ohne Benzin oder Diesel fahren, ist vor allem in den vergangenen drei Jahren stark gestiegen. Besonders Elektro- und Hybrid­antriebe erfreuen sich steigender Beliebtheit. Jeder fünfte neu zugelassene Pkw fährt damit, ihr Anteil hat sich in den letzten drei Jahren verdoppelt. Berücksichtigt man zusätzlich Autos, die mit Erdgas oder Autogas fahren, erhöht sich der Anteil klimafreundlicher Fahrzeuge noch weiter. Diese verursachen zwar auch Emissionen, schneiden in ihrer Umweltbilanz aber deutlich besser ab als Fahrzeuge mit Benzin- oder Dieselantrieb. Beide Alternativen sorgen für deutlich reduzierten CO2-Ausstoß, weniger Feinstaub und Stickoxide. Ex­per­t:in­nen sind sich einig, dass langfristig der Elektroantrieb am besten geeignet ist, um die Emissionen auf den Straßen zu reduzieren. Vor allem, wenn die Autos mit Ökostrom fahren. Doch weil auch alternative Kraftstoffe und Antriebsarten Umweltprobleme mit sich bringen, bleibt das allerbeste Mittel, um Emissionen zu senken: Weniger Autos bauen, kaufen und fahren. Franziska Gerneth"},{"date":"1.4.2023","title":"Die Wildtiere breiten sich wieder in Europa aus","author":"Sean-Elias Ansa","link":"https://taz.de/die-gute-nachricht/!5922957&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Er hat dichtes Fell, nagt Bäume an und liebt das Wasser: der eurasische Biber. Wie viele andere Wildtiere in Europa war dieses Nagetier Mitte des 20. Jahrhunderts fast ausgerottet. Seitdem versuchten Naturschützer die Tierbestände zu erhalten oder neu anzusiedeln.Mit Erfolg, wie ein Bericht des Bündnisses „Rewildering Europe“ über die Entwicklung der Wildtierpopulationen zeigt. In den letzten fünf Jahrzehnten hätten sich 50 Tierarten, darunter europäische Bisons, Elche, Grauwölfe und sogar Braunbären, auf spektakuläre Weise erholt, heißt es. Maßgeblich dafür seien Gesetze, die unkontrollierte Jagd verhindern. Auch dass weniger Flächen für die Landwirtschaft bereitgestellt wurden und die Bereitschaft der Menschen, in der Nähe von wilden Tieren zu leben, sei entscheidend, sagen die Autor:innen. Laut den Naturschutzorganisationen gebe es daher in diesem Bereich „Grund für Optimismus“ – trotz des insgesamt dramatischen Rückgangs der Artenvielfalt. Sean-Elias Ansa"},{"date":"25.3.2023","title":"Die Zustimmung zum Klimaschutz steigt","author":"Luise Strothmann","link":"https://taz.de/die-gute-nachricht/!5921283&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Stellen Sie sich vor: Alle sind eigentlich für ein Tempolimit auf Autobahnen, glauben aber, dass die anderen dagegen sind. Das nennen So­zi­al­psy­cho­lo­g*in­nen „pluralistische Ignoranz“: Menschen schätzen die Einstellungen anderer systematisch falsch ein. 2022 hatte eine große Studie in den USA herausgefunden, dass über 80 Prozent der US-Amerikaner*innen die Unterstützung ihrer Mit­bü­rge­r*in­nen für Klimaschutz massiv unterschätzen. Sie ist fast doppelt so hoch wie vermutet. Im Rahmen der sogenannten Ariadne-Analyse haben nun For­sche­r*in­nen die Einstellungen zu Klimaschutzmaßnahmen in Deutschland untersucht – und wie sie sich über die Zeit verändert haben. Die Ergebnisse basieren auf Umfragen, mithilfe weiterer Daten wurden Schätzwerte für jede einzelne Region berechnet. Insgesamt nimmt die Zustimmung zwischen 2017 und 2021 deutlich zu. Jedoch mit starken Unterschieden. In Städten ist sie in der Regel höher als auf dem Land, in den westdeutschen Bundesländern oft höher als im Osten. Aber das Bild ist beim genaueren Hinsehen differenzierter: In Gebieten, in denen erfolgreich Solarprojekte realisiert wurden, stieg die Akzeptanz zum Beispiel überproportional. Und steigende Zustimmung in einer Region steckt Nachbargebiete an. Die Bevölkerung ist also oft weiter als die klimapolitischen Pläne der Regierung. Sogar weiter, als wir selbst denken. Luise Strothmann"},{"date":"18.3.2023","title":"Immer mehr Kinder sind gegen HPV geimpft","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5920584&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Humane Papillomviren, kurz HPV, gehören zu den am weitesten verbreiteten sexuell übertragbaren Krankheiten der Welt. Deshalb wird die Impfung vor dem ersten Geschlechtsverkehr empfohlen. Die Viren sind der Hauptauslöser von Gebärmutterhalskrebs. Im Schnitt steckt sich jeder Mensch einmal im Leben an. Meistens heilt die Krankheit innerhalb von zwei Jahren aus. Doch in manchen Fälle bleiben die Viren, verändern Zellen an den Schleimhäuten und erhöhen damit das Krebsrisiko.Umso erfreulicher also, dass der Anteil der vollständig gegen HPV geimpften 14-Jährigen stetig steigt. Von 18 Prozent bei Kindern, die 2003 geboren wurden, auf 38 Prozent beim Jahrgang 2007. Aber es gibt noch einen großen Unterschied zwischen den Geschlechtern: 50 Prozent der Mädchen sind geimpft, dagegen nur 25 Prozent der Jungen. Grund hierfür ist, dass die Ständige Impfkommission die Impfung schon seit 2007 für Mädchen, aber erst seit 2018 auch für Jungen empfiehlt. Die Anzahl der Männer, die infolge einer HPV-Infektion an Krebs erkranken, ist zwar nur etwa ein Drittel so groß wie jene der Frauen. Doch unmöglich ist es nicht. Der Krebs befällt dann überwiegend After und Mundhöhle. Hinzu kommt: Mit einer Impfung werden die Viren nicht an Se­xu­al­part­ne­r:in­nen weitergegeben. Die Verbreitung könnte eingedämmt werden. Positiv also, dass Jungen seit 2018 aufgeholt haben. Der Impfunterschied zu Mädchen hat sich bis 2021 um 14 Prozentpunkte verkleinert. Alexandra Hilpert"},{"date":"11.3.2023","title":"Auf immer mehr Flächen wird ökologisch geackert","author":"Christopher Wandschneider","link":"https://taz.de/die-gute-nachricht/!5918426&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Zuletzt gab es für die Bio-Landwirtschaft in Deutschland wenig gute Nachrichten. Gestiegene Lebensmittelpreise durch den Ukrainekrieg sorgten dafür, dass Ver­brau­che­r*in­nen beim Bioessen sparten, der Markt ist daraufhin 2022 erstmals geschrumpft. Dementsprechend zögerten auch Höfe, auf Ökolandbau zu wechseln, so der Bauernverband. Dabei sei das Interesse am Umstieg noch kurz vor Kriegsbeginn so hoch gewesen wie nie.Da ist es doch beruhigend, zu sehen, dass der Trend auf längere Sicht und mit Blick auf Gesamteuropa deutlich positiv ist – unstoppable, hoffentlich. Zwischen 2005 und 2020 ist der Bio-Anteil an den EU-Agrarflächen nämlich auf 9 Prozent gestiegen. Ganz vorne liegt Österreich, wo ein Viertel der Agrarflächen bio bewirtschaftet wird. Estland konnte seinen Anteil verdreifachen. Deutschland schlägt sich mit knapp 10 Prozent mittelmäßig.Bis 2030 soll in Deutschland die 30-Prozent-Marke erreicht sein, dafür muss das Wachstum schneller gehen. Der Inflationsknick an der Biomarktkasse wird voraussichtlich eher keine Langzeiterscheinung werden. Auch hier hilft der Blick zurück: In den letzten 20 Jahren hat sich die Nachfrage nach Bio laut Umweltbundesamt verzehnfacht. Christopher Wandschneider"},{"date":"4.3.2023","title":"Die Luft in deutschen Städten wirdbesser","author":"Nanja Boenisch","link":"https://taz.de/die-gute-nachricht/!5917211&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Deutschland reißt bekanntlich gerne seine Klimaziele. Gut abgeschnitten haben die Städte dafür bei der Luftverschmutzung. Laut Umweltbundesamt war 2022 im Jahresmittel nur an zwei Orten – München und Essen – mehr Stickstoffdioxid (NO2) in der Luft als erlaubt. Der Grenzwert liegt bei 40 Mikrogramm NO2 pro Kubikmeter Luft. Das schädliche Gas erzeugen vor allem Dieselautos. Weniger Verkehr zu Coronazeiten und neuere Fahrzeuge ließen die NO2-Konzentration sinken. Feinstaub, der auch aus Auspuffen und durch Reifenabrieb kommt, blieb sogar bundesweit unter dem Limit. Das ist gut für Mensch und Natur: Bessere Luft reduziert vorzeitige Todesfälle, Pflanzen altern langsamer. Der Haken: „Die geltenden Grenzwerte für Stickstoffdioxid wurden vor mehr als 20 Jahren festgelegt“, mahnte Umweltbundesamt-Präsident Dirk Messner, sie sind zu hoch. For­sche­r:in­nen zufolge ist schon viel weniger verschmutzte Luft gefährlich. Die Weltgesundheitsorganisation schlug für NO2 einen Grenzwert von 10 Mikrogramm pro Kubikmeter vor. Dem will sich die EU-Kommission schrittweise annähern. Nanja Boenisch"},{"date":"25.2.2023","title":"Deutschland wird fleischfreier","author":"Dunja Batarilo","link":"https://taz.de/die-gute-nachricht/!5915484&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Freiheit für die Ferkel! Das forderte Rennschwein Rudi Rüssel schon Mitte der 1990er Jahre. Es hat noch ein bisschen gedauert, aber derzeit nähern wir uns tatsächlich Rudis Vision. Die Deutschen essen weniger Fleisch – und vor allem: weniger Schwein. Die Fleischproduktion hierzulande ist im Jahr 2022 stark gesunken, teilte das Statistische Bundesamt mit. Den stärksten Rückgang gab es dabei beim Schweinefleisch: Die Schlachtmenge ging allein 2022 um fast zehn Prozent zurück.Eine kürzlich erschienene Studie zeigt, dass den Deutschen Tierwohl und Klimaschutz offenbar tatsächlich am Herzen liegt: Eine Mehrheit der Befragten würde eine höhere Fleischsteuer unterstützen, wenn die Abgabe diesen Zwecken diente. Je höher die Steuer ausfiele, desto ratsamer wäre es, sie mit Tier- statt Klimaschutz zu begründen, da dann die Unterstützung höher ausfalle, schreiben die Autor:innen. Tatsache ist: Rudis Traum ist noch nicht vom Tisch.Dunja Batarilo"},{"date":"18.2.2023","title":"Saufen, bis der Arzt kommt? Das machen immer weniger","author":"Sean-Elias Ansa","link":"https://taz.de/die-gute-nachricht/!5913874&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Maske auf, Flasche zu? Durch die weitreichenden Kontaktbeschränkungen während der Coronapandemie gab es ab 2020 viel weniger Möglichkeiten, gemeinsam zu feiern, was in Deutschland ja oft bedeutet: Alkohol zu trinken. Und das hatte gute Folgen. Parallel dazu gingen die Krankenhauseinweisungen wegen Alkoholvergiftung signifikant zurück – insbesondere unter Jugendlichen von 10 bis 19 Jahren, wie das Statistische Bundesamt berichtet. Die Anzahl der Fälle in dieser Altersgruppe lag in Deutschland 2021 bei rund 11.700. Das war fast die Hälfte weniger als im Vor-Coronajahr 2019 und insgesamt der niedrigste Stand seit dem Jahr 2001.Doch es kann nicht nur am pandemiebedingten Mangel an Gelegenheit liegen. Bereits seit 2012 gehen die Zahlen nach unten. Es sind dabei vor allem Männer aller Altersgruppen, die sich erst in den Vollrausch und dann in die Klinik trinken – 2021 machten sie rund 70 Prozent aller Fälle aus. Nun sind die Kneipen wieder offen, die Maske liegt zerknittert in der Ecke. Die nächste Erhebung wird zeigen, ob sich der Trend fortsetzt. Sean-Elias Ansa"},{"date":"11.2.2023","title":"Durch sauberes Wasser ist der Parasit Guinea-Wurm fast verschwunden","author":"Sean-Elias Ansa","link":"https://taz.de/die-gute-nachricht/!5912266&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Es gibt Geschöpfe, die echt süß sind – und es gibt den Guinea-Wurm. Dieser Parasit lebt in seinem Wirt: dem Menschen. Der bis zu 120 Zentimeter lange Wurm wandert durch den Körper und verursacht dabei oft monatelang starke Schmerzen. Wenn er die Haut durchbohrt, um den Wirt wieder zu verlassen, entsteht dort ein Geschwür, das sich zusätzlich entzünden kann.Neue Zahlen zeigen, dass der Kampf gegen den Wurm fast gewonnen ist. Das US-amerikanische Carter Center meldete 2022 nur noch 13 Fälle weltweit. In den Achtziger Jahren gab es jährlich noch etwa 3,5 Millionen Meldungen in Asien und Afrika. Seitdem arbeiten Organisationen, Behörden und Freiwillige gegen die Ausbreitung.Darf man sich darüber freuen, wenn eine Art ausstirbt, nur weil es ein Parasit ist? Im Fall des Guinea-Wurms ja. Auch deswegen, weil weniger Fälle ein Indikator für eine bessere Wasserqualität sind. Denn Menschen nehmen die Wurmlarven durch verunreinigtes Wasser auf. Die Larven im Wasser wurden zwar auch mit Chemikalien bekämpft, der Hauptgrund für den Rückgang des Parasiten ist aber der Einsatz von Wasserfiltern und die Bereitstellung sauberer Trinkwasserquellen in betroffenen Regionen. Laut WHO soll der Guinea-Wurm bis 2030 komplett ausgerottet sein. Sean-Elias Ansa"},{"date":"4.2.2023","title":"Photovoltaik ist auf dem Vormarsch","author":"Pia Pentzlin","link":"https://taz.de/die-gute-nachricht/!5910597&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Mit Blick auf die Energiekrise und die Räumung von Lützerath bekommt man schnell das Gefühl, es gehe nur schleppend voran mit der Energiewende. Einen Hoffnungsschimmer liefert da die wachsende Bedeutung von Solarzellen. Der Anteil der Photovoltaik an der insgesamt produzierten Strommenge in Deutschland nimmt nämlich seit Jahren immer weiter zu. Das zeigen unter anderem Zahlen der Arbeitsgemeinschaft Energiebilanzen und des Statistischen Bundesamts. Und es wird noch besser: Neue Solaranlagen gehören zu den günstigsten Möglichkeiten der erneuerbaren Stromerzeugung. Auf Nimmerwiedersehen, fossile Energien, ein freundliches Hallo an die Erneuerbaren! Vor allem der Blick auf die Zahlen zwischen 2016 und 2022 zeigt, dass sich in Deutschland etwas bewegt. In den letzten sechs Jahren hat sich der Anteil der Photovoltaik an der Stromversorgung fast verdoppelt. Und auch in Zukunft wird Photovoltaik weiterhin gefragt sein. Laut einer Studie des Fraunhofer-Instituts soll der Solarstromanteil 2030 auf bis zu 30 Prozent ansteigen. Reichlich Fläche für Solarzellen gibt es allemal – auf den Dächern der Großstädte, auf freien Feldern oder auch schwimmend auf dem Wasser. Pia Pentzlin"},{"date":"28.1.2023","title":"Das Risiko, an Krebs zu sterben, sinkt","author":"Malene Gürgen","link":"https://taz.de/die-gute-nachricht/!5909013&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Statistiken sind eine seltsame Sache, insbesondere, wenn es um Krankheit und Tod geht. Statistiken sind offiziell, objektiv, berechenbar. Aber wenn wir selbst oder jemand, der uns nah ist, schwer krank ist, dann gibt es nur noch Subjektivität. Eine winzige Zahl kann riesig groß werden, wenn sie das Todesrisiko benennt für jemanden, der uns wichtig ist. Wozu dann also überhaupt solche Statistiken? Weil sie uns etwas über Präventions- und Interventionsmöglichkeiten erzählen können. So wie diese Zahlen: Das Risiko, an einer Krebserkrankung zu sterben, ist in den USA in den letzten 20 Jahren um fast 30 Prozent gesunken. Das liegt an besseren Methoden zur Früherkennung und Behandlung. Und daran, dass immer weniger Menschen rauchen. Unklar ist noch, wie stark sich dieser Trend während der Pandemie fortgesetzt hat, in der Menschen möglicherweise Früherkennungstermine nicht wahrgenommen haben oder schlechter versorgt waren.Malene Gürgen"},{"date":"21.1.2023","title":"Der Union-Island-Gecko ist zurück","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5907417&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Was ist so klein und leicht wie eine Büroklammer und wird im Sonnenlicht bunt? Der Union-Island-Gecko! 2005 entdeckten Wis­sen­schaft­le­r:in­nen das Reptil auf der kleinen Karibikinsel Union Island. Nicht nur der Körper, auch das Habitat des Geckos ist winzig: Das Waldstück, in dem er vorkommt, ist nicht einmal einen Quadratkilometer groß. Wegen seiner schillernden Farben wurde das neu entdeckte Tier schon bald exzessiv gejagt und als Sammlerstück an Reptilienfans verkauft. 2017 war der Union-Island-Gecko die meistgehandelte Reptilienart aus der Karibik. Ein Jahr später zeigte eine Untersuchung, dass die Population seit 2005 um 80 Prozent geschrumpft war.Um der weiteren Zerstörung de
