990 können sich Kinder freiwillig einmal im Jahr von Zahnärzten oder Fachpersonal untersuchen lassen und an einem Zahnputztraining samt Aufklärung zur Zahngesundheit teilnehmen. Bundesweit nutzen jährlich etwa 4,6 Millionen Kinder und Jugendliche dieses Angebot. Laut der Studie haben besonders Kinder aus Familien, in denen die Eltern weniger gebildet sind, von der Vorsorge profitiert. Diese Kinder sind ohne Vorsorgeuntersuchung in der Regel seltener beim Zahnarzt und mögliche Karies wird später erkannt. Lena Schega"},{"date":"29.3.2025","title":"Mehr Auszubildende in der Pflege","author":"Lena Schega","link":"https://taz.de/die-gute-nachricht/!6076083&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Pflege und Notstand, das lässt sich kaum noch anders denken als in einem Wort. Laut dem Institut der deutschen Wirtschaft (IW) fehlten 2023 rund 33.000 Pflegekräfte. Im Jahr 2035 könnten es schon 493.000 Pflegekräfte zu wenig sein, prognostiziert das IW. Uff. Aber, und hier kommt die gute Nachricht: Es tut sich was. Im Jahr 2024 wurden in der Pflege 9 Prozent mehr Ausbildungsverträge abgeschlossen als im Vorjahr. Insgesamt wurden rund 59.500 Verträge unterschrieben, 5.100 mehr als 2023, wie das Statistische Bundesamt mitteilte. Das könnte an der 2020 eingeführten generalisierten Pflegeausbildung liegen. Sie hat die vormals getrennten Ausbildungen in der Kranken-, Alten- und Kinderkrankenpflege vereint und modernisiert. Das scheint sie attraktiver gemacht zu haben, auch für Männer. Deren Anteil in der Pflegeausbildung stieg von 2023 auf 2024 um 4 Prozentpunkte, von 22 auf 26 Prozent. Es bleibt zu hoffen, dass die Pflegekräfte der Zukunft auch angemessen entlohnt werden. Lena Schega"},{"date":"22.3.2025","title":"In Deutschland wird mehr Biogemüse geerntet","author":"Henning Giesen","link":"https://taz.de/die-gute-nachricht/!6074313&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Die ökologischsten Bauern haben zwar nicht die dicksten Brokkoli, aber zumindest ernten sie immer mehr davon. Fast 7.000 Tonnen Brokkoli waren es 2024, über 1.500 Tonnen mehr als im Vorjahr. Insgesamt stieg die Menge Biogemüse, die geerntet wurde, laut dem Statistischen Bundesamt um gut 10 Prozent gegenüber 2023. Den größten Teil machten dabei mit über 193.000 Tonnen Karotten aus. Dahinter folgen mit großem Abstand Zwiebeln mit etwa 51.000 Tonnen sowie etwa 49.000 Tonnen Rote Bete auf dem dritten Platz.Dass die Lager voller werden, liegt daran, dass auf immer mehr Gemüseäckern ökologisch gewirtschaftet wird. Der Flächenanteil von Biogemüse stieg 2024 auf 15,3 Prozent der gesamten Gemüseanbauflächen. Damit setzt sich der positive Trend der letzten Jahre fort. Für die Zukunft gibt es aber noch weit höhere Ziele. So schreibt die EU mit dem Green New Deal fest, bis 2030 25 Prozent der Landwirtschaftsflächen ökologisch zu nutzen, die scheidende Bundesregierung hat 30 Prozent zum Ziel erklärt. Henning Giesen"},{"date":"15.3.2025","title":"Immer weniger Menschen rauchen","author":"Dunja Batarilo","link":"https://taz.de/die-gute-nachricht/!6072538&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Wer sich noch an die 1990er Jahre erinnert, sieht sie vor sich: blaugraue Schwaden, überall. In Wohnzimmern, Konferenzsälen, Kinos. Noch im Jahr 2000 ruinierten sich 33 Prozent der Weltbevölkerung die Lunge durch Tabakrauch. Schluss damit, rief die Weltgesundheitsorganisation und gab das Ziel aus, diese Zahl bis zum Jahr 2030 um knapp ein Drittel zu verringern. Und die Richtung stimmt: 2022 rauchten einem aktuellen Bericht der WHO zufolge nur noch 21 Prozent, also knapp je­de*r Fünfte über 15 Jahren. Dabei geht es übrigens nicht nur um Zigaretten: In die Statistik fließt jeglicher Tabakkonsum ein, egal ob gedreht, gestopft oder verdampft. Nur E-Zigaretten sind außen vor. Durch die Bank vergiften sich damals wie heute übrigens mehr Männer als Frauen durch Tabak. Interessant ist auch die Verteilung von Rau­che­r*in­nen. In den meisten afrikanischen Ländern waren Zigaretten offenbar schon immer uncool, leuchtendes Vorbild ist Ghana, wo nur 3,4 Prozent rauchen. Auf dem amerikanischen Kontinent hingegen bricht die positive Entwicklung seit zwei Jahren ein. Tabaktoxische Männlichkeit? Dunja Batarilo"},{"date":"1.3.2025","title":"Ham­bur­ge­r*in­nen haben mehr Deutschlandtickets als Autos","author":"Marie Gogoll","link":"https://taz.de/die-gute-nachricht/!6069902&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Rund 924.000 Ham­bur­ge­r*in­nen nutzten im September 2024 das Deutschlandticket. Die Zahl der zugelassenen Pkw lag dem Kraftfahrt-Bundesamt zufolge zu der Zeit hingegen nur bei rund 813.000. Das liegt auch an Subventionen des Senats. Seit September letzten Jahres bezahlt der Stadtstaat allen Schü­le­r*in­nen ein Deutschlandticket. Außerdem gibt es eine Förderung für Menschen, die existenzsichernde Leistungen wie die Grundrente beziehen. Für sie kostet das Deutschland­ticket nur 22,50 Euro. Als zu Jahresbeginn der Normalpreis von 49 auf 58 Euro angestiegen ist, wurde auch die Förderung entsprechend erhöht.Die Anzahl der Autos geht in der Hansestadt schon seit Jahren zurück. 2022 waren noch 439 Autos pro 1.000 Ein­woh­ne­r*in­nen zugelassen, 2024 nur noch 430.Ein größerer Anteil des ÖPNV am Verkehrsaufkommen kann zu besserer Luftqualität und weniger Straßenlärm führen. Die Förderung des öffentlichen Nahverkehrs macht Städte daher auch lebenswerter. Marie Gogoll"},{"date":"22.2.2025","title":"Seit 2024 protestieren mehr als 6 Millionen Menschen gegen rechts","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6068239&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Zwischen 1,7 und 2,2 Millionen Menschen demonstrierten nach Analysen der taz seit dem 1. Januar 2025 gegen die AfD und den Rechtsruck im Land. In den ersten Januarwochen liefen die Proteste noch langsam an, dann paktierte CDU-Chef Friedrich Merz am 29. Januar 2025 mit der extrem rechten AfD um eine Mehrheit für einen Antrag zur Verschärfung der Migrationspolitik im Bundestag zu erreichen. Er brach das Tabu der demokratischen Parteien, keine gezielten Mehrheiten mit der AfD zu suchen. Daraufhin richteten sich die Proteste nun auch gegen die CDU. De­mons­tran­t:in­nen werfen ihr vor, die parteipolitische Brandmauer gegen rechts eingerissen zu haben.Bereits im Januar 2024 gab es eine breite Protestbewegung gegen rechts. Damals beteiligten sich nach Analyse der taz bis zu 4,7 Millionen Menschen. Auslöser war eine Correctiv-Recherche über ein Geheimtreffen von Rechtsextremen und AfD-Politiker:innen, bei dem sie Abschiebepläne für Minderheiten schmiedeten. Der andauernde Protest zeigt, dass die zivilgesellschaftliche Brandmauer hält.Sean-Elias Ansaund Lalon Sander"},{"date":"15.2.2025","title":"Der Anspruch auf Mutterschutz nach einer Fehlgeburt wird ausgeweitet","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6066698&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Der Bundestag stärkt kurz vor den Neuwahlen die Rechte von Frauen. Ende Januar haben SPD, Grüne und Union einen Gesetzentwurf beschlossen, der Frauen auch nach einer Fehlgeburt ab der 13. Schwanger­schaftswoche ein Recht auf Mutterschutz garantiert. Diesem Beschluss geht der jahrelange Einsatz von Betroffenen voraus. Als Natascha Sagorski eine Fehlgeburt erlitt und ihr Arzt sie am folgenden Tag wieder zur Arbeit schicken wollte, startete sie eine Petition. Über 70.000 Menschen unter­zeichneten auf der Plattform des Bundestags und bei Openpetition, woraufhin sie die Unterschriften im September 2023 mit Mit­strei­te­­r:in­nen an Bundestagsabgeordnete übergab.Bisher haben Schwangere erst nach dem sechsten Schwangerschaftsmonat Anspruch auf Mutterschutz. Das neue Gesetz tritt am 1. Juni 2025 in Kraft und bietet dann eine gestaffelte Lösung, die die zunehmende physische und psychische Belastung im Verlauf der Schwangerschaft berücksichtigen soll. Je nach Zeitpunkt der Fehlgeburt haben Frauen damit Anspruch auf zwei bis acht Wochen Mutterschutz. Yannik Achternbosch"},{"date":"8.2.2025","title":"Lithium-Ionen-Akkus werden günstiger","author":"","link":"https://taz.de/die-gute-nachricht/!6065554&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Für eine umweltfreundliche Mobilität und eine nachhaltige Energieversorgung sind sie unverzichtbar: Lithium-Ionen-Akkus. Man findet sie in E-Autos, Smartphones, elektrischen Zahnbürsten und vielen anderen Geräten. Dabei haben sie eine lange Lebensdauer und verlieren wenig Energie, sind also sehr effizient. In den vergangenen Jahren sind die Preise für diese Akkus immer weiter gesunken, und Ex­per­t:in­nen gehen davon aus, dass dieser Trend anhält. Das doppelt Gute daran: Werden die aufladbaren Batterien günstiger, können auch die Preise für die Geräte sinken, in denen sie ihren Dienst verrichten. Durch günstigere E-Autos tragen billigere Akkus so dazu bei, die Klimaziele im Verkehr zu erreichen.Wichtig sind die Akkus auch und gerade für die Energiewende. Denn produzieren Wind- oder Solaranlagen dank guter Wetterbedingungen mehr Strom, als gebraucht wird, können Akkus diesen speichern. Bei Windstille und Dunkelheit ist so Energie verfügbar, auch wenn die Anlagen nicht laufen. So können Netzschwankungen ausgeglichen werden, es sind weniger fossile Kraftwerke als Reserve für Dunkelflauten nötig und auf Dauer wird der Strom günstiger. Und je billiger die Speicher sind, desto attraktiver wird es für Unternehmen und Hausbesitzer:innen, in Solarenergie zu investieren. Denn so können sie den günstigen selbst erzeugten Strom verbrauchen, statt teureren einkaufen zu müssen. Anja Krüger"},{"date":"1.2.2025","title":"Die Justiz holt mehr Geld aus Straftaten zurück","author":"Christian Rath","link":"https://taz.de/die-gute-nachricht/!6063184&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Die Rechtsbehörden schaffen es immer besser, kriminell erlangtes Vermögen für die Staatskasse oder die Opfer von Straftaten einzuziehen. Das hat der Deutsche Richterbund durch eine Abfrage bei den Landesjustizverwaltungen herausgefunden. Im Jahr 2023 wurden bundesweit über 500 Millionen Euro Einnahmen aus Straftaten zurück­gewonnen und damit rund 50 Millionen Euro mehr als im Vorjahr. 2024 wurde die Summe von 500 Millionen Euro sogar schon in den ersten drei Quartalen erreicht. Dabei geht es zum Beispiel um Einnahmen aus Geldwäsche, Wirtschafts­kriminalität, Betrug oder Drogenhandel. Mit dem zurück­geholten Vermögen sollen einerseits Opfer finanziell entschädigt werden. Außerdem ist das Ziel, dass verurteilte Kriminelle auch nach Ver­büßung der Strafe nicht die Erträge ihrer Taten genießen können. Die größere Summe, die nun zurückgeholt werden konnte, dürfte wohl keine bloße Folge zunehmender Kriminalität sein (dann wäre sie ja auch keine gute Nachricht, sondern Symptom einer unerfreulichen Entwicklung). Vermutlich ist der Anstieg eher die Folge gesetzlicher Ver­einfachungen der Vermögens­einziehung in den Jahren 2017 und 2019. Staatsanwaltschaften wurden ver­pflichtet, kriminelle Vermögenswerte im Interesse der Opfer einzu­ziehen. Früher mussten sich die Opfer vor Gericht selbst darum kümmern. In den vergangenen Jahren wurden die Staatsanwaltschaften hierbei immer effizienter. Es gilt also mehr denn je: Verbrechen soll sich nicht lohnen. Christian Rath"},{"date":"25.1.2025","title":"Deutschland genehmigt so viel Windkraft wie noch nie","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6061795&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Diese gute Nachricht beginnt mit einer schlechten Nachricht. Beim Ausbau der Windkraft wurde im vergangenen Jahr das Ziel der Bundesregierung erneut verfehlt. Aber: Das könnte sich in den kommenden Jahren ändern. Denn 2024 wurden so viel neue Windkraftanlagen genehmigt wie noch nie zuvor in Deutschland. 2.400 Anlagen ließen die Behörden neu zu. Diese haben eine Gesamtleistung von 14,1 Gigawatt – das sind 85 Prozent mehr als im Jahr 2023 und 50 Prozent mehr als im bisherigen Rekordjahr 2016. Die Daten stammen aus einer Auswertung des Bundesverbandes Windenergie und des Anlagenbauverbandes VDMA. Im laufenden Jahr 2025 dürfte sich nun der tatsächliche Ausbau der Windkraft von 2,5 Gigawatt auf etwa 5 Gigawatt verdoppeln. Das ist zwar weiterhin unter dem Jahresziel der Bundesregierung­ – dieses könnte so aber in den kommenden Jahren wieder eingeholt werden. Schon jetzt ist Wind allerdings der wichtigste Energieträger in der Stromproduktion: Ein Drittel des Stroms kam 2024 aus der Windkraft. Lalon Sander"},{"date":"18.1.2025","title":"Im Januar wird deutlich weniger Alkohol als im Dezember verkauft","author":"Johanna Weinz","link":"https://taz.de/die-gute-nachricht/!6059621&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Die Scannerdaten aus dem Lebensmittel­einzelhandel zeigen, dass die Verkaufszahlen für alkoholische Getränke im Januar in den Jahren 2022, 2023 und 2024 deutlich unter denen des vorherigen Dezembers liegen. Auch im Vergleich zum gesamten Jahr ist der Absatz im Januar deutlich geringer. Möglicherweise liegt das am „Dry January“, dem alkoholfreien Januar. Bekannt wurde das Konzept durch die Britin Emily Robinson, die im Januar 2011 beschloss, in der Trainingsphase für ihren Halbmarathon keinen Alkohol mehr zu trinken. Sie schlief besser und hatte das Gefühl, mehr Energie für den Lauf zu haben. Zusammen mit der Organisation „Alcohol Change UK“ machte sie daraus eine Gesundheits­kampagne. Mittlerweile wird der Dry January auch in Deutschland immer beliebter. Der Sucht- und Drogenbeauftragte der Bundesregierung ebenso wie die Bundeszentrale für gesundheitliche Aufklärung jedenfalls begrüßen den Dry January. Sie empfehlen regelmäßige Auszeiten – und zwar nicht nur zu Jahresbeginn.Johanna Weinz"},{"date":"11.1.2025","title":"Weltweit können mehr Menschen lesen und schreiben","author":"Ralf Pauli","link":"https://taz.de/die-gute-nachricht/!6058249&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Obwohl Kriege und Krisen den Zugang zu Bildung in vielen Ländern erschweren bis unmöglich machen, geht der Analphabetismus weltweit zurück. Nach Daten der Weltbank sank die Quote bei den über 14-Jährigen im Jahr 2023 auf 12,6 Prozent. Das ist der niedrigste je ermittelte Wert, im Jahr 1976 lag er noch fast dreimal so hoch. Dabei kann in Ländern wie Afghanistan, Mali oder Südsudan zwar bis heute mehr als die Hälfte der Erwachsenen nicht lesen und schreiben – insgesamt geht der Trend aber auch in Ländern des Globalen Südens in die richtige Richtung. Laut Weltbank fiel die Quote der An­alpha­be­t:in­nen dort in den vergangenen zwanzig Jahren um 10 Prozentpunkte auf 27 Prozent. Ein Selbstläufer ist das indes nicht, warnt die Unesco in ihrem Bericht „World Education Statistics 2024“. Demnach gehen 250 Millionen Kinder und Jugendliche aktuell nicht zur Schule. Doch auch hier stimmt die Tendenz: Weltweit schließen immer mehr Kinder die Grund- sowie eine weiterführende Schule ab. Bleibt dieser Trend bestehen, kommen die UN ihrem Ziel, jedem Kind Lesen und Schreiben beizubringen, stetig näher. Für das dafür angepeilte Jahr 2030 wird es allerdings knapp. Ralf Pauli"},{"date":"4.1.2025","title":"Junge Frauen sterben seltener an Gebärmutterhalskrebs","author":"Johanna Weinz","link":"https://taz.de/die-gute-nachricht/!6056762&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Dank der seit 2006 empfohlenen HPV-Impfung sterben Frauen unter 25 Jahren in den USA seltener an Gebärmutterhalskrebs. Das belegt eine US-amerikanische Studie, basierend auf Daten des National Center for Health Statistics. Zwischen 1992 und 2021 starben insgesamt 398 Frauen unter 25 an dieser Krebsart. Durch Impfungen und Vorsorgeuntersuchungen ging die Zahl von 2013 bis 2021 um 62 Prozent zurück. Auslöser von Gebärmutterhalskrebs ist fast immer eine Infektion mit Humanen Papillomviren (HPV). Sie zählen zu den häufigsten sexuell übertragbaren Viren. Meistens verläuft eine Infektion harmlos, nur manchmal verursacht sie Krebs. Die Impfung schützt dagegen. Auch in Deutschland wird sie vorm ersten sexuellen Kontakt empfohlen. Etwa 50 Prozent der Mädchen und 30 Prozent der Jungen bis 14 Jahren sind in Deutschland vollständig gegen HPV geimpft. Das Ziel des europäischen Plans zur Krebsbekämpfung ist ambitioniert: Bis 2030 sollen 90 Prozent der Mädchen geimpft sein. Johanna Weinz"},{"date":"28.12.2024","title":"Wer Hilfe von Freun­d*in­nen hat, bekommt Neujahrsvorsätze eher hin","author":"Martin Mühl","link":"https://taz.de/die-gute-nachricht/!6052882&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Wollen Sie auch im neuen Jahr endlich mit dem Rauchen aufhören, oder mit dem Meditieren anfangen? Schwedische Psychologen haben in einer Studie herausgefunden, dass Unterstützung aus dem sozialen Umfeld dabei hilft, Vorsätze auch umzusetzen. Die Forschenden unterteilten die Teil­neh­me­r*in­nen in drei Gruppen. Eine Gruppe bekam keine Unterstützung. Die zweite wurde durch ein*e Freun­d*in unterstützt und bekam zusätzlich eine motivierende E-Mail. Und die dritte Gruppe bekam gleich vier motivierende E-Mails und musste sich konkrete Ziele setzen. Nach einem Jahr wurden alle Teil­neh­me­nden gefragt, ob sie ihre Ziele erreicht haben. Ihre Selbsteinschätzung zeigt: 62 Prozent derjenigen, die hauptsächlich aus ihrem sozialen Umfeld unterstützt wurden, haben ihre Vorsätze erfolgreich umgesetzt. Bei der Kontrollgruppe ohne Unterstützung waren es 56 Prozent. Doch zu viel Druck ist auch nicht gut: Bei der Gruppe, die die meisten Motivationsmails bekam, gaben am Ende die wenigsten – nur 53 Prozent – an, erfolgreich gewesen zu sein. Also einfach locker bleiben! Martin Mühl"},{"date":"21.12.2024","title":"Verspätete Weihnachtsgeschenke sind nur halb so schlimm","author":"Marco Fründt","link":"https://taz.de/die-gute-nachricht/!6052797&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Pünktlich zu den Feiertagen kommt hier die entlastende Nachricht für alle, die ihre Weihnachtsgeschenke noch nicht beisammen haben: nur keine Eile! Vielleicht gehören Sie zu den Menschen, die sich nicht in den Konsumstress der Vorweihnachtszeit stürzen wollen oder auf den letzten Drücker online einkaufen wollten. Doch dann wird die Bestellung erst nach Weihnachten geliefert, oder La­den­be­sit­ze­r:in­nen haben am Vormittag des 24. Dezember doch Besseres zu tun, als Ihnen ein paar Unterhosen einzupacken. Sie fühlen sich schrecklich, weil das Geschenk nicht pünktlich unterm Weihnachtsbaum liegt. Dieses Gefühl ist laut Forschenden der Ohio State University recht einseitig. In einer Studie mit 312 Teilnehmenden waren die Schenkenden fast doppelt so besorgt über die negativen Folgen für die Beziehung zu den Beschenkten, wenn die Präsente zu spät kommen, wie die Beschenkten selbst. Mögliche Gründe sehen die Forschenden darin, dass Schenkende oft stärker als die Beschenkten auf soziale Normen wie den richtigen Zeitpunkt des Schenkens achten. Für viele Schenkende bedeutet ein verspätetes Geschenk, dass der Anlass – sei es ein Geburtstag oder Weihnachten – nicht angemessen berücksichtigt wird. Marco Fründt"},{"date":"14.12.2024","title":"Deutsche Supermärkte schmeißen weniger weg","author":"Sophie Fichtner","link":"https://taz.de/die-gute-nachricht/!6054053&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Die Lebensmittelabfälle von Supermärkten sind im Jahr 2023 um fast ein Viertel gesunken. Das zeigt ein vom staatlichen Thünen-Institut veröffentlichter Bericht. Das Bundesministerium für Ernährung und Landwirtschaft hatte mit vierzehn Unternehmen aus dem Lebensmittelhandel, darunter Lidl, Penny, Rewe und Aldi, eine freiwillige Vereinbarung zur Reduzierung von Lebensmittelabfällen getroffen. Bis 2025 sollen die Supermärkte 30 Prozent weniger Lebensmittel wegschmeißen, bis 2050 dann 50 Prozent. Gemessen wurden die Abfälle in fünf Kategorien: Obst und Gemüse, Brot und Backwaren, Fleisch- und Fischprodukte, Molkereiprodukte und übrige Lebensmittel. Insgesamt wurden in den Supermärkten im Jahr 2023 1,71 Prozent dieser Lebensmittel weggeworfen. Im Vergleich waren das 24 Prozent weniger Abfälle – allerdings durften die Unternehmen die Vergleichsjahre für die Erhebung frei wählen.Als erfolgreiche Maßnahmen gegen das Wegwerfen werden die Kooperation mit den Tafeln und Rabatte kurz vor Ablauf der Lebensmittel genannt. Um die Verschwendung von Lebensmitteln weiter zu senken, muss sich aber vor allem in privaten Haushalten etwas ändern. Hier entstehen über die Hälfte der Lebensmittelabfälle. Sophie Fichtner"},{"date":"7.12.2024","title":"Immer weniger Menschen in Deutschland sind überschuldet","author":"Martin Mühl","link":"https://taz.de/die-gute-nachricht/!6051171&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Peter Zwegats Einsatz als Schuldnerberater im RTL hat sich gelohnt: Nach Daten des „Schuldneratlas 2024“ des Inkassounternehmens Creditreform ist die private Überschuldung in Deutschland im sechsten Jahr in Folge gesunken. 2024 sind 5,56 Millionen Menschen betroffen. Das entspricht 8,1 Prozent der Bevölkerung. Im Jahr 2018 waren es noch 6,93 Millionen. Die gesunkene Überschuldung hänge laut den Au­to­r*in­nen mit der aktuellen wirtschaftlichen Lage zusammen. In Zeiten von Krisen und damit verbundener Verunsicherung leben viele Leute sparsamer und gehen verantwortungsvoller mit ihrem Geld um. Auffällig ist, dass Frauen deutlich seltener betroffen sind als Männer. Der Frauenanteil unter den Überschuldeten lag bei 39 Prozent. Eine Ausnahme bilden alleinerziehende Mütter, die überdurchschnittlich oft hohe Schulden haben. Als Hauptursachen für Überschuldung gelten persönliche Schicksalsschläge wie Krankheiten und Unfälle und soziale Notlagen wie Arbeitslosigkeit. Martin Mühl"},{"date":"30.11.2024","title":"Jugendliche trinken später","author":"Marco Fründt","link":"https://taz.de/die-gute-nachricht/!6049642&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"In kaum einem anderen Land kommen Minderjährige leichter an alkoholische Getränke als in Deutschland. Dennoch greifen Kinder und Jugendliche immer später zum Glas: Im Jahr 2004 tranken junge Menschen noch mit etwa 14 Jahren das erste Mal Alkohol, im Jahr 2023 waren die Erst­trin­ke­r:in­nen im Durchschnitt 15 Jahre alt. Das hat die Drogenaffinitätsstudie der Bundeszentrale für gesundheitliche Aufklärung ergeben. Befragt wurden 7.001 junge Menschen im Alter von 12 bis 25 Jahren.Das spätere Trinken sei unter anderem auf den Erfolg von Kampagnen wie „Kenn dein Limit“ zurückzuführen, aber auch gesellschaftliche Veränderungen hätten dazu beigetragen. Eltern sprechen zum Beispiel heutzutage häufiger mit ihren Kindern über die Risiken von Alkohol, alternative Lebensstile seien heute akzeptierter, Gruppenzwang weniger stark ausgeprägt. Auch werde der Jugendschutz insgesamt ernster genommen als früher und Alkohol seltener an Minderjährige verkauft. Marco Fründt"},{"date":"23.11.2024","title":"Die Treibhausgasemissionen in der EU sinken","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6048092&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Anders als im globalen Trend sind im vergangenen Jahr die Treibhausgasemissionen in der EU um acht Prozent gesunken. Damit ist die Verringerung fast so groß wie im Pandemiejahr 2020 – und etwa doppelt so hoch wie nötig, um die EU-Klimaziele einzuhalten. Während der Pandemie war der Grund des Rückgangs vor allem die reduzierte Wirtschaftsleistung. 2023 gab es laut der EU-Umweltagentur auch deshalb weniger Treibhausgasemissionen, weil der Ausbau erneuerbarer Energien die Nutzung von Kohle und anderen fossilen Brennstoffen verdrängt. Hinzu kommt, dass in den vergangenen Jahrzehnten auch der Energieverbrauch gesunken ist. Insgesamt sanken die Emissionen im Jahr 2023 um 256 Millionen Tonnen CO2-Äquivalente. Damit liegen die europäischen Emissionen nun 37 Prozent unter dem Niveau von 1990 – bis 2030 sollen es 55 Prozent weniger sein. Die Klimapläne der EU-Mitgliedsländer summieren sich bisher jedoch nur auf etwa 43 Prozent weniger Treibhausgase im Jahr 2030. Lalon Sander"},{"date":"16.11.2024","title":"Neuigkeiten aus der Wissenschaft erreichen mehr Menschen","author":"Manfred Ronzheimer","link":"https://taz.de/die-gute-nachricht/!6046731&s=gute%2Bnachricht&SuchRahmen=Print/","category":"technology_science","text":"Wissenschaft ist für Laien häufig ein Buch mit sieben Siegeln. Aber eine wachsende Zahl der Deutschen fühlt sich über die Vorgänge und Ergebnisse aus den Laboren und Hochschulen zumindest gut informiert. 30 Prozent der Bürger sind laut aktuellem „Wissenschaftsbarometer“ dieser Meinung. Die Befragung ermittelt im Auftrag der deutschen Forschungsorganisationen das Verhältnis der Bevölkerung zur Wissenschaft. 2014 lag die Informationszufriedenheit noch bei 24 Prozent. Im gleichen Zeitraum nahm der Anteil derjenigen, die sich nicht oder schlecht über Wissenschaft informiert fühlten, von 35 auf 17 Prozent ab. Das lässt darauf schließen, dass die Kommunikation aus den Forschungsinstituten und die Arbeit von Wissenschafts­journalisten funktioniert. Weitere Anstrengungen sind aber dennoch nötig, wie der Anteil der Indifferenten zeigt, die sich mal gut, mal schlechter über Neues aus Wissenschaft und Forschung informiert fühlen. Diese Gruppe wuchs von 40 auf jetzt 52 Prozent. Manfred Ronzheimer"},{"date":"9.11.2024","title":"Ägypten hat Malaria besiegt","author":"Adefunmi Olanigan","link":"https://taz.de/die-gute-nachricht/!6045271&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Malaria kann besiegt werden, auch in Ländern, in denen die Krankheit für Jahrtausende zirkulierte. Seit dem 21. Oktober zählt die Weltgesundheitsorganisation (WHO) nun auch Ägypten zu den malariafreien Ländern. Mindestens 6.000 Jahre lang übertrug die Anopheles-Mücke in Ägypten die infizierenden Plasmodien, auch schon auf Pharao Tutanchamun. Die Eliminierung der Krankheit sei „ein Zeichen der Hoffnung für die ganze Welt, insbesondere für andere endemische Länder in unserer Region“, sagt Hanan Balkhy, WHO-Regionaldirektorin für den östlichen Mittelmeerraum. Um als von Malaria befreit zertifiziert zu werden, muss ein Land nachweisen, dass die Malaria-Übertragung für mindestens drei aufeinanderfolgende Jahre unterbrochen war. Maßgeblich beigetragen haben zu Ägyptens Erfolg, die Krankheit einzudämmen, eine engmaschige Überwachung – seit 1930 ist Malaria in Ägypten eine meldepflichtige Krankheit –, eine enge Zusammenarbeit mit den Nachbarländern wie dem Sudan und Investitionen in die Gesundheitsversorgung, erklärt die WHO in ihrem Pressestatement. So sind etwa Diagnostik und Behandlung von Malaria für die gesamte Bevölkerung kostenlos, unabhängig vom Aufenthaltsstatus. Von 1955 bis heute sind weltweit 44 Länder und ein Territorium – die zu Frankreich gehörende Pazifikinsel La Réunion – als malariafrei zertifiziert worden. Adefunmi Olanigan"},{"date":"2.11.2024","title":"Junge Menschen glauben an ihre berufliche Zukunft","author":"Martin Mühl","link":"https://taz.de/die-gute-nachricht/!6044513&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Egal ob Feuerwehrfrau, Zahnarzt oder Kfz-Mechatroniker*in, immer mehr Jugendliche sind guter Dinge, in ihrem Traumberuf arbeiten zu können. Um 18 Prozentpunkte istdie Zahl der jungen Menschen, die sich sicher sind, ihre beruflichen Ziele zu erreichen, seit 2006 gestiegen, das ergab die aktuelle Shell-Jugendstudie. Insbesondere Jugendliche aus sozial benachteiligten Familien sind optimistischer als früher. Während 2010 nur 43 Prozent dieser Jugendlichen voller Hoffnung in ihre berufliche Zukunft blickten, sind es jetzt 78 Prozent. Auch Auszubildende sind so optimistisch wie noch nie, wenn es um ihren Job geht. 92 Prozent von ihnen erwarten, dass sie nach Abschluss der Ausbildung von ihrem Ausbildungsbetrieb übernommen werden – ein Anstieg von 31 Prozentpunkten seit 2006. Dass Jugendliche so hoffnungsvoll in Karrierefragen sind, hängt mit der Entwicklung des Arbeitsmarkts zusammen. In den letzten Jahren ist die Arbeitslosenquote gesunken und in vielen Branchen werden Fachkräfte dringend gesucht. Martin Mühl"},{"date":"26.10.2024","title":"Bei den erneuerbaren Energien entstehen viele neue Jobs","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6043141&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Zahl der Jobs in der Branche der erneuerbaren Energien ist einer Studie zufolge weltweit deutlich gewachsen. Im vergangenen Jahr gab es in diesem Bereich mindestens 16,2 Millionen Arbeitsplätze, 18 Prozent mehr als im Jahr davor. 2012 hatte es weltweit nur 7,3 Millionen Jobs in der Erneuerbaren-Branche gegeben. Seitdem hat sich ihre Zahl mehr als verdoppelt. Im Jahr 2023 gab es allein im Solarbereich 7,1 Millionen Stellen weltweit – 4,6 Millionen davon in China. Die Europäische Union folgte weit dahinter mit 720.000. China hat in den vergangenen zehn Jahren fast dreimal so viel wie die USA und doppelt so viel wie die EU in erneuerbare Energien investiert. Inzwischen befinden sich dort mehr als 40 Prozent der weltweiten Solar- und Windkapazität. Bei Windkraft erreichte Deutschland dem Bericht zufolge innerhalb der EU mit fast 109.000 Stellen den ersten Platz. Im Solarbereich habe es in Deutschland 2023 fast 155.000 Stellen gegeben, gut doppelt so viele wie im Jahr davor. Lalon Sander"},{"date":"19.10.2024","title":"Mehr Frauen gewinnen Nobelpreise","author":"Adefunmi Olanigan","link":"https://taz.de/die-gute-nachricht/!6041042&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Dieses Jahr hat Han Kang die Bilanz gerettet. Als einzige Frau erhielt die koreanische Schriftstellerin 2024 einen Nobelpreis, neben zehn Männern und einer Organisation. Immerhin hält so eine Serie, die 2018 begann. Seitdem war unter den Ausgezeichneten jedes Jahres immer mindestens eine Frau, zudem sind ein Viertel der Nobelpreis­trä­ge­r*innen in diesem Zeitraum weiblich (der Alfred-Nobel-Gedächtnispreis für Wirtschaft ist hier stets mitgerechnet).Das klingt alles nicht nach viel und ist dennoch eine positive Entwicklung. Denn lange Zeit gab es immer wieder Jahre, in denen keine einzige Frau unter den No­bel­preis­trä­ge­r*in­nen war. Erst seit den 2000ern hat sich der Frauenanteil merklich verbessert: In den vergangenen 24 Jahren haben mehr Frauen einen Nobelpreis gewonnen als im gesamten 20. Jahrhundert.In der Gesamtzahl hängen die ausgezeichneten Frauen immer noch meilenweit hinterher. Gerade einmal 6 Prozent machen sie aus. Dabei gewannen sie in den Kategorien Frieden und Literatur mit anteilig 14 Prozent am häufigsten – in Physik und Wirtschaft liegt der Wert bei unter 3 Prozent. Ganz werden sie den Rückstand wohl nicht aufholen können. Aber immerhin könnte, so die Hoffnung, ein Jahrgang in sich künftig paritätisch sein. Adefunmi Olanigan"},{"date":"12.10.2024","title":"Der Kohleausstieg in Europa läuft","author":"Nick Reimer","link":"https://taz.de/die-gute-nachricht/!6039633&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Erst die Dampfmaschine ermöglichte den Kapitalismus. In Großbritannien entstanden so Webmaschinen etwa, oder Lokomotiven. Um die Jahrhundertwende wurde aus der Dampfmaschine die Dampfturbine, deren Wirkungsgrad deutlich größer ist: Jetzt lohnte es, Energie über Leitungen zu transportieren, das Stromnetz entstand. 1882 ging in London das erste Kohlekraftwerk in Betrieb. In seiner Hochzeit wurden in Großbritannien mehr als 80 Prozent des Stroms aus Kohle gewonnen. Damit ist seit Anfang Oktober Schluss. Das Mutterland des Kapitalismus ist aus der Kohleverstromung ausgestiegen.Großbritannien folgt mit dieser Entscheidung einigen anderen Staaten: Belgien stieg 2016 aus, Österreich nahm sein letztes großes Kohlekraftwerk 2019 vom Netz. Schweden stieg 2020 aus der Kohleverstromung aus, dort kommt der Strom jetzt zu 95,9 Prozent aus erneuerbaren Quellen. Portugal folgte 2021. Der Kohleausstieg in Europa ist damit längst in vollem Gange: Estland, Lettland, Litauen, Luxemburg, Malta und Zypern hatten sogar nie Kohlekraftwerke. 2025 wollen Griechenland, Irland, Italien und Ungarn ihr letztes Kohlekraftwerk vom Netz nehmen. Damit wird dann erstmals die Mehrheit der 27 EU-Mitgliedsstaaten ohne Kohleverstromung auskommen. Frankreich will 2027 folgen, Dänemark 2028, Finnland und die Niederlande 2029. Kohlestrom ist die klimaschädlichste aller Stromgewinnungsarten. Deshalb wäre es auch für den internationalen Klimaschutz wichtig, dass viele Länder so schnell wie möglich die Kohleverstromung hinter sich lassen. Doch nicht alle ziehen im gleichen Tempo mit. Deutschland beispielsweise will erst 2038 aus der Kohle aussteigen. Nick Reimer"},{"date":"5.10.2024","title":"Es wird mehr alkoholfreies Bier getrunken","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6038303&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"In München geht das 189. Oktoberfest zu Ende. 16 Tage zügelloses Kollektivbesäufnis sind vorbei, die Festzelte werden abgebaut, und die Nachwirkungen machen sich vor allem durch Kopfschmerzen und die übliche Wiesngrippe-Welle bemerkbar. Auf dem Oktoberfest zeigt sich allerdings seit einigen Jahren ein Trend, der auch im Rest der Bundesrepublik erkennbar ist: Immer mehr Menschen trinken alkoholfreies Bier. Und inzwischen bieten fast alle Zelte auf der Theresienwiese auch alkoholfreie Alternativen an. Als alkoholfrei gilt Bier mit einem Alkoholgehalt von weniger als 0,5 Volumenprozent. Laut Statistischem Bundesamt wurden 2023 in Deutschland 556 Millionen Liter alkoholfreies Bier produziert. In den vergangenen zehn Jahren hat sich die Menge damit mehr als verdoppelt, 2013 lag sie noch bei 267 Millionen Litern. Bier mit Alkohol wird zwar noch immer deutlich mehr produziert, doch die Menge geht leicht zurück. In München hat im vergangenen Sommer sogar schon der erste vollständig alkoholfreie Biergarten eröffnet. Wer sich während der Oktoberfestzeit jemals in der Gegend rund um die Theresienwiese aufgehalten hat, wünscht sich, dass der Trend zur Nüchternheit auch dort noch zunimmt.Yannik Achternbosch"},{"date":"28.9.2024","title":"In immer mehr Ländern gibt es einen Zuschuss für Reparaturen","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6036570&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Waschmaschine kaputt? Kein Problem, jedenfalls in Berlin. Seit vergangener Woche können die Menschen dort einen Zuschuss für die Reparatur von Elektrogeräten erhalten. Bis zu 200 Euro sind möglich und maximal die Hälfte der Kosten wird übernommen. Unterstützt wird nicht nur die Reparatur, sondern auch der Kauf von Ersatzteilen. Gefördert werden Reparaturen an allen Elektrogeräten, etwa Spülmaschinen, Handys oder Fernsehern.Ähn­liche Regelungen gibt es bereits seit 2021 in Thüringen und seit 2023 in Sachsen, dort werden ebenfalls bis zu 200 Euro gefördert. Auch einige Städte und Gemeinden in anderen Bundesländern bieten einen solchen Bonus an, etwa Starnberg oder Aschaffenburg. Die Länder und Kommunen wollen durch das Förderprogramm dafür sorgen, dass weniger Elektroschrott anfällt und Geräte länger verwendet werden können. Bisher wird nur über eine Rückerstattung gefördert, die Kun­d:in­nen müssen das Geld für Reparatur also erst mal selbst bezahlen und dann über ein Formular das Geld beantragen.Die Förderprogramme fallen zusammen mit dem EU-weiten Recht auf Reparatur. Es verpflichtet Hersteller dazu, bei der Produktion darauf zu achten, dass die Kompo­nenten ihrer Geräte einfach auszutauschen oder zu reparieren sind. Yannik Achternbosch"},{"date":"21.9.2024","title":"Koloniale Symbole verschwinden aus Länderwappen","author":"Simon Barmann","link":"https://taz.de/die-gute-nachricht/!6036010&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Trinidad und Tobago will Schluss machen mit dem Kolonialismus. Dazu gehört auch die Dekolonisierung des nationalen Länderwappens. Auf diesem sind nämlich drei Schiffe aus der Flotte von Christoph Kolumbus abgebildet, der 1498 auf der Insel landete. Dass diese zum Zeitpunkt seiner „Entdeckung“ sehr wohl bereits bewohnt war, ignorierte der Seefahrer aus Genua geflissentlich. Auch auf Fidschi, Grenada und den Bahamas wird das Thema lebhaft diskutiert. Die Initiativen zur Umgestaltung von Wappen sind eingebettet in eine Bewegung, die sich vom kolonialen Erbe lösen will und im Zuge dessen Reparationszahlungen von den ehemaligen Kolonisatoren fordert. Als ehemalige britische Kolonien gehören diese Länder zum Commonwealth of Nations. 56 Staaten umfasst dieser Verbund, hinzu kommen 13 britische Überseeregionen. Der britische König ist bis heute, zumindest formal, der „Head of Commonwealth“. Eine Mehrheit der Mitgliedsstaaten sind ehemalige britische Kolonien. Nur Mosambik und Ruanda bilden eine Ausnahme – Kamerun und Togo, als vormals deutsche Kolonien wurden nach dem 2. Weltkrieg eine Zeit lang britisches Mandatsgebiet. Von den Commonwealth-Mitgliedstaaten sind heute indes 36 Länder eigene Republiken, 15 Staaten sind zwar unabhängig, aber unterstehen der britischen Krone und fünf Staaten bilden eigene Monarchien. Infografik: taz Die meisten Länder erhielten überhaupt erst durch ihre Kolonialisierung ein Länderwappen. In Großbritannien gibt es bis heute das „College of Arms“, eine staatliche Institution, die auch die Wappen für die Kolonien entworfen hat. Sie folgen vorwiegend einer typischen Anordnung: In der Mitte befindet sich ein Schild, das Nationalsymbole, Heroldsbilder oder andere zentrale Darstellungen enthält. Zu beiden Seiten befinden sich Schildhalter. Zuoberst sitzt ein Helm oder eine Krone, unterhalb des Schildes prangt ein Wappenspruch. Koloniale Symbolik lässt sich in allen Wappenteilen finden: so zum Beispiel die britische Krone, das Georgskreuz, rassistische Darstellungen von Schildhaltern, Wahlsprüche mit Preisungen der englischen Krone oder eben, wie im Fall von Trinidad und Tobago, europäische Schiffe. wochentaz Dieser Text erschien zuerst in der wochentaz, unserer Wochenzeitung von links! In der wochentaz geht es jede Woche um die Welt, wie sie ist – und wie sie sein könnte. Eine linke Wochenzeitung mit Stimme, Haltung und dem besonderen taz-Blick auf die Welt. Jeden Samstag neu am Kiosk und natürlich im Abo. Viele ehemalige britische Kolonien nutzten den Zeitpunkt der Unabhängigkeitserklärung auch dazu, sich von ihren Nationalflaggen mit kolonialen Elementen zu befreien. Andere taten dies später, zuletzt Südafrika im Jahr 2000. Trinidad und Tobago will am 24. September, dem nationalen Unabhängigkeitstag, sein neues Wappen vorstellen. Angekündigt ist, dass die Schiffe des Columbus durch die Steelpan, auch Stahltrommel genannt, ersetzt werden sollen, ein traditionelles Instrument. Es wäre ein symbolischer Paukenschlag, der entsprechende Diskussionen in weiteren Ländern anheizen könnte."},{"date":"14.9.2024","title":"In Deutschland praktizieren mehr Ärz­t*in­nen aus dem Ausland","author":"Franca Parianen","link":"https://taz.de/die-gute-nachricht/!6033912&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Monatelange Wartezeiten auf Termine, kaum Zeit in der Sprechstunde – in kaum einem Bereich ist der vielzitierte Fachkräftemangel so unmittelbar zu spüren wie im Gesundheitssektor. Was Hoffnung macht, auch vor dem Hintergrund der aktuellen Migrationsdebatte: In Deutschland arbeiten mehr Ärz­t*in­nen ausländischer Herkunft als je zuvor. 63.767 sind es laut Bundesärzte­kammer – mehr als je­de*r zehnte und mehr als fünf Mal so viele wie noch im Jahr 2000. Das wichtigste Her­kunftsland ist Syrien, 6.121 Praktizierende stammen von dort. Tausende weitere kommen aus Polen, Rumänien, der Türkei und Griechenland, aus Indien, dem Iran oder der Ukraine. Im überstrapazierten deutschen Gesund­heitssystem füllen sie Stellen, die oft schwer zu besetzen sind, auf dem Land oder in Kliniken. Dort mehren sie die Anzahl gesprochener Sprachen und im besten Fall auch die interkulturelle Kompetenz. Sachsen und Thüringen tun sich in der Statistik übrigens besonders hervor: In beiden Ländern ist der Ausländer*innen-Anteil mit rund 5 Prozent relativ gering. Die Zugewanderten stellen jedoch rund 15 Prozent der dort tätigen Ärzt*innen.Franca Parianen"},{"date":"7.9.2024","title":"In NRW leben wieder mehr Weißstörche","author":"Katharina Federl","link":"https://taz.de/die-gute-nachricht/!6032260&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Wenn der Weißstorch schon keine Babys bringt, so zumindest gute Botschaften: Mit 784 Horstpaaren leben heute vermutlich mehr Weißstörche in NRW als je zuvor.Das ist erstaunlich, denn ein winziger Flügelschlag hätte ausgereicht, um das Leben des Weißstorchs vollständig auszulöschen. In Nordrhein-Westfalen gab es 1991 noch ganze drei Horstpaare. Und auch in anderen Regionen wurde ein Bestandsrückgang beobachtet. Das liegt daran, dass seine Lebensräume in landwirtschaftliche Nutzfläche umgewandelt wurden. Viele Tiere sterben auch durch Stromschläge oder verletzen sich an Leitungen und Masten. Der Weißstorch brütet in offenen Kulturlandschaften und baut sein Nest häufig auf Schornsteinen, Dächern oder Kirchtürmen.Dass der Weißstorch einen zweiten Frühling erlebt, ist das Verdienst zahlreicher Naturschutzvereine und Land­wirt*innen. Sie setzen sich dafür ein, dass Lebensräume aufgewertet und Brutplätze errichtet werden – für die Zukunft der Störche und die ihrer Babys. Katharina Federl"},{"date":"31.8.2024","title":"Deutsche verbrauchen immer weniger Trinkwasser","author":"Katharina Federl","link":"https://taz.de/die-gute-nachricht/!6030762&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"33 Liter Wasser verbraucht eine Person in Deutschland durchschnittlich pro Tag – und das allein, wenn sie auf die Toilette geht. Dazu kommen 44 Liter für Körperpflege und knapp 15 Liter zum Wäschewaschen. Rechnet man Geschirrspülen, Putzen und Kochen hinzu, kommt man auf die vorläufige Angabe des Bundesverbands der Energie- und Wasserwirtschaft für 2023: 121 Liter Trinkwasser pro Kopf und Tag. 121 Liter, das klingt nicht gerade wenig. Doch betrachtet man die Entwicklung der letzten Jahrzehnte, stellt man fest: Der Trinkwasserverbrauch in Deutschland sinkt mehr oder weniger kontinuierlich. Im Jahr 1990 lag der durchschnittliche Verbrauch noch bei 147 Litern, im Jahr 2000 bereits bei 129 Litern. 129 Liter wurden auch im Coronajahr 2020 gemessen. Das könnte daran liegen, dass die Menschen mehr Zeit zu Hause verbracht haben. Oder, und das wäre auch eine gute Nachricht, sie scheinen der Empfehlung gefolgt zu sein, sich häufiger die Hände zu waschen, um sich vor Infektionen zu schützen. Katharina Federl"},{"date":"24.8.2024","title":"Immer mehr Menschen in Deutschland bewegen sich","author":"Jerrit Schlosser","link":"https://taz.de/die-gute-nachricht/!6029516&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Wer sich zu wenig bewegt, belastet seine Gesundheit. Diesem Risiko setzen sich in Deutschland immer weniger Menschen aus. Waren im Jahr 2000 79,67 Prozent der Bevölkerung im Alter von über 18 Jahren körperlich aktiv, sind es 2022 bereits 88,02 Prozent. Seit mehr als 20 Jahren steigt die Zahl laut Weltgesundheitsorganisation (WHO) kontinuierlich an. Um als körperlich aktiv zu gelten, muss man laut WHO mindestens 75 Minuten pro Woche mit hoher Intensität Sport betreiben. Das bedeutet, dass der Sauerstoffverbrauch mindestens sechsmal so hoch ist wie im Ruhezustand. Basketballspielen oder Joggen sind Beispiele dafür. Alternativ reicht es auch, sich 150 Minuten pro Woche moderat-aktiv zu betätigen, den Sauerstoffverbrauch also auf das Drei- bis Sechsfache zu heben. Beim langsamen Tanzen zum Beispiel. Die Auswertung der WHO basiert auf repräsentativen Bevölkerungsumfragen aus 193 Ländern. Ungefähr 5,7 Mil­lio­nen Menschen haben dabei Eigenangaben zu ihrem Bewegungsverhalten gemacht. Jerrit Schlosser"},{"date":"17.8.2024","title":"Weniger Plastiktütenan britischen Stränden","author":"Jerrit Schlosser","link":"https://taz.de/die-gute-nachricht/!6028054&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Eine erfreuliche Entwicklung für Ba­de­ur­lau­be­r:in­nen im Vereinigten Königreich: An den Stränden liegen deutlich weniger Einweg-Plastiktüten. Das geht aus einem Bericht der NGO Marine Conservation Society hervor. Waren es 2014 im Schnitt noch fünf Stück pro 100 Meter, ist es jetzt nur noch eine. Um 80 Prozent hat die Anzahl demnach abgenommen.Laut der NGO liegt das an einem 2015 eingeführten Gesetz, das Supermärkte in England dazu verpflichtet, Geld für Plastiktüten zu verlangen. In Schottland, Irland und Wales gibt es ähnliche Gesetze. Der starke Rückgang an gefundenen Plastiktüten korreliert zeitlich mit der Gesetzesänderung, nachgewiesen ist der Zusammenhang aber nicht. Seit 30 Jahren erhebt die NGO Daten über Müll an den Stränden des Vereinigten Königreichs. Dafür sammeln Freiwillige an 100 Meter langen Strandabschnitten Müll und schicken ihren Fund ein. Die untersuchten Strandabschnitte können sich allerdings von Jahr zu Jahr unterscheiden, was die Untersuchungen weniger einheitlich macht. 2023 sammelten über 14.000 Menschen mit und schickten über 1.000 Proben ein. Jerrit Schloßer"},{"date":"10.8.2024","title":"Es gibt immer mehr Sammelstellen für Muttermilch","author":"Katharina Federl","link":"https://taz.de/die-gute-nachricht/!6026583&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Dass ein Baby auch mit Milch groß werden kann, die nicht von seiner Mutter stammt, wissen Menschen schon seit der Antike. Ammen retteten nicht nur das Leben zahlreicher Neugeborenen, deren Mütter ihre Geburt nicht überlebten oder zu krank waren, um Milch zu produzieren. Sie zu beschäftigen galt auch als Statussymbol der Schönen und Reichen, denn Stillen galt lange Zeit als unschicklich. Mit der Entwicklung von Fertignahrung für Säuglinge – erst in flüssiger Form, dann als Pulver, später als Ersatzmilch – verschwand der Beruf der Amme nach und nach; das Stillen war aus der Mode. Doch auch das hat sich wieder geändert: Die WHO empfiehlt seit Jahren, Babys bis zu sechs Monaten voll zu stillen. Zwar können Säuglinge heutzutage mit anderen Präparaten ernährt werden und müssen nicht, wie früher, um ihr Leben fürchten, wenn ihre Mütter nicht stillen können oder wollen. Zahlreiche Studien zeigen jedoch, dass Muttermilch besonders gut gegen Infektionen schützt und Antikörper enthält, die sich künstlich nicht nachbauen lassen. Gerade Frühgeborene und kranke Säuglinge, deren Mütter aus den unterschiedlichsten Gründen nicht genug Milch produzieren können, profitieren deshalb von der Milchspende anderer Frauen. Diese Spenderinnenmilch wird von Frauenmilchbanken gesammelt. Deutschlandweit gibt es mittlerweile mehr als fünfzig solcher Sammelstellen, die an Kliniken angeschlossen sind. Dort können Frauen, die mehr Muttermilch haben als ihr Baby braucht, ihre Spende abgeben. Das kostbare Gut wird dann im Labor untersucht und an bedürftige Säuglinge verteilt. Alle Milchbanken in der BRD geschlossen Die erste offizielle Sammelstelle Deutschlands gründete die Kinderärztin Marie-Elise Kayser im Jahr 1919 im Krankenhaus Magdeburg-Altstadt. Die Idee, Säuglinge mit gespendeter Milch zu ernähren, gab es schon, Kayser warb allerdings auch außerhalb von Kliniken um Spendemilch. Darüber hinaus gelang es ihr, sie zu pasteurisieren und damit über längere Zeit haltbar zu machen. Mitte des 20. Jahrhunderts wurde diese Idee wieder aufgegriffen, es folgten viele weitere solcher Sammelstellen. Ab den Sechzigerjahren wurden diese Frauenmilchbanken jedoch nach und nach wieder geschlossen, in der BRD gab es Ende der 1970er Jahre keine einzige Sammelstelle mehr. Das lag zum einen daran, dass Industriemilchprodukte immer besser wurden und Werbekampagnen der Babynahrungsindustrie eine starke finanzielle Unterstützung erhielten. In den 1980er Jahren sprachen sich viele Kin­der­ärz­t:in­nen dann wieder deutlicher für die gesundheitlichen Vorteile des Stillens aus. In der damaligen DDR blieben einige Muttermilchbanken erhalten. wochentaz Dieser Text erschien zuerst in der wochentaz, unserer Wochenzeitung von links! In der wochentaz geht es jede Woche um die Welt, wie sie ist – und wie sie sein könnte. Eine linke Wochenzeitung mit Stimme, Haltung und dem besonderen taz-Blick auf die Welt. Jeden Samstag neu am Kiosk und natürlich im Abo. Erst 2012 wurde in Westdeutschland die erste Sammelstelle wiedereröffnet: die Frauenmilchbank am Perinatalzentrum München-Harlaching kümmert sich um die Versorgung von Frühgeborenen und kranken Neugeborenen auf Station. Die Muttermilch kommt hier ausschließlich von internen Spenderinnen, also von Müttern, die sich auch in der Klinik aufhalten. Große Kliniken, wie die Universitätskliniken in Leipzig und Freiburg, nehmen auch externe Spenden an, die sie bei Bedarf sogar bei den milchgebenden Müttern abholen. Diese frieren die abgepumpte Milch daheim ein, anschließend wird sie in der Klinik analysiert und, falls alle Kritierien stimmen, pasteurisiert und an Bedürftige verteilt. Eines der Kriterien ist etwa, dass die gespendete Muttermilch frei von Bakterien sein muss. In Deutschland gibt es über 200 Perinatalzentren, die Frühgeborene behandeln. Die Milchbanken versorgen oft nicht nur die Klinik, an der sie angesiedelt sind, sondern auch weitere Säuglingsstationen im Umkreis. Die Charité in Berlin gibt beispielsweise an alle Kliniken der Stadt bei Bedarf überschüssige Muttermilch ab. Dennoch sei eine flächendeckende Versorgung von Säuglingen noch nicht gewährleistet, so Ulrike Sturm-Hentschel von der Frauenmilchbank-Initiative. Die Frauenmilchbank-Initiative gibt es seit 2018 und besteht aus Kinderärzt:innen, Klinikpersonal, Wis­sen­schaft­le­r:in­nen und Eltern. Sie alle setzen sich dafür ein, dass bedürftige Frühgeborene einen sicheren Zugang zu Milch aus Frauenmilchbanken haben. „Das ist unser oberstes Ziel“, sagt Sturm-Hentschel. Seit ihrer Gründung lässt sich ein beachtlicher Aufschwung an Sammelstellen verzeichnen. Fast 30 solcher Milchbanken wurden in den vergangenen sechs Jahren gegründet. Mit der Eröffnung einer Spendemilchbank in Mainz hat die Initiative im Juli – mit etwas Verspätung – ihre 2018 gestellte Forderung erreicht: Jedes Bundesland sollte bis 2023 mindestens eine Sammelstelle haben."},{"date":"3.8.2024","title":"Jugendliche lesen weiterhin Bücher","author":"Katharina Federl","link":"https://taz.de/die-gute-nachricht/!6025012&s=gute%2Bnachricht&SuchRahmen=Print/","category":"culture_sports","text":"Kinder und Jugendliche hängen nur noch am Handy, haben weniger Allgemeinbildung und gehen nicht mehr raus? Um die Generation von heute kursieren viele Gerüchte. Oft erzählen diese nur die halbe Wahrheit. Die Studienreihe „Jugend, Information, Medien“ (JIM) befragt seit 25 Jahren Kinder und Jugendliche in Deutschland zu ihrer Mediennutzung und stellt fest: Anders als viele vermuten würden, lesen sie fast so viel wie früher. Die Daten, die durch die Befragung von 1.200 Personen im Alter von 12 bis 19 Jahren erhoben wurden, zeigen zwar, dass Smartphones, Internet und Musik an erster Stelle stehen. 35 Prozent der Befragten geben aber auch an, täglich oder mehrmals in der Woche Bücher zu lesen. Im ersten Studienjahr 1998 waren es noch 38 Prozent.Dabei lesen Mädchen nach wie vor mehr als Jungen und Gym­na­si­as­tin­nen mehr als andere Schülerinnen. Auch haben junge Menschen mit 63 Minuten täglicher Lektürezeit im Jahr 2023 wieder länger gelesen als im Vorjahr. Angesichts der dynamischen Entwicklung digitaler Medien sind diese Beobachtungen durchaus erstaunlich. Katharina Federl"},{"date":"27.7.2024","title":"Der Iberische Luchs ist nicht mehr vom Aussterben bedroht","author":"Marius Werz","link":"https://taz.de/die-gute-nachricht/!6023621&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Lange Zeit sah es nicht gut aus für den Iberischen Luchs, einen Verwandten des bei uns heimischen Eurasischen Luchses. In den 1950er Jahren raffte ein Ausbruch der sogenannten Kaninchenpest auf der Iberischen Halbinsel die Hauptnahrungsquelle des Luchses dahin und die Population sank schlagartig. Auch die Vernichtung von Lebensräumen sowie das Feline Leukämievirus, das bei infizierten Katzen Blutkrebs auslöst, setzten der Art zu. 2001 gab es nur noch 62 erwachsene Exemplare. Daraufhin förderten die spanischen und portugiesischen Behörden den Erhalt der vom Luchs bevorzugten Kulturlandschaft, abwechselnden Wald- und Kleinholzbeständen, und säten Pflanzen für Kaninchen aus. Die ausgewilderten Luchse fanden passende Lebensräume und genügend Nahrung vor. Seither erholt sich die Population stetig. Waren es 2022 bereits 648 Tiere, zählten die TierschützerInnen 2024 mehr als 2.000 Luchse. Somit gilt der Iberische Luchs nicht länger als vom Aussterben bedroht. Gefährdet ist der Fortbestand aber weiterhin. Marius Werz"},{"date":"20.7.2024","title":"Das Trachom ist weltweit auf dem Rückzug","author":"Jerrit Schlosser","link":"https://taz.de/die-gute-nachricht/!6022255&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Immer weniger Menschen entwickeln ein Trachom, eine schmerzhafte bakterielle Augenentzündung, die im Endstadium zu Erblindung führt. Vor allem in Ländern des globalen Südens ist die Krankheit noch präsent. Nach einer Auswertung des Institute for Health Metric and Evaluation gab es im Jahr 1990 weltweit 51 Fälle pro 100.000 Menschen. 2021 waren es nur noch 16. Übertragen wird die Krankheit über Augen- und Nasensekrete, Kleidung und eine Fliegenart, die die Augen angreift. Die Zahl der Infizierten sinkt, weil mehr Menschen Zugang zu sauberem Wasser und sanitären Einrichtungen haben, auch das verbesserte Müllmanagement in Städten des Globalen Südens hilft. Infektionen können mit Antibiotika behandelt werden. Im Endstadium kann eine Operation, die etwa 40 US-Dollar kostet, vor dem Erblinden bewahren. Weil beide Therapiemethoden zunehmend angewendet werden, sinkt auch die Zahl an Infizierten, die erblinden. Allerdings: 1998 setzte die WHO sich zum Ziel, das Trachom bis 2020 zu eliminieren. So weit ist es noch nicht. Jerrit Schlosser"},{"date":"13.7.2024","title":"Immer mehr Fahr­rad­­fahrer:innen tragen einen Helm","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6020627&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Ein neuer Rad-Rekord: 44,4 Prozent der Fahrradfah­re­r:in­nen haben 2023 innerorts einen Helm getragen. Das sind so viele wie noch nie, laut Bundesanstalt für Straßenwesen. Einmal jährlich untersucht diese, wie viele Radfahrende mit und ohne Helm unterwegs sind. Das passiert jedes Mal in den selben Gemeinden. Die Mit­ar­bei­te­r:in­nen beobachten auch, ob sich Menschen im Auto anschnallen oder auf dem Mo­tor­rad­fahr­rad­ Schutzkleidung tragen. Bei einem Unfall mit dem Rad kann ein Helm entscheidend sein. Eine Studie belegt, dass Helme bei Kindern und Jugendlichen bis zu 87 Prozent der Sturzeinwirkung auf den Kopf abfangen können. Eine weitere Studie resümiert, dass Menschen mit Helm ein deutlich geringeres Risiko für schwere Verletzungen beim Sturz haben. Wie viele Menschen einen Helm tragen, unterscheidet sich je nach Alter stark. Die höchste Quote haben die 6- bis 10-Jährigen, die niedrigste die 17- bis 21-Jährigen. Allerdings zieht sich der deutliche Trend nach zum Helmtragen durch alle Altersgruppen. Noch 2001 waren unter jugendlichen und erwachsenen Rad­le­r:in­nen deutlich unter 10 Prozent mit Helm unterwegs. Yannik Achternbosch"},{"date":"6.7.2024","title":"In Deutschland wird genug geschlafen","author":"Marius Werz","link":"https://taz.de/die-gute-nachricht/!6019145&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Schlecht geschlafen? Die Straße zu laut, das Smartphone zu hell, die Kinder zu wach? Dass unsere Nachtruhe in der Regel besser ist, als mancher Bürosmalltalk vermuten lässt, zeigt die Zeitverwendungserhebung des Statistischen Bundesamtes. Im Jahr 2022 schliefen Menschen in Deutschland durchschnittlich 8 Stunden und 37 Minuten pro Nacht. Das sind 8 Minuten mehr als zehn Jahre zuvor. Damit liegt der Durchschnitt im Bereich der ärztlich empfohlenen 7 bis 9 Stunden für Erwachsene.Die Schlafdauer unterscheidet sich jedoch je nach Fa­mi­lien­situation. Paare mit Kindern schlafen mit 8 Stunden und 15 Minuten am wenigsten. Auch Alleinerziehende schlafen we­niger als kinderlose Singles. Ähnlich ungleich verteilt ist die Schlafdauer über Altersgruppen. Mit 9 Stunden und 42 Minuten schlafen Kinder und Jugendliche unter 18 am läng­sten. Im Laufe des Lebens wird das erst mal weniger. Wenn die Rente beginnt, schlafen Menschen wieder mehr: 8 Stun­den und 46 Minuten bei Menschen über 65. MariusWerz"},{"date":"29.6.2024","title":"Die Lohnlücke schrumpft","author":"Marius Werz","link":"https://taz.de/die-gute-nachricht/!6017582&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Der Mindestlohn zeigt Wirkung. Dem Statistischen Bundesamt zufolge reduzierte sich die Einkommensschere zwischen Gering- und Gutverdienenden zwischen April 2022 und April 2023. In dem Jahr sank der Unterschied im Bruttoeinkommen vom 3,28-Fachen auf das 2,98-Fache. Denn durch die Erhöhung des Mindestlohns im Oktober 2022 auf 12 Euro profitierten vor allem niedrige Einkommen. War die Spreizung der Einkommen in den Vorjahren relativ konstant, stiegen geringe Einkommen zwischen 2022 und 2023 um 12,4 Prozent, während Gutverdienende nur um 1,9 Prozent zulegten. Jedoch ist zu bedenken, dass die Einkommensverteilung die tatsächliche Ungleichheit im Land nicht abbildet. Vermögenswerte sind deutlich ungleicher verteilt, werden vererbt und generieren passive Einkommen. Die Vermögensungleichheit ist zwischen 2022 und 2023 gestiegen. Wer Ungleichheit wirklich effektiv bekämpfen will, muss an beiden Schrauben drehen, an Verdienst und an Vermögen. Marius Werz"},{"date":"22.6.2024","title":"Junge Menschen sind politischer","author":"Adefunmi Olanigan","link":"https://taz.de/die-gute-nachricht/!6015993&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Das politische Interesse junger Menschen ist in den letzten knapp 20 Jahren kontinuierlich gestiegen. Das zeigen Zahlen der Shell-Jugendstudie, die alle vier Jahre 12- bis 25-Jährige zu ihren gesellschaftspolitischen Einstellungen befragt. Gaben 2002 noch 30 Prozent an, sich für Politik zu interessieren, waren es 2019 bereits 41 Prozent. Junge Menschen sind auch zunehmend der Meinung, dass politisches Engagement wichtig für die Gesellschaft ist. Dies ist ein langfristiger Trend, der allerdings nur die Realität bis zur Coronapandemie widerspiegelt. Die nächste Shell-Jugendstudie erscheint im September 2024.Gleichzeitig können immer mehr Jugendliche politisch mitbestimmen. Bei immer mehr Landtags- und Kommunalwahlen dürfen sie schon ab 16 ihre Stimme abgeben. Zuletzt durften sie auch erstmals in ganz Deutschland bei den Europawahlen abstimmen. Dass viele junge Menschen unter 18 zudem besser vorbereitet werden, zeigen die Juniorwahlen: Dabei werden Jugendliche ab der 7. Klasse auf Landtags-, Bundestags- und Europawahlen vorbereitet, erhalten zunächst Unterrichtsmaterialien und geben schließlich ihre Stimme bei simulierten Wahlen ab. Mit der Herabsetzung des Wahlalters werden solche Konzepte verstärkt genutzt. Bei der Juniorversion der Europawahl dieses Jahr haben sich doppelt so viele Schulen beteiligt wie noch 2019. Damals nahmen 617.000 Jugendliche teil, 2024 waren es schon mehr als 1,5 Millionen Schüler*innen.Angesichts des erschreckenden Wahlverhaltens der Jugendlichen ist die erhöhte politische Partizipation für viele keine gute Nachricht. Zur Erinnerung: Laut Hochrechnungen wählten 16 bis 17 Prozent die AfD. Damit lagen sie im Durchschnitt leicht über dem Gesamtergebnis. Auch in Österreich und Frankreich sind rechte Parteien bei den Jüngeren beliebt.Diese Analyse greift aber zu kurz. Die größte Anhängerschaft hat die AfD bei den 35- bis 59-Jährigen. Dieser Altersgruppe wird aber nicht pauschal die Fähigkeit abgesprochen, eine informierte Entscheidung zu treffen. Die Tatsache, dass junge Menschen sich politisch interessieren und beteiligen wollen, kann auch als Einladung verstanden werden. Als Einladung an die bürgerlichen und linken Parteien, bei ihnen gezielter zu fischen. Adefunmi Olanigan"},{"date":"15.6.2024","title":"Mehr Wärmepumpen heizen Neubauten","author":"Anja Krüger","link":"https://taz.de/die-gute-nachricht/!6015036&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Wärmewende kommt voran: 96.800 neue Gebäude wurden im Jahr 2023 errichtet, in fast zwei Dritteln der Gebäude wurde als Hauptheizquelle eine Wärmepumpe installiert. Die sind klimafreundlicher als Gas- oder Ölöfen – erst recht, wenn der Strom für den Betrieb aus Erneuerbaren stammt. Das ist in Deutschland immer häufiger der Fall. Der Anteil an Wärmepumpen in neuen Gebäuden hat sich innerhalb von zehn Jahren verdoppelt, so das Statistische Bundesamt. Bei den 2023 genehmigten Neubauten liegt der Anteil an Wärmepumpen sogar bei mehr als drei Vierteln. Von den 2023 fertiggestellten Ein- oder Zweifamilienhäusern verfügen 69 Prozent über eine Wärmepumpe, bei Mehrfamilienhäusern sind es 41 Prozent. Die Gasheizung dagegen ist ein Auslaufmodell und nur in rund 20 Prozent der neuen Gebäude zu finden. Der Klimakiller Ölheizung ist gar vom Aussterben bedroht, 300 wurden 2023 montiert. Damit die Klimaziele im Gebäudesektor erreicht werden, müssen allerdings auch die bestehenden Häuser umgerüstet werden. Die Chancen dafür stehen gut. Seit Februar können Ei­gen­tü­me­r:in­nen von selbst genutzten Einfamilienhäusern die Förderung beantragen, seit Mai die von Wohnungen. Ab August wird das auch für Vermietende möglich. Anja Krüger Grafik: Anna Eschenbacher, Johanna Hartmann, Francesca Morini. Quelle: Statistisches Bundesamt. Fotos: stock.adobe.com"},{"date":"8.6.2024","title":"So viele neue Bür­ge­r*in­nen gab’s noch nie","author":"Frederik Eikmanns","link":"https://taz.de/die-gute-nachricht/!6013012&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Jede Menge neue Deutsche. Über 200.000 Einbürgerungen gab es im letzten Jahr, nie seit Einführung der Statistik waren es mehr. Mit der im Januar vom Bundestag beschlossenen Modernisierung des Staatsangehörigkeitsrechts, das Einbürgerungen teils erleichtert und beschleunigt, hat das jedoch nichts zu tun, denn das Gesetz tritt erst Ende Juni in Kraft. Es ist also Quatsch, dass Unionspolitiker die neuen Zahlen zum Anlass nehmen, die Ampel zu kritisieren. Der Anstieg geht vor allem auf die Ankunft von syrischen Geflüchteten seit 2014 zurück, sie machten über ein Drittel der Neueingebürgerten aus. Viele von ihnen lebten 2023 seit über acht Jahren in Deutschland – bisher eine der wichtigsten Anforderungen für die Einbürgerung.Nötig sind zudem nach wie vor Deutschkenntnisse und ein selbst erwirtschafteter Lebensunterhalt. Das zeigt, wie gut viele der Geflüchteten sich hier eingefunden haben. Die Ängste von Konservativen und Rechten vor mangelnder Integration sind also ebenfalls Quatsch. Frederik Eikmanns"},{"date":"1.6.2024","title":"Umweltzonen verringern Asthma","author":"Franca Parianen","link":"https://taz.de/die-gute-nachricht/!6011418&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Umweltzonen wirken! Und das schon von ganz klein auf. Vor 16 Jahren begann Deutschland, Diesel-Pkws und andere Dreckschleudern aus Teilen der Innenstädte zu verbannen, jetzt haben Forschende Krankenkassendaten ausgewertet. Das Ergebnis: Babys, die in Umweltzonen groß werden, entwickeln bis zum Grundschulalter deutlich weniger Atemwegserkrankungen, vor allem weniger Asthma. Im sensiblen Entwicklungsfenster vor und nach der Geburt sorgte schon eine leichte Verbesserung der Feinstaubwerte langfristig für 13 Prozent weniger asthmabezogene Verschreibungen. Es lohnt sich also, Kinder gerade in dieser sensiblen Phase zu schützen – das Ruhrgebiet, Augsburg und Leipzig machen es vor. Andere Städte haben ihre Niedrigemissionszonen leider bereits wieder aufgehoben. Umweltzonen, die nur einzelne Straßen oder kleine Flecke betreffen, bringen übrigens nichts – deshalb schauten die Forschenden sich diese gar nicht erst an. Weil die Gesundheit von Kindern offenbar nicht Argument genug ist, rechneten sie dann auch noch aus, wie viel Geld die Krankenkassen allein in den ersten fünf Lebensjahren durch den Wegfall von Atemwegserkrankungen sparten: Es waren 30,5 Millionen Euro. Franca Parianen"},{"date":"25.5.2024","title":"In Deutschland wird weniger Käse gegessen","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6009928&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Eine Scheibe Gouda zum Frühstück, zum Abendbrot ein Stück Brie. Das ist nach wie vor lecker, kommt in Deutschland aber mittlerweile seltener auf den Tisch. Nachdem der Pro-Kopf-Konsum aller Käsearten 2021 mit 25,34 Kilogramm einen Höchstwert erreicht hat, haben die Menschen in Deutschland 2023 im Schnitt nur noch 23,76 Kilogramm Käse gegessen. Zwar lag Anfang des Jahrtausends der Verzehr noch niedriger, dennoch ist in den letzten Jahren ein nennenswerter Rückgang zu verzeichnen. Den Zahlen des Bundesministeriums für Ernährung und Landwirtschaft liegt keine Erklärung für den Rückgang bei. Ein möglicher Grund: Käse ist in den vergangenen Jahren deutlich teurer geworden. Der Rückgang des Käsekonsums hat auch einen Vorteil fürs Klima: Bei der Haltung von Kühen wird sehr viel Methan freigesetzt. Das Gas ist neben CO2 ein entscheidender Treiber der Klimakrise. Ein Sonntagsfrühstück mit Marmelade oder Tomatenaufstrich statt Käse schont im besten Fall also Geldbeutel und Klima. Yannik Achternbosch"},{"date":"18.5.2024","title":"Immer mehr Länder verbieten Konversionstherapien","author":"Katharina Höring","link":"https://taz.de/die-gute-nachricht/!6008697&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Homosexualität ist keine Krankheit und braucht keine Behandlung. Das erkennen immer mehr Staaten an und verbieten sogenannte Konversionstherapien. Mit diesen sollte die sexuelle Orientierung von Homosexuellen oder die Geschlechtsidentität von trans Per­so­nen geändert oder „geheilt“ werden. Die Methoden reichen von negativen Bemerkungen bis hin zu Isolation, Elektroschocks und Schlägen. Für die Betroffenen bedeuten sie viel seelisches und körperliches Leid. Aber seit ein paar Jahren werden solche „Therapien“ zunehmend von Regierungen verboten. Seit 1991 gilt Homosexualität bei der WHO nicht mehr als psychische Störung. 1999 hat Brasilien als erstes Land Konversionstherapien verboten, Deutschland folgte 2020. Besonders in den letzten vier Jahren wurden mehr Verbote eingeführt, zuletzt im April in Mexiko. Wer dort Praktiken durchführt, die auf die Änderung der sexuellen Orientierung oder Geschlechtsidentität abzielen, dem drohen nun zwei bis sechs Jahre Freiheitsstrafe. Katharina Höring"},{"date":"11.5.2024","title":"Mehr Menschen brechen mit Genderklischees bei Berufswahl","author":"Katharina Höring","link":"https://taz.de/die-gute-nachricht/!6007039&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Frauen arbeiten so gut wie nie in der Informatik, Männer nur selten in der Pflege oder im Einzelhandel – das war lange Zeit die Realität in Deutschland. Doch es tut sich was: Laut Zahlen des Statistischen Bundesamts durchmischen sich die Berufe langsam. In den IT-Berufen ist der Frauenanteil zwischen 2013 und 2023 von 14 auf 18 Prozent gestiegen. Den stärksten Anstieg verzeichnet das Statistische Bundesamt aber beim Verkauf von Lebensmitteln. Vor zehn Jahren arbeiteten nur 14 Prozent Männer in der Branche, heute sind es immerhin 23 Prozent. Zum Abbau von Geschlechterklischees bei der Berufswahl haben möglicherweise der Girls’ Day und der Boys’ Day beigetragen: Seit 2001 können Mädchen beziehungsweise Jungen Berufe kennenlernen, in denen das eigene Geschlecht noch unterrepräsentiert ist. Die Statistik erfasst nur die Kategorien „Frauen“ und „Männer“. Daten zu non-binären und trans*­Per­so­nen wurden nicht erhoben.Katharina Höring"},{"date":"4.5.2024","title":"Das Organspende-Register kommt an","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6005869&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Fast 8.500 Personen stehen in Deutschland derzeit auf der Warteliste für ein Spenderorgan. Der größte Bedarf besteht bei Nieren. Aber die Bereitschaft zu spenden ist in Deutschland relativ gering. Auf eine Million Menschen kommen nur etwa 10 Spender:innen. Anfang 2020 hat der Bundestag daher ein Gesetz verabschiedet, das die Spendenbereitschaft einfacher dokumentieren soll. Teil davon ist ein Online-Register, in dem die Entscheidung für oder gegen eine Organspende nach dem Hirntod gespeichert wird. Seit dem 18. März haben sich bereits 110.000 Menschen eingetragen und damit eine Entscheidung getroffen, die Krankenhäuser jederzeit abrufen können.Ob mit dem zentralen Register die Bereitschaft für Organspenden steigt, ist allerdings unklar. Gesundheitsminister Karl Lauterbach fordert deshalb eine Widerspruchslösung, bei der grundsätzlich alle als Spen­de­r:in­nen gelten, es sei denn, sie widersprechen.Yannik Achternbosch"},{"date":"27.4.2024","title":"Das deutsche Fernsehen wird ein bisschen diverser","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6004780&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Die Queere Medien Datenbank Queermdb untersucht regelmäßig die Rollen queerer Personen in Filmen und Serien, seit 2021 explizit im deutschen Fernsehen. Im vergangenen Jahr verzeichnete sie eine deutliche Zunahme an relevanten queeren Rollen: In 4,9 Prozent der Filme und Serien mit einerFolgenlänge von mindestens 90 Minuten kam mindestens eine relevante queere Person vor. Verglichen mit 2021, damals lag der Anteil bei 2,4 Prozent, ist das mehr als eine Verdopplung in nur zwei Jahren.Diese Zunahme ist erfreulich, der Anteil an Filmen mit queeren Rollen allerdings immer noch sehr gering. Die meisten Filme und Serien mit relevanter queerer Rolle liefen demnach im RBB und bei Arte. Weit abgeschlagen sind die Privatsender Nitro und Pro7maxx.Anfang der 2000er Jahre wurde der sogenannte Bechdel-Test bekannter. Er untersucht, wie sehr sich die Darstellung von Frauen in Filmen Stereotype bedient. Inzwischen existiert er als Vito-Russo-Test auch für queere Rollen, benannt nach einem US-amerikanischen Autor. Die Auswertung zeigt, dass im deutschen Fernsehen zumindest etwa jeder zwanzigste Programmpunkt diesen Test erfüllen könnte.Yannik Achternbosch"},{"date":"20.4.2024","title":"Die ersten EU-Länder erkennen Femizid als Straftatbestand an","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6003004&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Unter dem Motto „Ni Una Menos“, auf Deutsch: „Nicht eine weniger“, versammelten sich in Lateinamerika Hunderttausende auf der Straße. Als Reaktion auf die Zunahme von Gewalt gegen Frauen, mit oftmals tödlichem Ende, forderten die Ak­ti­vis­t:in­nen ein schärferes Vorgehen gegen geschlechtsspezifische Gewalt. Viele lateinamerikanische Länder verschärften bereits in den 2010er Jahren ihre Gesetzgebung. Einige Jahre später folgten auch erste Regierungen in Europa: 2021 führte Zypern den Femizid als eigenen Straftatbestand ein, 2022 kam Malta dazu.Durch diese Gesetzesänderungen kann tödliche Gewalt gegen Frauen statistisch besser erfasst und quantifiziert werden. Die Fälle werden nicht, wie in Deutschland, als Mord oder Totschlag behandelt, sondern eigenständig kategorisiert. Zudem kann sich der geschlechtsspezifische Aspekt der Gewalt strafverschärfend auswirken. Im März 2024 folgte mit Kroatien das dritte EU-Land. Tätern drohen dort bei einem Femizid bis zu vierzig Jahre Haft. Yannik Achternbosch"},{"date":"13.4.2024","title":"Mehr Städte entkriminalisieren Fahren ohne Ticket","author":"Katharina Höring","link":"https://taz.de/die-gute-nachricht/!6001308&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Tausende Menschen müssen in Deutschland jedes Jahr ins Gefängnis, weil sie in öffentlichen Verkehrsmitteln ohne Fahrschein erwischt werden. Sie werden entweder zu einer Haftstrafe verurteilt – zum Beispiel wegen wiederholtem Fahren ohne Ticket – oder müssen eine sogenannte Ersatzfreiheitsstrafe antreten, weil sie das Bußgeld von 60 Euro nicht bezahlen können. Besonders oft betroffen sind Menschen, die sich das Ticket für Bus oder Bahn nicht leisten können: Wohnungslose, Suchtkranke, sehr arme Menschen. Angefangen mit Bremerhaven im Jahr 2012 hat sich das in acht Städten bereits geändert. Die Städte erstatten keine Strafanzeige mehr, ein Bußgeld muss aber weiterhin gezahlt werden. Dieses Jahr haben Karlsruhe und Halle eine entsprechende Regelung eingeführt. Auch Bundesjustizminister Marco Buschmann hatte 2022 angekündigt, Fahren ohne Ticket zur Ordnungswidrigkeit herabzustufen zu wollen. Passiert ist auf Bundesebene aber noch nichts. Katharina Höring"},{"date":"6.4.2024","title":"Biogemüse wächst auf mehr Acker","author":"Sophie Fichtner","link":"https://taz.de/die-gute-nachricht/!6000134&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Im vergangenen Jahr wurde in Deutschland auf knapp 18.100 Hektar Biogemüse angepflanzt. Im Vergleich zu 2022 ist die Anbaufläche damit um 3 Prozent gewachsen. Zwar gab es im Jahr 2021 bereits einmal mehr Anbaufläche für Biogemüse, die Biobranche geriet dann aber in eine inflationsbedingte Krise, womit auch der zwischenzeitliche Rückgang der Ackerfläche zusammenhängen könnte.Auch für Menschen, die kein Biogemüse essen, ist der erneute Anstieg eine gute Nachricht. Denn mehr ökologische Landwirtschaft bedeutet weniger Nitrat im Grundwasser, einen besseren Schutz der Biodiversität und gesündere Böden. Trotzdem macht die Fläche, auf der Biogemüse angebaut wird, nur 15 Prozent der gesamten Gemüseanbaufläche in Deutschland aus.Neben der Fläche ist auch die Erntemenge gegenüber dem Vorjahr gestiegen, um ganze 11 Prozent. Das liegt allerdings daran, dass eher auf schwere Sorten wie Zucchini und Möhren gesetzt wurde. Gemessen am Gewicht wurden am meisten Zwiebeln, Weißkohl und Rote Bete ökologisch angebaut. Sophie Fichtner"},{"date":"30.3.2024","title":"Erstmals treten 50 Prozent Frauen bei Olympia an","author":"Sophie Fichtner","link":"https://taz.de/die-gute-nachricht/!5998057&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Bei der kommenden Olympiade, die im Sommer in Paris stattfindet, werden zum ersten Mal gleich viele Frauen wie Männer antreten. Insgesamt nehmen 10.500 Athletinnen an der größten Sportveranstaltung der Welt teil. Frauen durften erstmals im Jahr 1900 bei den Spielen antreten. Das war vier Jahre nach den ersten Olympischen Spielen in Athen. 84 Jahre später lag der Frauenanteil allerdings immer noch bei gerade mal 23 Prozent. Obwohl er kontinuierlich gestiegen ist, dauerte es 124 Jahre bis zu einem ausgeglichenen Geschlechterverhältnis. Meilensteine gab es vorher trotzdem schon: Bei den Spielen in London im Jahr 2012 traten erstmals in allen olympischen Disziplinen Frauen an. Bei den Spielen in Tokio 2020 war das Geschlechter­verhältnis bereits in diesen Disziplinen ausgeglichen: BMX-Rennen, Mountainbike und Freestyle-Ringen. Während Frauen inzwischen 50 Prozent der Athlet:innen stellen, wird trans Frauen seit drei Jahren der Zugang zu den Olympischen Spielen erschwert. Sophie Fichtner"},{"date":"23.3.2024","title":"Balkon-­kraftwerke boomen","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!5997350&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Das mit der Solarwende klappt derzeit richtig gut, und auch private Haushalte sind voll dabei. Immer mehr Menschen in Deutschland betreiben zwischen Blumentopf und Hängematte ihr persönliches Solarkraftwerk. Ende des Jahres 2020 waren gerade einmal knapp 3.000 sogenannter Balkonkraftwerke am Netz. Im Jahr 2023 hatte sich ihre Zahl mehr als verhundertfacht, auf fast 350.000. Das zeigt eine Auswertung des Marktstammdatenregisters, in das alle Kraftwerke Deutschlands eingetragen werden müssen. All diese Balkonkraftwerke zusammen machten Ende 2023 etwa 0,3 Prozent der gesamten Solarleistung in Deutschland aus. Das klingt wenig – ist aber trotzdem gleich doppelt und dreifach Grund zur Freude: Mit Balkonkraftwerken können Menschen einen persönlichen Beitrag zur Stromwende leisten und gleichzeitig ihre Stromrechnung reduzieren. Der Strom wird dort produziert, wo er in der Regel auch verbraucht wird: in der eigenen Wohnung. Auch die Stromnetze werden so entlastet. Laut Verbraucherzentralen kann sich die Anlage deshalb schon innerhalb weniger Jahre lohnen. In den vergangenen Jahren haben zahlreiche Landesregierungen, aber auch Gemeinden Förderungen für Balkonkraftwerke gezahlt, wodurch sie noch einmal deutlich günstiger wurden. Für 2024 sieht die Prognose nicht mehr ganz so rasant, aber immer noch beeindruckend aus: Bis Ende des Jahres dürften noch einmal fast 100.000 neue Balkonkraftwerke ans Netz gehen. Lalon Sander"},{"date":"16.3.2024","title":"In Finnland gibt es kaum noch Menschen ohne Wohnung","author":"Benjamin Fischer","link":"https://taz.de/die-gute-nachricht/!5995923&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Jeder sollte eine angemessene Wohnung haben. Dieses Menschenrecht ist in Europa längst noch nicht verwirklicht. So leben Schätzungen zufolge mehr als eine halbe Million Menschen in Europa auf der Straße oder in temporären Unterkünften. Fast überall stagniert oder wächst deren Zahl. Eine Ausnahme ist Finnland. Das Land hat sein Ziel, Obdach- und Wohnungslosigkeit zu überwinden, fast erreicht. Von mehr als 17.000 Wohnungslosen in den achtziger Jahren sank die Zahl bis auf 3.429 im Jahr 2023, wie neue Zahlen des Finnischen Bauinstituts zeigen. Ein Grund dafür: Die finnischen Regierungen vergaben Tausende von Wohnungen. Anders als in vielen Einrichtungen in Deutschland ist das Leben dort nicht an Bedingungen wie etwa Drogenverzicht geknüpft. „Housing first“ heißt dieser Ansatz, der auch in Deutschland ausprobiert wird und stärker werden soll. Laut Koalitionsvertrag hat die deutsche Regierung das Ziel, allen Menschen bis 2030 eine Unterkunft zu geben. Gerade gibt es hier rund 263.000 Wohnungslose. Benjamin Fischer"},{"date":"9.3.2024","title":"Kleinstädte entdecken Carsharing","author":"Enno Schöningh","link":"https://taz.de/die-gute-nachricht/!5994428&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Renningen, Oderberg, Ratzeburg und Werther haben eins gemeinsam: In diesen Kleinstädten gibt es Carsharing-Angebote. Wenn ein Großeinkauf ansteht oder die Bahn streikt, kann man sich hier einen Wagen leihen und muss keinen eigenen besitzen. Teilen kann die Auslastung von Pkws vergrößern und die Fläche verringern, die Autos einnehmen. Zu Jahresbeginn 2024 gab es in 860 Kleinstädten – also Orten mit weniger als 20.000 Ein­woh­ne­r:in­nen – Carsharing-Angebote. Ein Jahr zuvor galt das nur für 678 Kleinstädte. Das ist ein Zuwachs von 182 Orten. Dennoch machen die Ratzeburgs und Oderbergs Deutschlands nur 8,5 Prozent aller Kleinstädte aus. In den allermeisten Orten nutzen die Mensche
