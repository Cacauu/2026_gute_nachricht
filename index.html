  <script>
    const EMBEDDED_ROWS = [{"date":"6.6.2026","title":"Die Wasserrettung bekommt mehr Nachwuchs","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6178518&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Wer diesen Sommer schon einen Badesee besucht hat, hat dort vielleicht auch einige der vielen Hel­fe­r:in­nen der DLRG, der Deutschen Lebens-Rettungs-Gesellschaft, getroffen. Um junge Menschen zur Ausbildung als Ret­tungs­schwim­me­r:in zu motivieren, bietet die DLRG seit 1990 das Juniorretterabzeichen für Kinder ab 10 Jahren an. Im vergangenen Jahr haben das so viele Kinder wie noch nie erfolgreich bestanden: Erstmals waren es mehr als 10.000. Die DLRG sieht darin eine sehr positive Entwicklung.Man hoffe aufgrund der starken Nachfrage, dass sich auch künftig genug Menschen für das ehrenamtliche Engagement entscheiden. Das erste offizielle Rettungsschwimmabzeichen in Bronze können Jugendliche ab 12 Jahren ablegen. Ab 14 Jahren folgt dann Silber und Gold mit 16. Sobald die Jugendlichen die Prüfung zum silbernen Rettungsschwimmabzeichen abgelegt haben und 16 Jahre alt werden, können sie bei der DLRG, etwa an Seen, ehrenamtlich in der Badeaufsicht arbeiten. Yannik Achternbosch"},{"date":"30.5.2026","title":"In vielen Ländern steigt das Glück","author":"Enno Schöningh","link":"https://taz.de/die-gute-nachricht/!6179777&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"In deutlich mehr Ländern blicken die Menschen zufriedener auf ihr Leben als früher. Der World Happiness Report 2026 hat untersucht, wie zufrieden die Menschen in 136 Ländern zwischen 2023 und 2025 im Vergleich zu vor rund 15 Jahren waren. Das Ergebnis: In 79 Ländern ist das Wohlbefinden gestiegen, in 41 gesunken. Den stärksten Einbruch verzeichnet das von Krieg und Taliban-Herrschaft gezeichnete Afghanistan. Glücklicher wurden vor allem Mittel- und Osteuropa samt Westbalkan.Im globalen Länderranking steht zum neunten Jahr in Folge Finnland an der Spitze, gefolgt von Island, Dänemark, Costa Rica und Schweden. Solche Ländervergleiche haben aber auch ihre Kritiker. Der Politikwissenschaftler Gary King etwa zeigte, dass Länderunterschiede auch daran liegen können, wie eine Antwortskala verstanden wird – und nicht allein daran, wie es den Menschen wirklich geht. Die Sorge: Bei solchen Vergleichen schlagen sich womöglich eher Sprache und Kultur nieder als das tatsächliche Befinden. Enno Schöningh"},{"date":"23.5.2026","title":"Spanien verkleinert Antibiotika-Packungen","author":"Sofia Zharinova","link":"https://taz.de/die-gute-nachricht/!6177977&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Antibiotikaresistenzen sind eine der größten Gefahren für die globale Gesundheit. Forschende haben in einer Studie beispielhaft errechnet, dass im Jahr 2019 rund 1,27 Millionen Menschen weltweit direkt an den Folgen von resistenten Erregern gestorben sind. Einer der wichtigsten Wege, um zu verhindern, dass sich solche Keime entwickeln: nur dann Antibiotika nehmen, wenn es nötig ist. Spanien hat als Schritt dahin eine einfache Regelung verabschiedet – die Packungsgrößen werden kleiner. Eine Packung Amoxicillin soll ab 2027 nur noch 20 statt 30 Tabletten enthalten. Das Antibiotikum wird relativ häufig verschrieben, etwa bei Bronchitis oder Mandelentzündung. Bei großen Packungen bleiben oft Reste übrig und Menschen nehmen diese bei späteren Erkrankungen ein, statt sich ärztliche Hilfe zu holen. Zudem wird Arzneimittelabfall vermieden. Wer Tabletten ins Klo wirft – sie gehören in den Restmüll, in die Apotheke oder an einigen Orten wie Berlin in Recyclinghöfe – kann zur Bildung von Resistenzen beitragen. Sofia Zharinova"},{"date":"16.5.2026","title":"Immer mehr Länder führen Malaria-Impfung ein","author":"Sofia Zharinova","link":"https://taz.de/die-gute-nachricht/!6175567&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Seit 2024 haben 22 zusätzliche Länder die Malaria-Impfung in ihre Impfprogramme aufgenommen. Mit finanzieller Unterstützung der internationalen Impfstoffallianz Gavi wurden seitdem rund 50 Millionen Dosen verabreicht.In Ländern wie Kenia, Malawi, Ghana und Kamerun konnten durch die Impfungen schwere Malariafälle und Krankenhaus­einweisungen reduziert werden. In Burkina Faso ist die Zahl der Malariafälle zwischen 2024 und 2025 sogar um rund ein Drittel gesunken. Laut der Impfstoffallianz konnte über alle Länder hinweg die Zahl der Menschen, die an Malaria sterben, um etwa 50 Prozent gesenkt werden. Lange wurden die Impfstoffe aufgrund ihrer begrenzten und relativ schnell nachlassenden Wirkung kritisiert. Trotzdem überwiegt der Nutzen der Impfung. 2021 erteilte die WHO die Empfehlung für ihren breiten Einsatz. Derzeit gibt es zwei zugelassene Impfstoffe, deren Schutzwirkung zwischen 56 und 75 Prozent liegt. Studien zeigen, dass der Impfschutz bei Probanden aus saisonal von Malaria betroffenen Gebieten etwas höher ist als in ganzjährig betroffenen Gebieten.Sofia Zharinova"},{"date":"2.5.2026","title":"Wer mit Bus und Bahn pendelt, spart kräftig","author":"Luis Bretthauer","link":"https://taz.de/die-gute-nachricht/!6170765&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Pendeln und Autofahren galten lange Zeit als untrennbar. Doch das im Mai 2023 eingeführte Deutschlandticket holt immer mehr Menschen aus dem Auto und in die Bahn. Insbesondere in Metropolregionen und deren Umland konnte der öffentliche Nahverkehr Nut­ze­r:in­nen dazugewinnen, resümiert das Deutsche Zentrum für Schienenverkehrsforschung. In ländlichen Regionen mit geringer Abdeckung stiegen die Menschen allerdings nur begrenzt auf Bus und Bahn um.Insgesamt konnten 2024 durch den generellen Verzicht auf das Auto 2,5 Millionen Tonnen CO2 eingespart werden. Diejenigen, die für den Arbeitsweg das Auto stehen lassen, sparen zudem kräftig. Die durchschnittlichen monatlichen Kosten pro ÖPNV-Pendler*in sind aufgrund des Deutschlandtickets zwischen 2022 und 2024 um 16,50 Euro gesunken. 2024 kostete das allgemeine Deutschlandticket 49 Euro im Monat. Au­to­pendler*innen hingegen mussten 2024 im Schnitt 178,90 Euro blechen. Luis Bretthauer"},{"date":"25.4.2026","title":"Die Welt braucht mehr Strom –das decken jetzt Erneuerbare","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6170301&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Emissionen in der Stromproduktion sind vergangenes Jahr gesunken und es gibt gute Gründe anzunehmen, dass sich der Trend fortsetzen wird. Dabei ist 2025 der weltweite Stromverbrauch weiter gestiegen – allgemein ein gutes Zeichen, weil es bedeutet, dass Menschen im Globalen Süden seltener in Energiearmut leben. Dieses Wachstum wurde vollständig durch erneuerbare Energien gedeckt. In der Folge sanken die Stromproduktion aus fossilen Brennstoffen leicht und die Emissionen um minimale 0,2 Prozent.Die Zahlen stammen aus dem Jahresbericht von Ember Energy, die jedes Jahr die Stromerzeugungsdaten aus zahlreichen Ländern zusammentragen. Anders als in der Coronapandemie habe der Rückgang bei den Treibhausgasen diesmal strukturelle Gründe, heißt es, nämlich den globalen Solarboom. Die solare Stromerzeugung wachse derzeit exponentiell um mehr als 20 Prozent im Jahr. Am bedeutendsten ist dieser Boom in China und Indien, wo der Stromverbrauch in den vergangenen Jahrzehnten stark gestiegen ist und durch fossile Kraftwerke gedeckt wurde. Im vergangenen Jahr war das erstmals nicht der Fall: In beiden Ländern wurden die erneuerbaren Energien schneller ausgebaut als der Verbrauch anstieg. Lalon Sander"},{"date":"18.4.2026","title":"EU nimmt Kabelsalat vom Menü","author":"Lilli Messer","link":"https://taz.de/die-gute-nachricht/!6168203&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Irgendwo gibt es sie an fast jedem Schreibtisch, die Chaos-Kabelschublade. Darin meist wirr verknuddelt: Micro-USB- mit Lightningkabel mit altem DC-Kabel. Man öffnet sie selten. Wenn, dann eben nur, um ein passendes Kabel zu suchen oder ein ungenutztes hineinzustopfen. Bald kann man sie gänzlich geschlossen lassen – oder freiräumen. Bereits seit Ende 2024 gilt EU-weit für elektrische Kleingeräte – ob Handy, Tablet, Kopfhörer oder Navi: Sie alle brauchen einen USB-C-Anschluss. Und nun, ab dem 28. April, gilt diese Regelung auch für Notebooks und Laptops. Künftig genügt also ein einziges Kabel für all diese Geräte. Das wird nicht nur vielen den Alltag erleichtern, sondern auch für weniger Müll sorgen. Bis zu 11.000 Tonnen Elektroschrott verursachen die derzeit noch verschiedenartigen Ladekabel und -geräte in der EU jährlich. Und auf noch eine Neuerung dürfen die Ver­bau­che­r:in­nen sich freuen: Laptop & Co werden sie künftig auch ohne Ladegerät erwerben können. Unterm Strich könnten sie so EU-weit rund 250 Millionen Euro im Jahr sparen. Und die Kabelschublade würde sich mit jedem Neukauf nicht doch weiter oder wieder füllen. Raum für Neues? Lilli Messer"},{"date":"11.4.2026","title":"So wenig Braunkohleabbau wie seit 112 Jahren nicht","author":"Nick Reimer","link":"https://taz.de/die-gute-nachricht/!6165898&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"84 Millionen Tonnen Braunkohle wurden im vergangenen Jahr in Deutschland abgebaut, so wenig waren es zuletzt 1914. Das geht aus Daten des Fraunhofer-Instituts für Solare Energiesysteme ISE hervor. Damals begann man gerade, die erdgeschichtlich jüngste aller Kohlearten per Tagebau abzubauen; Kettenbagger trugen die oberen Erdschichten ab, unter denen die Kohleschichten lagen. So wurde die Braunkohle gegenüber der Steinkohle konkurrenzfähig, was die Nachfrage binnen der kommenden 15 Jahre verdoppelte. Auf ihrem Höhepunkt 1985 verbrannten die beiden deutschen Staaten zusammen 433 Millionen Tonnen. Mit erheblichen Nebenwirkungen: Nicht nur wurden Landschaften zerstört, Menschen ihrer Heimat beraubt, die unentschwefelten Abgase verursachten auch das erste Waldsterben in Mitteleuropa. Zudem ist Braunkohle der klimaschädlichste Energieträger – beim Verbrennen einer Tonne entstehen bis zu 1,2 Tonnen CO2. Deshalb muss die Bundesrepublik schleunigst raus aus dieser Uralt-Technologie. Im rheinischen Revier soll die Kohleverstromung 2030 enden, im Osten der Republik 2038. Zumal diese immer unwirtschaftlicher wird, wie Daten des Braunkohle-Lobbyverbandes Debriv zeigen. Im vergangenen Jahr ging der Einsatz von Braunkohle besonders drastisch im Mai, Juni und August zurück, also in den Monaten, in denen Photovoltaik besonders viel Strom produzierte. Nick Reimer"},{"date":"4.4.2026","title":"Mehr Menschen erreichen ohne Abitur einen Hochschulabschluss","author":"Leonard Kirschhöfer","link":"https://taz.de/die-gute-nachricht/!6164590&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Wer an die Uni will, braucht Abitur oder Fachabitur – das war lange unverrückbar. Seit 2009 geht es auch anders. Und seitdem steigt die Zahl der Menschen, die ohne Abitur den Hochschulabschluss schaffen, immer weiter, wie eine Datenanalyse des Centrums für Hochschulentwicklung zeigt. Demnach haben inzwischen 104.941 Menschen einen Bachelor- oder Masterabschluss erworben. Die jährlichen Abschlusszahlen haben sich seit 2009 mehr als verdreifacht. Nötig für das Studium ist ein sogenannter fachgebundener Hochschulzugang. Das ist in der Regel eine erfolgreich abgeschlossene Ausbildung und mehrjährige Berufserfahrung, die ermöglicht, dass man in demselben Feld studiert. So können sich Menschen zum Beispiel für Führungspositionen weiterbilden. Wer einen Meistertitel hat, kann dann sogar etwas jenseits seines Fachbereichs studieren. Aktuell sind rund 70.000 Studierende ohne Hochschul- und Fachhochschulreife an deutschen Hochschulen immatrikuliert. Das sind etwa 2,4 Prozent aller Studierenden. Führend sind Bremen, Thüringen und Hamburg. Leonard Kirschhöfer"},{"date":"28.3.2026","title":"In deutschen Städten fahren mehr Elektrobusse","author":"Nanja Boenisch","link":"https://taz.de/die-gute-nachricht/!6162890&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Wer ist schon mal in die Abgaswolke eines Busses geraten? Das ist unangenehm, wird aber unwahrscheinlicher: Ende 2025 waren in Deutschland insgesamt 4.034 Stadtbusse mit Batterie un­ter­wegs, einer von sieben fuhr elektrisch. Dazu kamen 628 mit Brennstoffzelle und 90 mit Oberleitung. Von den Bussen, die 2025 neu angeschafft wurden, war fast jeder zweite vollelektrisch. Das hat die Beratungsfirma PwC in ihrem diesjährigen E-Bus-Radar erhoben. Weil E-Busse meist noch deutlich teurer seien als ver­gleichbare Verbrenner, blieben staatliche Förderprogramme „entscheidend“, schreibt PwC, die Nachfrage nach Förderung sei größer als das Angebot. Laut Verkehrsminister Patrick Schnieder (CDU) hat der Bund seit 2021 mehr als 2.200 E-Busse gefördert und so im Vergleich zu Dieselbussen mehr als 130.000 Tonnen CO2 ein­gespart. Und auch wenn der deutsche Verkehrssektor seine Kli­maziele 2025 krachend verfehlt hat – bei Bussen stieg der E-An­teil schneller als bei Pkw oder Lkw. Für 2026 verspricht Schnieder 500 Millionen Euro neue E-Bus-Förderung. 11.000 elek­tri­sche Linien­busse sollen bis 2030 auf deutschen Straßen unterwegs sein. Nanja Boenisch"},{"date":"21.3.2026","title":"Chile gewinnt den Kampf gegen Lepra","author":"Adefunmi Olanigan","link":"https://taz.de/die-gute-nachricht/!6161507&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Als zweites Land der Welt hat Chile nach Jordanien nun offiziell die Lepra ausgerottet, verkündete die Weltgesundheitsorganisation (WHO) Anfang März. Die Folgen der bakteriellen Infektionskrankheit können ein ganzes Leben beeinflussen: Lähmung, der Verlust von Gliedmaßen bis hin zu Erblindung. Das gesellschaftliche Stigma hält in vielen Ländern den Teufelskreis zwischen Erkrankung und Armut am Leben. Laut der WHO haben Früherkennung und eine ganzheitliche Betreuung in Versorgungszentren in Chile dabei geholfen, den Kreislauf zu durchbrechen. Dort werden auch die langfristigen Folgen behandelt. Seit mehr als 30 Jahren hat sich in Chile niemand mehr innerhalb des Landes angesteckt. Die wenigen registrierten Fälle wurden allesamt eingeschleppt. 2021 waren das mit 10 Fällen noch die meisten. Statistisch betrachtet liegt diese Zahl auf eine Million Einwohner gerechnet zwischen 0 und 1 Fall. Argentinien registrierte im selben Jahr 3 Fälle pro einer Million Menschen im Land, Brasilien sogar 87 Fälle. Ziel der WHO ist es, die Krankheit bis 2030 global auszurotten. Doch immer noch erkranken mehr als 200.000 Menschen jährlich. Die meisten davon in Indien, gefolgt von Brasilien.Adefunmi Olanigan"},{"date":"14.3.2026","title":"Weniger Kinder erkranken schwer am RS-Virus","author":"Luis Bretthauer","link":"https://taz.de/die-gute-nachricht/!6157023&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Eine schwere Erkrankung am Respiratorischen Synzytial-Virus (RSV) bei Neugeborenen ist ein Schrecken für jede Familie. Die Atemwegsinfektion sorgte in der Vergangenheit gerade in der kalten Jahreszeit dafür, dass Kin­der­ärz­t*in­nen und Kinderkliniken enorm belastet waren. Seit 2024 übernehmen Krankenkassen die Kosten für die Immunisierung von Säuglingen. Diese Entscheidung hat sich offensichtlich gelohnt: Sowohl im damaligen Winter als auch in diesem ging die Zahl der schweren RSV-Infektionen bei den Kleinsten deutlich zurück. Das ergeben Daten, die das Robert Koch-Institut sammelt, seit die Infektion 2023 meldepflichtig wurde. Während 2023/24 in der Saison von Oktober bis Februar noch 21.452 schwere Fälle auftraten, waren es ein Jahr später nur noch 8.951 und vergangenen Winter noch mal weniger. Die Immunisierungsquote der zwischen April und September 2024 geborenen Säuglinge lag laut RKI bei 54 Prozent – erfreulich hoch für eine gerade erst eingeführte Immunisierung. Luis Bretthauer"},{"date":"28.2.2026","title":"Die Ostsee bekommt frisches Wasser","author":"Nick Reimer","link":"https://taz.de/die-gute-nachricht/!6154472&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Sie gilt als die größte Totwasserzone der Welt: eine Fläche in der Ostsee, dreimal so groß wie Hessen, mit so wenig Sauerstoff, dass aquares Leben dort nicht mehr möglich ist, ermittelten finnische Wissenschaftler. Ursache ist vor allem die Landwirtschaft, die viel zu viel Gülle oder Kunstdünger auf die Felder kippt. Der gelangt dann über das Grundwasser und die Flüsse ins Binnenmeer und sorgt dort dafür, dass sich Blaualgen explosionsartig vermehren. Dazu kommt der Klimawandel: Immer häufiger wird im wärmer gewordenen Wasser vor allem der westliche Teil der Ostsee von einem riesigen grünen Algenteppich bedeckt. Sterben die Algen ab, sinken sie zu Boden, wo Bakterien die Reste zersetzen. Dafür brauchen sie viel Sauerstoff, der etwa Krebsen und Fischen fehlt. Zuletzt peitschte Ostwind wochenlang die Wassermassen Richtung Nordsee, ein seltenes Wetterphänomen. Am Pegel Landsort-Norra vor der schwedischen Hauptstadt Stockholm fehlten Mitte Februar 67 Zentimeter Wasser. Besonders niedrig war der Wasserstand zwischen Finnland und Schweden sowie vor dem Baltikum, weniger an deutschen Küsten. Verglichen mit dem Normalzustand fehlten insgesamt 390 Milliarden Kubikmeter Nass, so erklärt Matthias Premke-Kraus vom Leibniz-Institut: „Starke Westwinde werden den Trend der letzten Wochen umkehren, frisches Wasser aus dem Atlantik fließt zurück.“ Und dieses Wasser wird kühler und sauerstoffreich sein. Nick Reimer"},{"date":"21.2.2026","title":"Weniger alkoholbedingte Krankenhausaufenthalte","author":"","link":"https://taz.de/die-gute-nachricht/!6152729&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"2024 wurden 283.499 Menschen aufgrund von alkoholbedingten Krankheiten stationär behandelt. Das ist fast ein Drittel weniger als vor zehn Jahren, wie das Statistische Bundesamt mitteilt. Den stärksten Rückgang gab es bei den 10- bis 19-Jährigen. Hier sank die Zahl der Behandlungen um fast zwei Drittel von 24.300 auf 10.000. Bei Personen ab 80 Jahren gab es hingegen einen Anstieg um 22,4 % auf 3.300 Fälle. Insgesamt handelt es sich bei fast drei Viertel der Betroffenen um Männer, 26,7 % sind Frauen. Berücksichtigt wurden alle stationären Krankenhausaufenthalte aufgrund von Krankheiten, die vollständig alkoholbedingt sind. Mit 42,5 % der Fälle war Alkoholabhängigkeit die mit Abstand häufigste Ursache für einen solchen Krankenhausaufenthalt. Rund ein Fünftel der Behandlungen gingen auf einen akuten Rausch zurück. Entzugsbehandlungen sind nicht berücksichtigt. Durch den Rückgang der stationären Krankenhausaufenthalte aufgrund von Alkoholkonsum wird das Gesundheitssystem entlastet. Der Konsum bleibt aber ein wichtiger Risikofaktor für viele Erkrankungen und Unfälle. Amélie Richter"},{"date":"14.2.2026","title":"In Deutschland boomen Batteriespeicher","author":"Nick Reimer","link":"https://taz.de/die-gute-nachricht/!6151061&s=gute%2Bnachricht&SuchRahmen=Print/","category":"technology_science","text":"Batteriespeicher sind ein wichtiger Baustein der Energiewende, und ihre Kapazität in Deutschland wächst rapide. Sie hat sich in den letzten fünf Jahren verzehnfacht. Um den günstigen Solarstrom vom Dach zu speichern, installierten Privatpersonen fast 2 Millionen Heimbatterien. Die Kapazität dieser Heimspeicher wuchs auf fast 20 Gigawattstunden (GWh) – genug, um mehrere Millionen Haushalte einen halben Tag lang zu versorgen. Auch die Zahl der Gewerbe- und Großspeicher zieht an, sie sind ein attraktives Geschäftsmodell: Wenn viel Wind weht und die Sonne scheint, ist das Netz so voll mit Grünstrom, dass Kraftwerke abgeschaltet werden müssen und der Strompreis an der Börse manchmal sogar ins Negative dreht. Wer dann noch Strom abnimmt, bekommt Geld dazu. Speist man diesen Strom später wieder ins Netz ein, lässt sich damit Geld verdienen. RWE baut deshalb am früheren AKW Gund­remmingen eine 700-MWh-Batterie, und auch der Kohlekonzern LEAG investiert in der Lausitz in ein Speicherprojekt. Bis 2030 will die Branche die Speicherkapazitäten vervierfachen. Wirtschaftlich wurden diese Projekte aufgrund von Milliardeninvestitionen chinesischer Firmen in Batterietechnologie. Durch sie sanken die Preise in den letzten zehn Jahren um bis zu 90 Prozent. Nick Reimer"},{"date":"7.2.2026","title":"Weniger Menschen werden an Lungenkrebs sterben","author":"Amélie Richter","link":"https://taz.de/die-gute-nachricht/!6148166&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"In der EU belegt Lungenkrebs Platz eins der krebsbedingten Todesursachen. Aber vor allem bei den unter 65-Jährigen soll die Sterberate nun abnehmen, sagt ein Forschungsteam von der Universität Mailand, dessen vorangegangenen Prognosen sich als zuverlässig erwiesen haben. Nach ihrer Studie lag die um Alterseffekte bereinigte Sterberate bei den Männern von 2020 bis 2022 noch bei 29,6 von 100.000 Männern, 2026 soll sie auf 22,9 sinken. Generell nahm die Rate der Männer in den vergangenen Jahrzehnten kontinuierlich ab, lag dabei aber immer weitaus höher als die der Frauen. Bei denen erwartet das Forschungsteam eine bereinigte Sterberate von 12,5. Besonders bei den Jüngeren wird sie sinken, während sie bei den Seniorinnen leicht ansteigt. Der allgemeine Rückgang wird vor allem durch bessere Vorbeugung, Früherkennung und Behandlung erklärt. Wichtig, betonen die Forschenden, bliebe nach wie vor der Ausbau umfassender Regulierungen, um den Tabakkonsum einzuschränken. Amélie Richter"},{"date":"31.1.2026","title":"China und Indien wenden sich von fossilem Strom ab","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6147003&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"In China und Indien zeichnet sich ein Wendepunkt in der Energiegewinnung ab: In beiden Ländern ist 2025 die Stromproduktion aus fossilen Energien gesunken, insbesondere aus der Kohleverstromung. Und das, obwohl ihr Stromverbrauch weiter wächst. Das zeigt eine Analyse des Centre for Research on Energy and Clean Air basierend auf Daten der zentralen Strombehörden in beiden Ländern. In China sank die Stromproduktion aus fossilen Brennstoffen von 6.237 Terawattstunden auf 6.164, ein Rückgang um etwa 1,6 Prozent. In Indien war die Entwicklung deutlicher: Dort sank die fossile Stromproduktion von 1.578 Terawattstunden auf 1.516, also um etwa 3.9 Prozent. Eine Terawattstunde entspricht einer Milliarde Kilowattstunden, in Deutschland entspricht eine Terawattstunde dem Jahresverbrauch von etwa 200.000 Vier-Personen-Haushalten. Ein wesentlicher Grund für die Entwicklung: Beide Länder haben die erneuerbaren Energien ausgebaut. In Indien kamen 35 Gigawatt von Solarkraftwerken und 6 Gigawatt durch Windräder hinzu, in China mehr als 300 Gigawatt Solar- und 100 Gigawatt Windenergie. Zum Vergleich: In Deutschland wurden 2025 Solaranlagen mit insgesamt 17 Gigawatt und Windkraftanlagen mit 5 Gigawatt neu gebaut. Empfohlener externer Inhalt Wir würden Ihnen hier gerne einen externen Inhalt zeigen. Sie entscheiden, ob Sie dieses Element auch sehen wollen: Externen Inhalt erlauben Ich bin damit einverstanden, dass mir externe Inhalte angezeigt werden. Damit können personenbezogene Daten an Drittplattformen übermittelt werden. Mehr dazu in unserer Datenschutzerklärung steffiOtaz_de.WebelementSwitch().setWebelementSwitch(\"html-59p2mfdcn\"); In Indien kommt noch das geringere Wirtschaftswachstum und milderes Wetter als Erklärung hinzu. Das Wachstum sauberer Energien müsse beschleunigt werden, damit die Emissionen auch dauerhaft sinken, schreibt Analyse-Autor Lauri Myllyvirta. Allerdings wird in Indien nur etwa ein Fünftel so viel Strom produziert wie in China, so dass der Einfluss des Landes auch deutlich niedriger ist. 1,5-Grad-Grenze wird dennoch überschritten Die Stromproduktion in China und Indien war in den vergangenen zehn Jahren für 90 Prozent der steigenden globalen Emissionen verantwortlich. Eine Wende dort dürfte auch eine weltweite Wende zur Folge haben. Dennoch werden beide Länder wohl noch einige Jahre hohe fossile Stromemissionen haben, sodass das Überschreiten der 1,5-Grad-Grenze kurzfristig so gut wie sicher ist. Sowohl China als auch Indien tragen historisch deutlich weniger Verantwortung für die Klimakrise als etwa die USA oder Europa, pro Kopf emittieren die Menschen dort weiterhin weniger, viele leben in Energiearmut. Der gestiegene Verbrauch in den vergangenen Jahren bedeutet dass mehr Menschen dort Zugang zu mehr Energie haben. Allerdings wurde dieser vor allem durch fossile Verbrennung gedeckt. Nun könnten sich, wie bereits in Europa und Nordamerika, Emissionen und Verbrauch entkoppeln."},{"date":"24.1.2026","title":"Nicht mehr im Taxi durch Paris","author":"Rudolf Balmer","link":"https://taz.de/die-gute-nachricht/!6144340&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Viele Pariser spüren es im Alltag, und auch die Statistik zeigt: Fahrräder erobern die Stadt. Die rot-grüne Hauptstadt­regierung präsentiert stolz Zahlen, die zeigen, dass allein von 2023 bis Ende 2024 zusätzliche Wege für Zweiräder in 77,7 Kilometer Länge geschaffen wurden. Auf insgesamt 1.565 Kilometern sollen sich Benutzer der „Vélos“ sicher fortbewegen dürfen, eine Zahl, die beim Kommunal­wahl­kampf im März durchaus hilfreich sein dürfte. Bei genauerem Hinsehen zeigt sich jedoch, dass nicht nur echte Radwege gezählt wurden, sondern auch die für Busse und Taxis reservierten Spuren und vor allem auch die zahlreichen Einbahnstraßen, in denen Fahrräder in die Gegenrichtung fahren dürfen – was in einigen Fällen weniger Freiheit als Lebensgefahr bedeutet. Die Tendenz der Pariser Verkehrswende dürfte trotzdem stimmen. Immer mehr Menschen trauen sich aufs Rad, 2024 wurden 11,2 Prozent der Strecken darauf zurückgelegt. Das „Vélo“ ist damit gegenüber dem Auto auf der Überholspur. Rudolf Balmer"},{"date":"17.1.2026","title":"Das Ozonloch schrumpft schneller als erwartet","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6142366&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Der 1. Dezember 2025 war für die Antarktis ein kleiner Feiertag, denn über dem Südpol schloss sich das Ozonloch früher als in den vergangenen Jahren. Und auch insgesamt war das Ozonloch 2025 das kleinste in den fünf Jahren zuvor. Zum Vergleich verwendet die Nasa die durchschnittliche Größe des Lochs in der Atmosphäre vom 7. September bis zum 13. Oktober. 2025 lag die Ausprägung in diesem Zeitraum durchschnittlich bei 18,7 Millionen Quadratkilometern und damit ähnlich niedrig wie 1991. Die Entwicklung zeigt, wie wirkungsvoll internationale Abkommen für den Klimaschutz sein können: Ein Treiber für das Ozonloch sind Fluorchlorkohlenwasserstoffe (FCKW), die neben ihrer ozonschädigenden Wirkung auch potente Treibhausgase sind. Mit dem Montrealer Abkommen wurde 1987 ein schrittweiser Ausstieg aus FCKW beschlossen. Die Ozonschicht absorbiert als Sicherheitsmechanismus der Atmosphäre einen Großteil der gesundheitsschädlichen UV-B-Strahlung der Sonne. Yannik Achternbosch"},{"date":"10.1.2026","title":"Hessens Landesbedienstete fahren weniger Auto","author":"Clara Dünkler","link":"https://taz.de/die-gute-nachricht/!6140131&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Wenn Bus und Bahn kostenlos sind, kann man das eigene Auto abschaffen. So zumindest hat sich je­de:r achte hes­si­sche Lan­des­be­diens­te­te in den vergangenen acht Jahren entschieden, wie eine Befragung des Instituts für angewandte Sozialwissenschaft (infas) ergab. Und für mehr als die Hälfte von ihnen war ein wichtiger Grund für die Veränderung das vom Bundesland Hessen 2018 eingeführte kostenlose ÖPNV-Ticket, das allen seinen Angestellten – zum Beispiel Leh­re­r:in­nen, Rich­te­r:in­nen oder Verwaltungs­mitarbei­tenden – zur Verfügung steht. Das sogenannte Landesticket zeigt große Wirkung. So nutzten laut infas-Bericht vor seiner Einführung nur 16 Prozent der hessischen Landesbediensteten öffentliche Verkehrsmittel für ihre Wege. Mittlerweile seien es 29 Prozent. Außerdem gaben 20 Prozent der Befragten an, dass sie sich ohne das kostenlose Ticket auf jeden Fall oder sehr wahrscheinlich ein Auto gekauft hätten. Das macht 36.000 Neuanschaffungen, die es nun nicht geben musste. Clara Dünkler Credits: Johanna Hartmann, Anna Eschenbacher, Rita Eperjesi. Quelle: Landesinnenministerium Hessen; Landeswirtschaftsministerium Hessen. Fotos: stock.adobe.com; unsplash.com"},{"date":"3.1.2026","title":"In Frankfurt kiffen Schü­le­r:in­nen weniger","author":"Alexander Diehl","link":"https://taz.de/die-gute-nachricht/!6138492&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Zwar sind sie beim ersten Zug an Joint, Bong oder Pfeife noch mal etwas jünger geworden – 15 Jahre alt sind die Cannabis-Debütant:innen. Aber die Zahl der Ausprobierenden oder auch regelmäßig Konsumierenden unter 18 Jahren geht zurück. Zumindest in Frankfurt am Main: Seit 2002 erfragt dort die Studie Monitoring-System Drogentrends (MoSyD) alljährlich, nun, die Trends beim Drogenkonsum, ob legal oder illegal. Das ermöglicht inzwischen auch längerfristige Vergleiche, die ergiebiger sein können, als etwa der Blick nur aufs jeweilige Vorjahr. 2024 also, im „ersten Jahr der entsprechenden Gesetzesänderung zur Teillegalisierung für Erwachsene“, gaben 22 Prozent der befragten 15- bis 18-Jährigen an, schon mindestens einmal im Leben Marihuana und/oder Haschisch konsumiert zu haben – gegenüber 46 Prozent im Jahr 2002 ist das ein Rückgang um mehr als die Hälfte. 9 Prozent hatten nach eigenen Angaben in den zurückliegenden 30 Tagen gekifft, 3 Prozent mindestens zehnmal im vergangenen Monat. Alle drei Werte sind „im Langzeitvergleich eher niedrig“, seit Beginn der jährlichen Erhebung „haben noch nie so wenige Schü­le­r:in­nen Cannabis konsumiert“. Die eigentliche gute Nachricht: Cannabis wird nicht nennenswert durch andere, härtere Substanzen verdrängt. In der befragten Gruppe stagnieren oder sinken auch die Zahlen für Alkohol und Tabak, nicht mal gedaddelt wird mehr als früher. Was der Eintritt ins sogenannte Erwachsenenalter mit den jungen Leuten und ihrer Vernunft anstellt, darüber weiß die Studie nichts zu sagen. Alexander Diehl"},{"date":"27.12.2025","title":"Die Mehrheit der Deutschen ist bereit für kontroverse Gespräche","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6137288&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Nicht alle Menschen sind mit linken Großeltern und liebenswürdigen Kol­le­g:in­nen gesegnet. Viele landen immer wieder in Situationen, in denen sie mit Menschen diskutieren müssen, die Meinungen vertreten, die sehr konträr zu den eigenen sind. Das Wissenschaftsbarometer hat die vier Themenfelder Klimawandel, Gendern, Migration und Ungleichheit als Bereiche mit besonders hohem Konfliktpotenzial identifiziert und dazu eine Umfrage durchgeführt. Die Teilnehmenden wurden gefragt, ob sie bei diesen Themen offen für Gespräche mit sehr anderen Meinungen seien. Und obwohl so oft von einer gespaltenen Gesellschaft gesprochen wird und sich um den Zusammenhalt gesorgt wird, sagte mehr als Hälfte der Teilnehmenden: Ja, dafür bin ich offen. Lediglich 16 Prozent waren nicht oder kaum offen für ein kontroverses Gespräch. Auch wenn das vielleicht nicht bei jedem Weihnachtsessen der Fall gewesen sein mag: Die deutsche Gesellschaft ist bereit, miteinander zu reden. Yannik Achternbosch Grafik: Rita Eperjesi, Johanna Hartmann, Anna Eschenbacher. Quelle: Wissenschaftsbarometer 2025. Fotos: stock.adobe.com, unsplash.com Grafik: Rita Eperjesi, Johanna Hartmann, Anna Eschenbacher. Quelle: Wissenschaftsbarometer 2025. Fotos: stock.adobe.com, unsplash.com"},{"date":"13.12.2025","title":"Der Gender Gap unter ­Grundschüle­r:in­nen wird kleiner","author":"Elias Batz","link":"https://taz.de/die-gute-nachricht/!6134519&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Mittlerweile besuchen neun von zehn Kindern weltweit die Grundschule. Der Gender Gap, also die Lücke zwischen Jungen und Mädchen unter den Grundschüler:innen, ist dabei mit zwei Prozentpunkten sehr gering. Nach dem Ende des Zweiten Weltkriegs betrug die Lücke noch 15 Prozentpunkte, sie wurde aber im Laufe der Jahre immer kleiner und hat sich seit 1995 noch einmal halbiert. Doch die Pandemie bremste diese positive Entwicklung: Seit 2020 geht die Grundschulquote leicht zurück, auch der Gender Gap klafft wieder leicht auf. Zudem gibt es geografische Unterschiede: So besuchten 2023 im Tschad vier von fünf Jungen, aber nur zwei von drei Mädchen die Grundschule.Zu den wichtigsten Gründen für den globalen Anstieg zählen soziale Bewegungen für Menschenrechte, darunter für das Recht auf Bildung. Die UN-Kinderrechtskonvention von 1989 schreibt zudem fest, dass die Grundschule für alle Kinder kostenlos und obligatorisch sein soll. Die Konvention haben fast alle Staaten ratifiziert. Elias Batz"},{"date":"6.12.2025","title":"Die Menschen in Deutschland gehen mehr zu Fuß","author":"Lino Wimmer","link":"https://taz.de/die-gute-nachricht/!6127298&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Um von A nach B zu kommen, gehen Menschen in Deutschland etwas öfter zu Fuß, steigen aufs Fahrrad oder nehmen die öffentlichen Verkehrsmittel. Das geht aus der Studie „Mobilität in Deutschland“ hervor, der bundesweit größten Erhebung zur Alltagsmobilität, deren Ergebnisse kürzlich veröffentlicht wurden. Ähnlich aussagekräftige Zahlen werden nur im Abstand von mehreren Jahren erhoben. Im Auftrag des Verkehrsministeriums befragte das Sozialforschungsinstitut infas zwischen Mai 2023 und Juni 2024 rund 370.000 Personen. Die Zahl der Fälle, in denen Menschen für einen Weg – zum Beispiel zur Arbeit zum Supermarkt – das Auto benutzen, ging von 58 auf 53 Prozent zurück. Auch wenn man nicht auf die Zahl der Wege, sondern auf die gefahrenen Kilometer schaut, nimmt der Autoanteil etwas ab. Zwar nimmt die Zahl der Pkws in Deutschland immer noch zu, allerdings bleibt im Schnitt fast jedes zweite Auto in der Garage stehen. Die Au­to­r:in­nen der Studie erklären das auch durch den anhaltenden Trend zum Homeoffice. Lino Wimmer"},{"date":"29.11.2025","title":"Mehr Organisationen steigen aus fossilen Geschäften aus","author":"Lino Wimmer","link":"https://taz.de/die-gute-nachricht/!6129915&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Zahl der Einrichtungen, die ihre Gelder aus fossilen Unternehmen abziehen, wächst. Unter den mittlerweile rund 1.700 Institutionen der sogenannten Divestment-Bewegung sind auch 46 kirchliche Organisationen, die sich auf der Weltklimakonferenz in Belém der Initiative angeschlossen haben. Gemeinsam verwalten alle Beteiligten 34 Milliarden Dollar – etwas mehr als den Börsenwert von RWE. 2019 waren es noch 13 Milliarden. Rund ein Drittel der Gelder gehört religiösen Trägern, daneben bekennen sich auch Universitäten, Städte und Pensionsfonds zu grünen Wertanlagen. Die Beteiligten legen jedoch sehr unterschiedlich aus, wann eine Anlage als fossilfrei gelten darf. Für die katholischen In­ves­to­r:in­nen fallen alle Unternehmen darunter, die mehr als 5 Prozent ihres Umsatzes mit fossilen Geschäftsmodellen machen. Bei den evangelischen Institutionen sind wiederum nur Investitionen in die extrem klimaschädlichen Brennstoffe Kohle, Fracking-Gas und Öl aus Teersand ausgeschlossen. Lino Wimmer"},{"date":"22.11.2025","title":"Immer mehr Ukrai­ne­r*in­nen in Deutschland haben einen Job","author":"Frederik Eikmanns","link":"https://taz.de/die-gute-nachricht/!6126549&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Wer nach Deutschland fliehen muss, der schuldet diesem Land nichts. Das Asylrecht wurde ja nicht erfunden, weil es für das Aufnahmeland nützlich sein soll. Trotzdem darf man sich freuen, dass mehr als die Hälfte der ukrainischen Schutzsuchenden zwischen 20 und 50 Jahren in Deutschland drei Jahre nach der Ankunft einen Job hat. Das geht aus einer Studie des Bundesinstituts für Bevölkerungsforschung hervor, das seit 2022 regelmäßige Befragungen dazu durchführt. In einer Gesellschaft wie der unseren hängt viel daran, ob man arbeitet. Ein Job bedeutet Anerkennung, Kontakt, ein Stück Freiheit. Er verleiht Struktur, macht es leichter, Deutsch zu lernen, eine Wohnung und Freun­d*in­nen zu finden. Dass dies bei den Ukrai­ne­r*in­nen so gut gelingt, hat auch damit zu tun, dass sie über die Jobcenter bislang besonders gut betreut wurden. Umso unverständlicher, dass die schwarz-rote Koalition gerade dabei ist, genau das wieder abzuschaffen, indem sie ukrainische Geflüchtete aus dem System des Bürgergelds nimmt. Frederik Eikmanns"},{"date":"15.11.2025","title":"Vegan im Einkaufskorb ist günstiger als die tierischen Alternativen","author":"Chiara Bachels","link":"https://taz.de/die-gute-nachricht/!6123572&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Erstmals kostet ein Einkaufskorb mit ausschließlich pflanzlichen Produkten weniger als einer mit tierischen. 2025 sparen Kon­su­men­t:in­nen im Schnitt fünf Prozent beim Kauf pflanzlicher Alternativen – besonders stark bei pflanzlicher Milch, pflanzlichem Scheibenkäse und Aufschnitt, Veggie-Burgern und -Würstchen. Das geht aus einer Studie der Organisation ProVeg hervor. Sie verglich acht Supermarktketten. Bei Lidl sind die Preisunterschiede am größten, nur bei Netto ist der pflanzliche Einkauf teurer als der tierische. Die Stu­di­en­au­to­r:in­nen führen die Preissenkung darauf zurück, dass Supermärkte die Preise für ihre Eigenmarken auf das Niveau tierischer Produkte bringen möchten.Ein Makel bleibt: Die Preise wurden lediglich bei ähnlichem Packungsgewicht verglichen. Häufig werden tierische Produkte aber in größeren Mengen verkauft, die verhältnismäßig günstiger sind. Ginge es nach der reinen Masse, wäre der pflanzliche Warenkorb im Schnitt immer noch elf Prozent teurer. Chiara Bachels"},{"date":"8.11.2025","title":"Irland führt Grundeinkommen für Künst­le­r*in­nen ein","author":"Katharina Federl","link":"https://taz.de/die-gute-nachricht/!6123416&s=gute%2Bnachricht&SuchRahmen=Print/","category":"economy_work","text":"Wenn sie sich keine Sorgen darum machen müssen, wie sie am Ende des Monats ihre Miete bezahlen sollen, sind Kunstschaffende psychisch stabiler und produktiver. Das zeigt ein 2022 gestartetes Pilotprojekt aus Irland, das 2.000 Kreative aus Bereichen wie Musik, Film, Schauspiel und Literatur für mehr als drei Jahre ein monatliches Einkommen von 1.300 Euro zusichert. Zuletzt verlängerte Kulturminister Patrick O’Donovan das Projekt bis Februar 2026, nun lässt er in einer Pressemitteilung verkünden: Das „Basic Income for the Arts“, also das Grundeinkommen für die Künste, soll es ab September 2026 dauerhaft geben. Eine begleitende Studie liefert nämlich beeindruckend eindeutige Ergebnisse über das Wohlbefinden und die gesteigerte Produktivität der Teilnehmenden. Demnach investieren sie deutlich mehr Zeit in ihre kreative Arbeit, stellen häufiger neue Werke fertig und können mit höherer Wahrscheinlichkeit von ihrer Kunst leben. Davon profitierten nicht nur sie selbst, sagt O’Donovan, sondern auch die Gesellschaft im Ganzen. Katharina Federl"},{"date":"1.11.2025","title":"So viele Schulmahlzeiten wie nie","author":"Raweel Nasir","link":"https://taz.de/die-gute-nachricht/!6121464&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Laut einem neuen Bericht des Welternährungsprogramms der Vereinten Nationen (WFP) ist die Zahl der Kinder, die in der Schule mit Mahlzeiten versorgt werden, um 20 Prozent gestiegen. Konkret sind das 80 Millionen Schü­le­r:in­nen mehr als noch 2021. Und das, obwohl die Geburtenrate und die Einschulungen in diesem Zeitraum global stagnierten oder sogar etwas rückfällig waren. Der Anstieg ist überall dort, wo Unterernährung verstärkt auftritt, besonders hoch. In Nordafrika, im Mittleren Osten und in der Sub-Sahara haben vor allem Länder der Afrikanischen Union ihre Schulernährungsprogramme gestärkt. Laut WFP-Bericht sind diese Programme das größte soziale Sicherheitsnetz der Welt, weil sie Schocks – von Naturkatastrophen über Pandemien bis hin zu Konflikten – abfedern und die verletzlichsten Kinder erreichen. Davon profitieren nicht nur die Schulkinder, sondern auch die lokalen Klein­bäue­r:in­nen und die regionale Wirtschaft. Raweel Nasir"},{"date":"25.10.2025","title":"Immer mehr ältere Menschen sind im Vereinssport aktiv","author":"Clara-Sophia Müller","link":"https://taz.de/die-gute-nachricht/!6119255&s=gute%2Bnachricht&SuchRahmen=Print/","category":"culture_sports","text":"Die Gesellschaft altert – aber sportlich. Denn laut Zahlen des Deutschen Olympischen Sportbunds sind 2024 doppelt so viele über 60-Jährige in einem Sportverein aktiv wie noch im Jahr 2000. Rund 27 Prozent der Männer und 15 Prozent der Frauen über 60 sind demnach Vereinsmitglied. Im Osten treiben weniger Senioren und Seniorinnen Sport im Verein als im Westen, dafür sind es in den neuen Bundesländern fast ebenso viele Frauen wie Männer.´Ein Teil der Zahlen geht auf den demografischen Wandel zurück – es gibt einfach mehr über 60-Jährige als früher. Aber nicht nur die absoluten Zahlen sind gestiegen, sondern auch der prozentuale Anteil der Vereinssportler und -sportlerinnen über 60. Während die Mitgliederzahlen insgesamt stagnieren – bleiben die Älteren dem Vereinssport treu. Sie machen nicht nur Gesundheits- und Rehasport auf Rezept, sondern auch Turnen, Boccia oder Schießsport. Außerdem engagieren sie sich im Vereinsleben und bekleiden Ehrenämter. Auch wegen ihnen bleibt der Sport im Verein erschwinglich. Clara-Sophia Müller"},{"date":"18.10.2025","title":"In Deutschland spenden mehr Menschen ihre Organe","author":"Lino Wimmer","link":"https://taz.de/die-gute-nachricht/!6116924&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Im Jahr 2025 gibt es hierzulande so viele Or­gan­spen­de­r:in­nen wie noch nie seit Beginn der Erfassung im Jahr 2016. Die Deutsche Stiftung Organtransplantation (DSO) zählte bis September 744 Spen­de­r:in­nen – 30 mehr als im gleichen Zeitraum im Vorjahr. Nicht erfasst sind Lebendspenden, etwa von einzelnen Nieren. Dieser langsame Aufwärtstrend ist vor allem der Spendenbereitschaft der über 65-Jährigen zu verdanken. Am höchsten ist die Spendebereitschaft dabei in Hamburg: 2024 lag sie anteilig fünfmal so hoch wie im Schlusslicht der Statistik, Brandenburg.Doch es reicht noch nicht. Laut der Vermittlungsstelle Eurotransplant stehen den rund 2.200 von Verstorbenen gespendeten Organen fast 8.300 wartende Pa­ti­en­t:in­nen gegenüber. Um diese Lücke zu überbrücken, müsste vor allem die Zahl der potenziell Spendebereitwilligen gesteigert werden. Seit September beschäftigt sich der Bundestag mit einem Gesetz, das Abhilfe schaffen könnte: Wer nicht ausdrücklich widerspricht, gilt künftig als Spen­de­r:in. Eine solche Widerspruchlösung gilt in den meisten europäischen Staaten. Lino Wimmer"},{"date":"11.10.2025","title":"Genug Länder machen mit beim Schutz der Hochsee","author":"Lino Wimmer","link":"https://taz.de/die-gute-nachricht/!6116265&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Mehr als 20 Jahre wurde verhandelt, nun werden ab 2026 erstmals international verbindliche Regeln zum Schutz des marinen Lebens auf der hohen See gelten. Denn das Hochseeschutzabkommen der Vereinten Nationen hat seit September das nötige Quorum von 60 ratifizierenden Staaten erreicht. Die hohe See bedeckt fast die Hälfte der Erde. Die UN-Staaten wollen 30 Prozent ihrer Flächen als Schutzgebiete ausweisen, um Überfischung und Verschmutzung einzudämmen, möglichst noch bis 2030. Auch den Plänen Donald Trumps, Kobalt, Nickel und andere Rohstoffe durch industriellen Tiefseebergbau vom Meeresgrund zu holen, könnte das Abkommen einen Riegel vorschieben. Künftig soll nur Erze schürfen, nach Öl bohren und Tiere erforschen, wer erwiesen umweltverträglich vorgeht. Die USA haben, wie auch Deutschland, zwar unterschrieben, aber das Abkommen bisher nicht ratifiziert. Anders als die EU. Nun gilt es, das Abkommen weiter auszugestalten, Institutionen aufzubauen und dafür weitere Kompromisse zu finden. Lino Wimmer"},{"date":"4.10.2025","title":"Mehr Nachwuchs fürs Lehrerzimmer","author":"Birger Stepputtis","link":"https://taz.de/die-gute-nachricht/!6114873&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Die Zahl der Lehr­amts­ab­sol­ven­t*in­nen ist zuletzt wieder angestiegen: Für 2024 verzeichnet das Statistische Bundesamt 20.200 Master- und 10.400 Staatsexamensabschlüsse. Das stimmt hoffnungsvoll, angesichts des Lehrkräftemangels in Deutschland. Verantwortlich für den sind vor allem die geburtenstarken Babyboomer, die jetzt nach und nach in Rente gehen. Wie sehr die Bildungsqualität unter ihrem Abgang leidet, hängt stark von Schulform (Gymnasium und Grundschule: weniger) und Standort (strukturschwache ländliche Regionen: mehr) ab.Es braucht deshalb auf absehbare Zeit Zehntausende Neueinstellungen im Jahr. Auch weil immer mehr Leh­re­r*in­nen vorläufig aus dem Schulbetrieb ausscheiden, wird die gestiegene Zahl der Ab­sol­ven­t*in­nen wohl nicht ausreichen, um den Bedarf zu decken. Ein Grund für die Fluktuation: die hohen Anforderungen in großen und diversen Klassen, wegen des Abbaus von Förderschulen und zunehmender Migration. Eigentlich könnte der Schulalltag dadurch bereichert und Horizonte erweitert werden – dafür bräuchte es jedoch mehr Betreuung. Gebraucht werden also nicht nur mehr Lehrkräfte, sondern auch attraktivere Studienplätze und auch andere Unterrichtsformen: Weniger Frontalunterricht, mehr freies Lernen. Auch die Digitalisierung könnte – klug eingesetzt – eine Chance sein. Birger Stepputtis"},{"date":"27.9.2025","title":"Afrikanische Länder kaufen viel mehr Solaranlagen","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6112551&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"In Afrika gibt es laut einer Analyse des Thinktanks Ember Hinweise auf einen Durchbruch bei der Solarenergie. Der Bericht stützt sich auf Exportdaten für chinesische Solarmodule. Über 90 Prozent aller Module weltweit werden in China hergestellt und das Land veröffentlicht dazu monatliche Statistiken. Deswegen bieten diese Daten laut Ember eine verlässliche Grundlage, um Entwicklungen auf dem afrikanischen Solarmarkt abzubilden. Afrikanische Staaten haben demnach zwischen Juli 2024 und Juni 2025 rund 60 Prozent mehr Module aus China importiert. Seit 2021 haben sich die Importe sogar versechsfacht. Die Entwicklung ist dem Bericht zufolge über den ganzen Kontinent verteilt. 20 Staaten verzeichneten Rekordwerte bei den Importen. In Algerien ist es im Vergleich zum Vorjahr eine Steigerung um das 33‑Fache. Der Solarboom hat das Potenzial, die Stromversorgung in mehreren Ländern substanziell zu verbessern und erhebliche Mengen an Brennstoffen wie Diesel einzusparen. Lalon Sander"},{"date":"20.9.2025","title":"Weltweit sterben immer weniger Tiere für Pelze","author":"Jannes Holtherm","link":"https://taz.de/die-gute-nachricht/!6111265&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Die Anzahl der in Pelzfarmen gehaltenen Tiere ist in den vergangenen elf Jahren weltweit deutlich zurückgegangen. Immer weniger Nerze, Füchse, Marderhunde und Chinchillas werden für Mäntel und Jacken gezüchtet und erlegt. 2014 wurden in Pelzfarmen noch 139,5 Millionen Tiere für ihr Fell gefangen gehalten, 2024 waren es nur noch 20,5 Millionen Tiere. 22 europäische Länder haben Pelztierzucht explizit verboten. Deutschland gehört zu den Ländern, in denen die Zucht zwar nicht verboten, wegen hoher Tierschutzauflagen aber schlicht nicht mehr wirtschaftlich ist. 2019 schloss die letzte deutsche Nerzfarm ihre Pforten, nachdem der Betreiber die Tiere verkauft hatte. Laut einem Gutachten der Europäischen Behörde für Lebensmittelsicherheit leiden die Pelztiere in den Farmen systemisch unter den dort üblichen Haltungsformen, was sich bei dieser Art der Massentierhaltung nicht verhindern ließe. Bis 2026 will die EU-Kommission einen Gesetzesvorschlag zum Verbot von Pelzzucht vorlegen. Jannes Holtherm"},{"date":"13.9.2025","title":"Mehr Menschen mit Lipödem erhalten Zugang zu Therapie","author":"Katharina Federl","link":"https://taz.de/die-gute-nachricht/!6110039&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Sammelt sich Fett trotz gesunder Ernährung und viel Sport überproportional am Körper an, hat das oft genetische und hormonelle Ursachen. So auch bei der chronischen Fettver­teilungsstörung Lipödem. Allein in Deutschland sind nach Schätzungen rund 3,8 Millionen Menschen und nahezu nur Frauen betroffen. Beim Lipödem sammelt sich das Fett an Armen und Beinen symmetrisch an und kann starke Schmerzen verursachen. Linderung kann eine Liposuktion schaffen, bei der das krankhafte Fettgewebe operativ entfernt wird. Bislang wurden die Kosten nur im schwersten Stadium III übernommen, dann, wenn viele Betroffene bereits mit Gelenkproblemen und psychischen Begleiterkrankungen zu kämpfen haben. In Deutschland betrifft das 29 Prozent aller Erkrankten. Der Gemeinsame Bundesausschuss hat im Juli entschieden, die Kosten ab 2026 auch in den Stadien I und II zu erstatten, wenn konservative Therapien zuvor nicht geholfen haben. Damit haben nun mehr als dreimal so viel Betroffene Anspruch auf die Operation. Katharina Federl"},{"date":"6.9.2025","title":"E-Bikes sind oft ein Ersatz fürs Auto","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!6108911&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"E-Bikes sind nicht nur schnellere Fahrräder, sondern ersetzen oft Autofahrten, zeigt eine neue Studie. Wie Forschende im „International Journal of Sustainable Transportation“ berichten, wären fast jede zweite ­E-Bike-Fahrt und sogar 63 Prozent der Kilometer sonst mit dem Auto zurückgelegt worden. Auf weniger als 20 Prozent der Strecken ersetzten E-Bikes dagegen eine Fahrt mit dem Fahrrad. E-Bike-Fahrer*innen verhalten sich oft anders als Menschen auf konventionellen Fahrrädern: Sie fahren meist längere Strecken und lassen sich von fehlenden oder schlechten Radwegen weniger abschrecken.Für die Untersuchung nutzten die Forschenden Daten aus der bundesweiten Erhebung „Mobilität in Deutsch­land 2017“ und ergänzten diese mit Informationen zu Geländeprofil, Rad­ver­kehrs­infrastruktur und Nahverkehr. Anschließend simulierten sie, welche Verkehrsmittel Menschen auswählen würden – mit und ohne E-Bike als Option. Als die Daten erhoben wurden, lag der Anteil des E-Bikes in Deutschland an allen Fahrten noch unter einem Prozent. Die nächste große Mobilitätsstudie fand 2023 statt. Zwar liegen erste Ergebnisse bereits vor, doch für eine ähnliche Analyse fehlen bislang die vollständigen Wegedaten. Lalon Sander"},{"date":"30.8.2025","title":"Weltweit sterben immer weniger Menschen durch Suizid","author":"Jannes Holtherm","link":"https://taz.de/die-gute-nachricht/!6107562&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Die weltweite Suizidsterblichkeitsrate ist von 1990 bis 2021 um 29,9 Prozent gesunken. Zu diesem Ergebnis kommt eine Analyse von Daten der Weltgesundheitsorganisation (WHO), die im Fachmagazin Nature Mental Health veröffentlicht wurde. Grundlage der Auswertung waren die Suizidsterblichkeitsraten aus 102 Ländern auf allen Kontinenten. Dabei ist die Suizidsterblichkeitsrate bei Männern 3,57-mal so hoch wie bei Frauen – die Grafik zeigt daher die Raten aller Männer innerhalb einer Population von 100.000 Menschen jedes Geschlechts. „Suizidprävention muss demografische Risiken gezielt adressieren: Die besonders hohe Suizidsterblichkeit bei Männern und älteren Menschen erfordert spezifische Maßnahmen, etwa niedrigschwellige Programme für Männergesundheit, Maßnahmen gegen Altersarmut sowie gezielte Unterstützungsangebote für Hochaltrige“, sagte Ute Lewitzka, Professorin für Suizidologie und Suizidprävention, dem deutschen Science Media Center.Jannes Holtherm"},{"date":"23.8.2025","title":"Veganes Angebot in Deutschlands Fußballstadien nimmt zu","author":"Jannes Holtherm","link":"https://taz.de/die-gute-nachricht/!6106030&s=gute%2Bnachricht&SuchRahmen=Print/","category":"culture_sports","text":"Obwohl sportliche Erfolge in Gelsenkirchen in den letzten Jahren selten gefeiert werden, führt der FC Schalke 04 eine Tabelle an: In der diesjährigen Auswertung der vegan-freundlichsten Spielstätten, durchgeführt von der Tierschutzorganisation Peta, belegt die Veltins-Arena mit einem neuen Rekord von 62 Punkten den ersten Platz für die Saison 2025/26. Die direkten Verfolger kommen aus Sachsen. Die Red Bull Arena, Heimat von RB Leipzig, kommt in der Wertung auf 57 Punkte. Für Snacks wie Pommes oder Brezeln vergibt Peta in der Wertung einen Punkt, vollwertige Gerichte wie Falafel-Wraps oder Nudeln sind mit drei Punkten dotiert. In den vergangenen Jahren sind die ersten beiden deutschen Fußballligen immer veganer geworden. Vegane Speisen sind in den Stadien gefragter, die Caterer reagieren mit stetig wachsendem Sortiment. Insgesamt 29 Vereine sind Teil des Rankings, grafisch dargestellt sind hier in Anlehnung an die Bundesligatabelle die ersten 18 Plätze. Das Schlusslicht bildet das Holstein-Stadion. Dort trägt Holstein Kiel seine Heimspiele aus und errang nur einen einzigen Punkt – für vegane Pommes. Jannes Holtherm"},{"date":"16.8.2025","title":"In Helsinki gibt es seit einem Jahr keine Verkehrstoten","author":"","link":"https://taz.de/die-gute-nachricht/!6103370&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"In den vergangenen zwölf Monaten ist in Helsinki niemand im Straßenverkehr gestorben. Das haben Verwaltung und Polizei der finnischen Hauptstadt mitgeteilt. Besonders deutlich zeigt sich der Rückgang im Vergleich zu den Vorjahren: Im ersten Halbjahr 2023 gab es noch vier Verkehrstote, im zweiten Halbjahr zwei und im ersten Halbjahr 2024 drei Verkehrstote. Zuletzt kam im Juli 2024 eine Person ums Leben. In den zehn Jahren zuvor, von 2015 bis 2024, starben im Durchschnitt sechs Personen jährlich im Straßenverkehr von Helsinki.Weniger erfreulich sieht es in Deutschland aus. In Frankfurt am Main, das eine ähnliche ­­Ein­woh­ne­r:in­nen­zahl­ und -dichte hat wie Helsinki, gab es 2023 neun Verkehrstote im Stadtgebiet, 2024 sogar 14. Um die Sicherheit im Straßen­verkehr zu erhöhen, baut Helsinki seit Jahren Tempo-30-Zonen, Zebrastreifen und Radwege aus.Auch die Zahl der Verletzten ging dadurch zurück. Gab es in den vier vorherigen Halbjahren durchschnittlich 170 Verletzte im Straßenverkehr, waren es im ersten Halbjahr 2025 etwa ein Viertel weniger.Amelie Sittenauer"},{"date":"9.8.2025","title":"Betriebe übernehmen immer öfter ihre Azubis","author":"Amelie Sittenauer","link":"https://taz.de/die-gute-nachricht/!6102580&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Wer heute eine Ausbildung erfolgreich absolviert, hat gute Chancen, weiter im selben Betrieb zu arbeiten. Das geht aus einem Bericht des Instituts für Arbeitsmarkt- und Berufsforschung hervor. Demnach ist die Zahl derjenigen, die nach einer erfolgreichen Ausbildung übernommen wurden, im Jahr 2024 auf ein Rekordhoch von 79 Prozent gestiegen. Das sind 3 Prozentpunkte mehr als im Vorjahr und ganze 18 mehr als im Jahr 2010. Besonders gut sieht es in den Sektoren Finanz- und Versicherungswesen, Bergbau, Energie- und Wasserversorgung, Lagerlogistik, Verkehr sowie in der öffentlichen Verwaltung aus. Fast neun von zehn Azubis erhielten dort einen Anschlussvertrag.Die hohe Übernahmequote geht allerdings mit einer sinkenden Zahl abgeschlossener Ausbildungen einher. Zwischen den Jahren 2010 und 2024 gingen diese um 14 Prozent zurück. Das liegt an kleineren Jahrgängen und an einer gestiegenen Anzahl frühzeitig aufgelöster Ausbildungsverhältnisse. Amelie Sittenauer"},{"date":"2.8.2025","title":"In Hamburg wächst die Zahl der Stadtbäume","author":"Mitsuo Iwamoto","link":"https://taz.de/die-gute-nachricht/!6101656&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Zum zweiten Jahr in Folge wurden in Hamburg mehr Stadtbäume gepflanzt als gefällt. Im Jahr 2024 mussten 1.565 Bäume aufgrund von Alter, Krankheiten, Sturmschäden oder Baumaßnahmen gefällt werden. 1.850 wurden neu gepflanzt. Also standen knapp 300 Bäume mehr an Hamburgs Straßen, insgesamt sind es rund 230.000.In den nächsten Jahren will die Stadt noch mehr Bäume pflanzen und so die mit Baumkronen bedeckte Fläche von derzeit 25 auf 30 Prozent erhöhen. Neu gepflanzte Bäume brauchen allerdings Zeit, bis sie die Wirkung ihrer alten Artgenossen entfalten können. Deren große Kronen spenden mehr Schatten und kühlen die Umgebung stärker. Eine Studie der TU Dresden ergab, dass es etwa 400 Jungbäume braucht, um die Umweltleistungen eines Altbaums mit einem Kronendurchmesser von 20 Metern zu erbringen. Bei Dürre profitieren alte Bäume zudem von ihren weit verzweigten Wurzeln, die tiefer reichen und ihnen helfen, selbst in trockenen Phasen noch Wasser zu finden. Mitsuo Iwamoto"},{"date":"26.7.2025","title":"Im DFB kicken wieder mehr Mädchenteams","author":"Marie Gogoll","link":"https://taz.de/die-gute-nachricht/!6100503&s=gute%2Bnachricht&SuchRahmen=Print/","category":"culture_sports","text":"Nachdem es im Mädchenfußball zu Beginn der 2000er noch einen sehr starken Zuwachs an Teams gegeben hatte, nahm deren Anzahl nach einem Peak im Jahr 2010 bis in die Coronazeit hinein ab. Doch mittlerweile zählt der DFB wieder wesentlich mehr Teams mit ausschließlich weiblichen Spielerinnen unter 16 Jahren. Ein Anstieg von 50 Prozent in den vergangenen drei Jahren.Wie es allgemein um die Zukunft des Mädchenfußballs steht, lässt sich daraus nur bedingt ablesen, schließlich spielen Kinder oft in gemischtgeschlechtlichen Teams und werden erst in der Jugend getrennt. Seit etwa zehn Jahren investieren immer mehr Fußballvereine, die im Männerbereich erfolgreich sind, zunehmend in ihre Frauenabteilungen. Doch während Top-Spielerinnen inzwischen für Millionensummen die Vereine wechseln, fehlt es in den unteren Ligen und Jugendteams oft noch immer an Ausstattung, qualifiziertem Personal und Trainingsplätzen.Denn nachhaltig ist der Aufschwung an der Spitze nur, wenn er sich auch in die Breite überträgt.Marie Gogoll"},{"date":"19.7.2025","title":"Im Wattenmeer leben wieder mehr Kegelrobben","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6099832&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Bis zu 300 Kilogramm schwer, bis zu 2,5 Meter groß, knuffig spitzer Kopf – und lange Zeit stark bedroht: Die Kegelrobbe kann sich langsam wieder im Wattenmeer und rund um Helgoland etablieren. Seit 2008 zählen die Niederlande, Dänemark und Deutschland die Bestände gemeinsam. Für den Zeitraum 2024/25 verzeichneten sie einen neuen Höchststand von 12.064 ausgewachsenen Kegelrobben.Dabei gibt es regionale Unterschiede. In den Niederlanden sowie in Niedersachsen und Schleswig-Holstein steigen die Zahlen deutlich, während sie in Dänemark und vor Helgoland in den letzten Jahren leicht zurückgegangen sind. Allerdings wurden in Dänemark bis inklusive 2014 überhaupt keine Kegelrobben gezählt. Auch auf Helgoland hat sich die Population seit 2014 nahezu verdoppelt.Ex­per­t:in­nen nennen als Grund für die Rückkehr vor allem die Wirkung von Schutzmaßnahmen. So werden etwa im Nationalpark Wattenmeer die Bereiche abgesperrt, in denen Jungtiere gesichtet wurden. Yannik Achternbosch"},{"date":"12.7.2025","title":"Mehr junge Menschen werden Schornsteinfeger*innen","author":"Clarissa Hofmann","link":"https://taz.de/die-gute-nachricht/!6097165&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Schorn­stein­fe­ge­r*in werden: das wollen so viele junge Menschen wie lange nicht mehr. 796 Ausbildungsverträge wurden in dem Gewerbe in 2024 bundesweit abgeschlossen. Das entspricht einem Anstieg um 29 Prozent im Vergleich zu 2023. Der Bundesverband des Schornsteinfegerhandwerks verzeichnet damit einen Höchststand innerhalb der letzten zehn Jahre. Der Job trendet aber nicht etwa wegen der nach Vintage schreienden Arbeitskleidung oder dem guten Ruf, anderen Glück zu bringen. „Das Schornsteinfegerhandwerk wandelt sich zum Zukunftsberuf“, sagt Udo Voigt aus dem Vorstand des Verbandes. Mit bis zu 200.000 Kundenkontakten täglich sei die Branche zentral für die Wärmewende. Immer mehr Schorn­stein­fe­ge­r*in­nen beraten heute zu klimafreundlichen Heizsystemen. Diese Neuausrichtung schafft Perspektiven für junge Menschen. Und lässt das Gewerbe überleben. Laut Voigt braucht es 800 Azubis pro Jahr, um den neuen Aufgaben gerecht zu werden und gegen den demografischen Wandel anzukommen. Na dann, mit Gunst! Clarissa Hofmann"},{"date":"5.7.2025","title":"Mehr Länder beschränken den Verkauf von E-Zigaretten und Vapes","author":"Charlina Strelow","link":"https://taz.de/die-gute-nachricht/!6095450&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"E-Zigaretten und Vapes schaden durch ihren Tabakgehalt oft nicht nur ihren Konsument:innen, sondern durch ihre geringe Haltbarkeit auch der Umwelt. Mehr als zwei Drittel aller Länder handeln und limitieren die nikotinhaltigen Geräte oder verbieten den Verkauf komplett. Das geht aus einer Studie der Weltgesundheitsorganisation (WHO) mit Daten aus 2024 hervor. Zwei Jahre zuvor waren es noch 12 Länder weniger. 91 Länder, darunter auch Deutschland, limitieren 2024 E-Zigaretten und Vapes. 41 Länder verbieten den Verkauf vollständig – die Hälfte davon in Asien. In Europa gab es im vergangenen Jahr lediglich in Norwegen ein Verkaufsverbot.Noch nicht im WHO-Bericht vermerkt: Belgien verbietet seit Januar 2025 als erstes Land in der EU den Verkauf von E-Zigaretten und Vapes.Die restlichen EU-Länder werden bedingt spätestens 2027 folgen müssen. Eine Verordnung verbietet dann Geräte mit nichtaustauschbaren Batterien. Charlina Strelow"},{"date":"28.6.2025","title":"Diabetes-Typ-2-Fälle bei Kindern gehen wieder zurück","author":"Charlina Strelow","link":"https://taz.de/die-gute-nachricht/!6094268&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Während der Coronapandemie fehlte es Kindern und Jugendlichen oft an den zwei Dingen, die zur Vorbeugung von Diabetes-Typ-2-Erkrankungen besonders wichtig sind: viel Bewegung und einer ausgewogenen Ernährung.Das wiederum hatte einen Anstieg der Krankheit zur Folge, wie eine Auswertung der Diabetes-Patienten-Verlaufs­dokumentation (DPV) ergab. Untersucht wurden etwa 400 Behandlungszentren in Deutschland, Österreich und der Schweiz. Im Jahr 2019 waren es noch 114 neu erkrankte Kinder und Jugendliche in den Einrichtungen der DACH-Region.Im Jahr 2021 wurden hingegen 190 neue Diabetes-Typ-2-Erkrankungen festgestellt. Seitdem sind die Zahlen wieder rückläufig: 2022 waren es nur noch 145 neue Fälle, 2023 gab es 136 Neuerkrankungen. Damit sind aber noch immer mehr Kinder und Jugendliche betroffen als vor der Pandemie. Anders als bei Diabetes-Typ-1 kann ein gesunder Lebensstil die Erkrankung verhindern.Charlina Strelow"},{"date":"21.6.2025","title":"Beim Kinderwunsch werden Mädchen weniger benachteiligt","author":"Charlina Strelow","link":"https://taz.de/die-gute-nachricht/!6092732&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"„Na, wird es ein Mädchen oder ein Junge?“ Lange Zeit lag die Präferenz weltweit so eindeutig beim Jungen, dass viele Menschen sogar abtrieben, weil sie ein Mädchen erwarteten. Diese Diskrepanz nimmt mittlerweile ab.50 Millionen Mädchen, die nach dem evolutionär bedingten Ge­bur­ten­ver­hält­nis von 105 Jungen pro 100 Mädchen hätten geboren werden sollen, fehlen seit den 1980ern, berechnete The Economist.Grund für den Wunsch nach Jungen sind patriarchale Strukturen. Einen Sohn zu haben brachte einer Familie mehr Vorteile. In China kam es zu einem besonders starken Anstieg von Jungs-Geburten, nachdem Ultraschall in den 1980er Jahren zugänglicher wurde und zeitgleich die Ein-Kind-Politik beschlossen wurde. 2003 wurden 117 Jungen pro 100 Mädchen geboren. Auch in Indien und Südkorea wurden weitaus mehr Jungen geboren.Inzwischen gibt es sogar einen Gegentrend, gerade in wohlhabenden Ländern. So­zio­lo­g:in­nen vermuten jedoch, dass der explizite Wunsch nach Mädchen ebenfalls Rollenbilder reproduziert: Töchter werden als leichter erziehbar und fürsorglicher eingeschätzt. Charlina Strelow"},{"date":"14.6.2025","title":"Immer mehr Frauen stehen an der Spitze deutscher Hochschulen","author":"Lea Fiehler","link":"https://taz.de/die-gute-nachricht/!6091883&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Zwischen 2021 und 2024 ist der Frauenanteil in den Führungspostionen deutscher staatlicher Hochschulen von 25 auf 35 Prozent gestiegen. Ein Rekordhoch! Das zeigt eine aktuelle Auswertung des Centrums für Hochschulentwicklung (CHE). Studienleiterin Isabel Roessler sagt der taz: „Wir sehen einen Anstieg auf verschiedenen Ebenen: mehr Frauen studieren, mehr Frauen schlagen eine wissenschaftliche Karriere ein. Das ist eine neue Generation Frauen, die sich mehr in die führenden Positionen wagt und offene Stellen häufiger besetzt.“ An den Universitäten sind inzwischen 41 Prozent der Leitungskräfte Frauen. An den Hochschulen für angewandte Wissenschaften liegt der Anteil mit 30 Prozent noch deutlich darunter, ein kontinuierlicher Anstieg der Quote zeichnet sich aber auch hier ab. Und trotzdem: ein Drittel Frauen, das bedeutet auch zwei Drittel Männer. Zu wirklich diversen Führungsriegen an den Hochschulen fehlt zudem noch mehr: Nur 9 der 174 Leitungskräfte wurden im Ausland geboren, 12 kommen aus Ostdeutschland. Lea Fiehler"},{"date":"7.6.2025","title":"Millionen Menschen leben dank Masernimpfung","author":"Josefine Rein","link":"https://taz.de/die-gute-nachricht/!6089901&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Man muss sich das mal klarmachen: Noch in den 1960er-Jahren wurden 9 von 10 Kindern mit Masern infiziert. Rund zwei Millionen Menschen starben jährlich an der Krankheit. Das Virus zählte zu den ansteckendsten Erregern überhaupt. Bis im Jahr 1963 ein Masernimpfstoff weltweit eingeführt wurde – und einer der größten Erfolgsgeschichten der öffentlichen Gesundheitsvorsorge begann. Der hochwirksame Impfstoff reduzierte das Risiko, an Masern zu erkranken, um das 20-fache. So hat die Masernimpfung bis heute fast 94 Millionen Menschen das Leben gerettet, wie eine neue Metaanalyse von Our World in Data, basierend auf einer WHO-finanzierten Studie, zeigt. Keine andere Impfung hat bislang mehr frühzeitige Tode verhindert.Um Masern endgültig auszurotten, bräuchte es eine Impfquote von 95 Prozent weltweit. Zuletzt sank jedoch der Anteil der Geimpften von 86 auf 83 Prozent. Ursachen dafür sind neben der zunehmenden Impfskepsis auch die wachsende Zahl gewaltsamer Konflikte. Josefine Rein"},{"date":"31.5.2025","title":"Weniger Gebäude werden abgerissen","author":"Tobias Wuertz","link":"https://taz.de/die-gute-nachricht/!6088996&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Immer seltener kommt die Abrissbirne. In Deutschland ist die Zahl der Gebäudeabrisse in den vergangenen Jahren in Deutschland deutlich zurückgegangen – um ganze 38 Prozent. Während 2007 noch etwa 7.600 Wohnhäuser abgerissen wurden, waren es im Jahr 2021 nur noch ungefähr 4.700. Bei anderen Gebäudearten wie Schulen, Verwaltungs- oder Firmengebäuden ist sogar ein Rückgang von fast 40 Prozent zu verzeichnen. Das hat eine Studie der TU Dresden von April 2025 herausgefunden. Für Klimaschutz und Ressourcenschonung sind das sehr gute Neuigkeiten. Denn beim Abriss alter Bausubstanz geht graue Energie verloren, also jene Energie, die für Produktions- und Bauprozesse der Gebäude aufgewendet wurde. Außerdem ist der Bauschutt auch eine riesige Abfallquelle.Wie aus der Studie hervorgeht, sind meistens baurechtliche und wirtschaftliche Gründe für Abrisse verantwortlich. Oft sollen dann an gleicher Stelle neue Wohngebäude entstehen oder die Flächen in Freiraum umgewandelt werden. Durch eine bessere Planung und flexible Nutzungsmöglichkeiten lassen sich Abrisse verhindern. Faktoren wie Denkmal- oder Bestandsschutz können den Erhalt von Gebäuden wiederum begünstigen. Tobias Würtz"},{"date":"24.5.2025","title":"Immer mehr Eltern erziehen ohne körperliche Gewalt","author":"Valerie Braungardt","link":"https://taz.de/die-gute-nachricht/!6087647&s=gute%2Bnachricht&SuchRahmen=Print/","category":"society_rights","text":"Es ist noch nicht lange her, da galt ein Klaps auf den Po als probates Mittel, um Kinder in ihre Schranken zu weisen. Leh­re­r:in­nen griffen vor wenigen Jahrzehnten gar noch zum Rohrstock, wenn jemand aus der Reihe tanzte. Glücklicherweise verstehen heute viele, dass sie Kindern damit schaden. Eine Befragung von Unicef zeigt, dass die Akzeptanz von Gewalt in der Erziehung in Deutschland so niedrig ist wie noch nie: In 2024/2025 hielten knapp 31 Prozent der Befragten, also etwa je­de:r Dritte, einen Klaps auf den Po für angemessen. Zum Vergleich: 2016 fanden das noch 44,7 Prozent gerechtfertigt, 2001 sogar 76,4 Prozent. Die Akzeptanz von erzieherischer Gewalt hing dabei auch mit dem Alter und Geschlecht der Befragten zusammen. Frauen und jüngere Menschen lehnen physische Strafen häufiger ab als Männer und Alte. Trotz der generell stei­genden Ablehnung von körperlicher Gewalt gegen Kinder halten auch heute noch Menschen Ohrfeigen und Prügel für legitime erzieherische Mittel. Es bleibt also noch einiges zu tun. Valérie Braungardt"},{"date":"17.5.2025","title":"Immer mehr Kinder erleben ihren fünften Geburtstag","author":"Tobias Bachmann","link":"https://taz.de/die-gute-nachricht/!6086359&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Das Schicksal, nur bis zum fünften Lebensjahr herumtollen und die Wunder eines lebendigen Planeten erkunden zu können, erleiden weltweit immer weniger Kleinkinder. In Äthiopien beispielsweise starb im Jahr 1991 noch jedes fünfte Kleinkind, in Afghanistan etwa jedes sechste. Bis zum Jahr 2023 war in beiden Ländern nur noch jedes zwanzigste Kind von einem verfrühten Tod bedroht. Das zeigt eine Analyse von Our World in Data, basierend auf Daten von Unicef und der NGO Gapminder. Besonders stark nahm die Kinder­sterblichkeit demnach in armen Ländern ab. Doch auch in reichen Staaten, unter anderem denen der EU, müssen Eltern immer weniger befürchten, dass ihr Kind das Alter von fünf Jahren nicht erreicht. Die Sterblichkeitsrate sank von 1,1 im Jahr 1991 auf 0,37 Prozent. Ein zentraler Aspekt für den positiven Trend ist der bessere Zugang zu Ärzt*innen, Pfle­ger*in­nen und Hebammen. Tobias Bachmann"},{"date":"10.5.2025","title":"Immer mehr Menschen lernen schwimmen","author":"Yannik Achternbosch","link":"https://taz.de/die-gute-nachricht/!6084153&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Es ist Freibadsaison! Wer in den kommenden Monaten nicht nur Pommes essend im Gras liegen, sondern auch mal ins Becken springen möchte, hat im besten Fall mindestens das sogenannte Seepferdchen. Das Abzeichen bescheinigt die Fähigkeit, schwimmen zu können. Nach dem coronabedingten Einbruch 2020 und 2021 haben es in Deutschland wieder deutlich mehr Menschen erworben. 2024 stellte die Deutsche Lebens-Rettungs-Gesellschaft (DLRG) 57.601 Seepferdchen aus. Seit 2013 absolvierten nur im Jahr 2015 mehr Menschen (60.747) die Prüfung. Dass die Anzahl der Abzeichen steigt, liegt laut DLRG daran, dass es in den vergangenen Jahren mehr Kurse gab. Genug sind es allerdings immer noch nicht, der DLRG zufolge sind die Wartelisten vielerorts lang. Den positiven Trend beim Schwimmenlernen gefährdet in Deutschland außerdem ein weiteres Problem: Aufgrund klammer Gemeindekassen schließen gerade in kleinen Orten viele Schwimmbäder, andernorts steigen Eintrittspreise und Kursgebühren."},{"date":"3.5.2025","title":"39 Prozent weniger Müll an Australiens Küsten","author":"Tobias Wuertz","link":"https://taz.de/die-gute-nachricht/!6081485&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Wenn Abfälle im Meer landen, ist das ein Problem für Menschen und das gesamte Ökosystem. Umso positiver ist es, dass die Mülldichte in der Nähe australischer Küstenmetropolen von 2013 bis 2023 um 39 Prozent gesunken ist. Statt 0,23 Müllteilen im Schnitt pro Quadratmeter haben die Forschenden nur noch 0,15 gefunden, und nicht nur das:Im gleichen Zeitraum ist die Zahl der Orte ganz ohne Müll um 16 Prozent gestiegen. Dies geht aus einer im April erschienenen Studie der staatlichen Behörde für wissenschaftliche und industrielle Forschung in Australien hervor. Als mögliche Ursachen für diesen Erfolg benennt das Forschungsteam öffentliche Aufklärungskampagnen und kollektive Aufräumaktionen. Aber auch Verbote, etwa das von Plastiktüten, und Anreize, wie das in einigen Regionen eingeführte Pfandsystem, hätten geholfen. Essensverpackungen,alte Zigarettenstummel und Flaschendeckel machenden Hauptteil des Mülls an australischen Stränden aus.Tobias Würtz"},{"date":"26.4.2025","title":"Weniger Leute sterben beim Marathon an Herzstillstand","author":"Adefunmi Olanigan","link":"https://taz.de/die-gute-nachricht/!6081813&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Mit dem Frühling startet die Marathonsaison. Obwohl Laufen eigentlich Herz und Lungen trainiert, kommt es – zum Glück sehr selten – vor, dass Läu­fe­r*in­nen eines Halbmarathons oder Marathons das Herz stehen bleibt. Das Risiko, daran zu sterben, hat sich jedoch im Zeitraum zwischen 2010 und 2023 im Vergleich zu 2000 bis 2009 mehr als halbiert. Zu diesem Ergebnis kommt eine neue Studie, die Daten von 29 Millionen Läu­fe­r*in­nen in den USA untersuchte. Der Rückgang lässt sich den Autoren zufolge damit erklären, dass effektivere Notfallpläne etabliert wurden und Defibrillatoren an der Strecke schneller zugänglich waren. Wenn es trotz vorangegangenen Trainings zu einem Herzstillstand kommt, liegt das meist an einer Verengung der Herzkranzgefäße oder an Herzrhythmusstörungen. Das Risiko ist gering (1:167.000), wer dennoch auf Nummer sicher gehen möchte, sollte sich vor dem Lauf beim Arzt durchchecken lassen. Dann stehen dem Marathon nur noch jede Menge Training und der innere Schweinehund im Weg. Adefunmi Olanigan"},{"date":"19.4.2025","title":"Das Deutschlandticket holt Menschen aus den Autos in den Nahverkehr","author":"Tobias Wuertz","link":"https://taz.de/die-gute-nachricht/!6079343&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Auch die Preiserhöhung auf 58 Euro konnte das Deutschlandticket nicht unattraktiv machen. Mehr als 13 Millionen Menschen nutzen es – und treiben so, wie erhofft, die Verkehrswende voran. Dies zeigt eine Untersuchung des Potsdam-Instituts für Klima­folgen­forschung aus dem April 2025, das dafür mehrere bestehende Studien zur Wirkung des Tickets miteinander verglichen hat. Dabei können die Forschenden zeigen, dass durch das Deutschlandticket nicht einfach die vorhandenen ÖPNV-Nutzer:innen mehr Fahrten unternehmen. Viele Menschen nutzen es auch anstelle ihres Autos. So ergaben Befragungsstudien, dass dies für etwa 12 Prozent der Fahrten mit dem Deutschlandticket gelte. Eine neuere Untersuchung, die auf Verkehrsbeobachtung und App-Tracking-Daten beruht, geht sogar von 16 Prozent aus, bei einer durchschnittlichen Entfernung von 30 Kilometern. Das hilft auch dem Klima, denn durch die Verlagerung vom Auto auf öffentliche Verkehrsmittel konnten 4,2 bis 6,5 Mio. Tonnen CO2pro Jahr eingespart werden. Tobias Wuertz"},{"date":"12.4.2025","title":"In Deutschland sterben immer weniger Frauen an Darmkrebs","author":"Tobias Wuertz","link":"https://taz.de/die-gute-nachricht/!6078346&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Entgegen dem globalen Trend ist nach Angaben des Statistischen Bundesamtes vom März 2025 die Zahl der Frauen, die in Deutschland jährlich an Darmkrebs sterben, in den letzten 20 Jahren um 25 Prozent zurückgegangen. Auch bei den Männern ist die Zahl der Darmkrebstoten gesunken, allerdings nur um 8 Prozent. Insgesamt sterben in Deutschland 17 Prozent weniger Menschen an Darmkrebs als noch im Jahr 2003. Mögliche Ursachen für den Rückgang sehen die Sta­tis­ti­ke­r*in­nen neben einer verbesserten Therapie auch im sukzessiven Ausbau von Früherkennungsprogrammen. Unklar ist, welche Rolle Bevölkerungswachstum oder der demografische Wandel spielen. Die positive Entwicklung bei Darmkrebs steht beiden Krebserkrankungen relativ allein da. Leider starben in den letzten 20 Jahren insgesamt 10 Prozent mehr Menschen an Krebs. Trotz des Rückgangs ist Darmkrebs nach Lungen- und Bronchialkrebs immer noch die zweithäufigste krebsbedingte Todesursache in Deutschland. Tobias Würtz"},{"date":"5.4.2025","title":"Kinderzähne sind seltener von Karies befallen","author":"Lena Schega","link":"https://taz.de/die-gute-nachricht/!6077302&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"30 Jahre ist es her, da war Karies noch wortwörtlich in aller Munde. Doch besonders bei Kindern und Jugendlichen hat sich die Lage seitdem deutlich verbessert. Das zeigen die Ergebnisse der Deutschen Mundgesundheitsstudie, die zum sechsten Mal die Karieslast und Zahnerkrankungen in der Bevölkerung untersucht hat. Während um 1990 durchschnittlich 4,9 Zähne bei einem älteren Kind Karieserfahrung hatten, sind es heute nur noch 0,5 Zähne pro Kind, die akut von Karies befallen, ausgefallen oder restauriert sind. Ein Grund für diesen Erfolg sind Vorsorgeangebote in Schulen und Kindergärten. Seit 1
