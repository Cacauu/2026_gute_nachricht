s Gebiets durch Wildernde vorzubeugen, wird es seit 2017 bewacht. Und das wirkt: Der Bestand der Art hat sich seither fast wieder verdoppelt, auf 18.000 Exemplare. Die lokale Bevölkerung kämpft nun wegen der großen Artenvielfalt vor Ort darum, das gesamte Waldgebiet unter Schutz zu stellen. Alexandra Hilpert"},{"date":"14.1.2023","title":"Der Anteil weiblich besetzter Professuren ist gestiegen","author":"Pia Pentzlin","link":"https://taz.de/die-gute-nachricht/!5905314&s=gute%2Bnachricht&SuchRahmen=Print/","category":"education","text":"Vom Studienbeginn bis hin zur Professur: Die akademische Laufbahn hat ganz verschiedene Etappen. Für die einen hört sie nach dem abgeschlossenen Erststudium auf, für die anderen geht es dann erst richtig los. Doch je weiter fortgeschritten die akademische Reise, desto ungleicher die Geschlechterverteilung, denn der weibliche Anteil wird immer kleiner.Bei den Stu­di­en­an­fän­ge­r*in­nen sind Frauen noch in der Mehrheit – 52 Prozent stellten sie im Wintersemester 2021/2022. Aber Frauen in der hauptberuflichen Professorenschaft in Deutschland? Da sieht es mau aus. Im Jahr 1997 lag der Anteil bei knapp 10 Prozent. 2010 waren es dann 19 Prozent, nicht einmal jede fünfte Professur war von einer Frau besetzt. Immerhin: In den vergangenen Jahrzehnten ist der Anteil kontinuierlich gestiegen. 2021 waren 27 Prozent der Stellen von Frauen besetzt. In der deutschen Professorenschaft ist also jede vierte Person weiblich. Bis zur Geschlechterverteilung der Erstsemester ist es also noch ein weiter Weg, aber zumindest tut sich etwas. Pia Pentzlin"},{"date":"7.1.2023","title":"Immer mehr Menschen haben Zugang zu Strom","author":"Adefunmi Olanigan","link":"https://taz.de/die-gute-nachricht/!5903456&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Aus dem All betrachtet, funkelt die Erde bei Nacht. Und jährlich werden es mehr Leucht­punkte. Während 2010 noch 1,2 Milliarden Menschen keinen Zugang zu Elektrizität hatten, schrumpfte die Zahl 2020 auf 733 Millionen. Das zeigen Datenerhebungen der Weltbank. Mehr als drei Viertel der Menschen ohne Strom leben in afrikanischen Ländern südlich der Sahara. Welche Fortschritte möglich sind, zeigt Kenia. Dank starkem Ausbau wuchs die Versorgung seit 2010 um durchschnittlich 5 Prozent jährlich. 2020 hatten sieben von zehn Menschen Strom. Grünen Strom sogar. Rund 90 Prozent machen Kenias erneuerbare Energien aus. Allerdings bedeutet Zugang zu Elektrizität lediglich Energie, die für eine Glühbirne für vier Stunden am Tag ausreichen muss. Ein Herd zum Beispiel, der mehr Kilowattstunden braucht, bleibt damit für einige außer Reichweite. Ziel der Vereinten Nationen ist es, dass bis 2030 jeder Haushalt auf Strom zugreifen kann. Wenn bis dahin wirklich alle Weltregionen aus dem All glitzern sollen, muss der Zuwachs in noch höherem Tempo weitergehen. Adefunmi Olanigan"},{"date":"31.12.2022","title":"Böller sind kein Importkracher","author":"Sophie Fichtner","link":"https://taz.de/die-gute-nachricht/!5901688&s=gute%2Bnachricht&SuchRahmen=Print/","category":"other","text":"Nachdem in den vergangenen Jahren dank der Böllerverbote an Silvester viel weniger Raketen gezündet wurden als in den Vorjahren, könnte man meinen, 2022 wird doppelt bis dreifach so viel geknallt. Aber der Import von Feuerwerk weist auf einen anderen Trend hin: Zwischen Januar und September 2022 wurden 5.700 Tonnen Raketen und Böller nach Deutschland eingeführt. Im Vor-Corona-Jahr 2019 waren es im gleichen Zeitraum noch 29.800 Tonnen. Das ist ein Rückgang um 81 Prozent, der weniger Verletzungen, weniger Müll und weniger Feinstaub bedeutet. Vor Corona war die Feinstaubbelastung in der Luft am 1. Januar an vielen Orten so hoch wie sonst im restlichen Jahr nicht.Allerdings verkaufte Deutschland 2022 mehr als doppelt so viele Raketen und Co ins Ausland wie vor der Pandemie. Während zwischen Januar und September 2019 1.100 Tonnen Feuerwerkskörper exportiert wurden, waren es von Januar bis September 2022 2.700 Tonnen. Dabei ist Böllern doch so 2019.Sophie Fichtner"},{"date":"24.12.2022","title":"Ente ist out","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5901126&s=gute%2Bnachricht&SuchRahmen=Print/","category":"food_agriculture","text":"Weihnachten ist für viele Menschen untrennbar mit einem Festschmaus verbunden. Was in vielen Haushalten dabei nicht fehlen darf: die verstorbene – äh, räusper – festliche Gans oder Ente. Angesichts des stetig steigenden Vegetarieranteils in Deutschland wird diese Tradition allerdings ernsthaft infrage gestellt. Wie Daten des Statistischen Bundesamts zeigen, ist die Zahl der Enten und Gänse, die kurz vor Weihnachten geschlachtet werden, über die letzten Jahre gesunken. Insbesondere Entenfleisch hat seit 2012 drastisch an Beliebtheit eingebüßt. Wurden im Jahr 2012 noch 57.000 Tonnen in Deutschland produziert, waren es 2021 nur noch rund 22.000. Gänse können für denselben Zeitraum nicht ganz so sehr jubeln. Im Vergleich zu 2012 ist die Menge der in Deutschland geschlachteten Gänse um gerade mal 3 Prozent gesunken. Doch die letzten drei Jahre machen Hoffnung für das Federvieh, denn hier ist auch beim Gänsefleisch ein konsequenter Abwärtstrend zu verzeichnen ist: von 3.100 Tonnen auf 2.600 Tonnen, ein Rückgang um 18 Prozent. Der Import von Gänsefleisch ist im selben Zeitraum ebenfalls um 19 Prozent geschrumpft. Ein Grund, warum es die Entenmast in Deutschland besonders trifft, liegt in den Anforderungen, die an die Entenhaltung gestellt werden. Die Vorschrift umzusetzen, dass Enten eine Bademöglichkeit haben müssen, ist vielen Land­wir­t:in­nen zu aufwendig. Außerdem findet Vegetarismus insbesondere unter jungen Menschen zunehmend Anklang. Vielleicht färben die neuen Essgewohnheiten auf den Rest der Familie ab. Dann landen dieses Jahr statt Gänsefleisch öfter mal Seitan-Rouladen auf den Tellern. Alexandra Hilpert"},{"date":"17.12.2022","title":"Diesen Sommer sind weniger Menschen geflogen als vor Corona","author":"Malene Gürgen","link":"https://taz.de/die-gute-nachricht/!5900322&s=gute%2Bnachricht&SuchRahmen=Print/","category":"mobility_transport","text":"Lange Schlangen an der Gepäckaufgabe und vor der Sicherheitskontrolle, wartende Menschen in kurzen Hosen, den Rollkoffer in der Hand. Im Sommer 2022 gab es sie wieder, diese Bilder. Also alles wie vor der Pandemie? Nein. Es stimmt zwar: Verglichen mit dem Sommer 2021 sind dieses Jahr mehr als doppelt so viele Menschen ins Ausland geflogen. Doch gleichzeitig lagen die Zahlen deutlich unter dem Vor-Corona-Niveau: Im Vergleich mit der Sommersaison 2019 flogen 22,5 Prozent weniger Menschen aus Deutschland ins Ausland. Bei den inländischen Flügen war der Rückgang sogar noch deutlicher: 11,6 Millionen Menschen flogen zwischen April und Oktober 2019 innerhalb Deutschlands, dieses Jahr waren es im gleichen Zeitraum nur 4,5 Millionen. Billigflieger zu verbieten, wie es immer wieder gefordert wird, wäre übrigens nicht die entscheidende Maßnahme dafür, dass sich dieser Trend fortsetzt. Denn es sind die Reichen, die viel fliegen. Man geht davon aus, dass 1 Prozent der Weltbevölkerung etwa 50 Prozent der Emissionen durch Flüge verursacht und dass pro Jahr nur etwa 3 Prozent der Menschen weltweit eine Flugreise unternehmen. Malene Gürgen"},{"date":"10.12.2022","title":"Neubauten werden häufiger nachhaltig beheizt","author":"","link":"https://taz.de/die-gute-nachricht/!5898549&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Mithilfe der Außenluft heizen – bei minus 2 Grad Celsius? Das schaffen Wärmepumpen. In den letzten Jahren wurden laut Statistischem Bundesamt immer mehr von ihnen in neue Wohngebäude eingebaut. Schon 2021, also vor dem Ukrainekrieg, hat die Wärmepumpe die Gasheizung überholt. Die Pumpen beziehen Energie aus der Umwelt. Sie benötigen zwar Strom, allerdings brauchen sie weniger zusätzliche Energie als konventionelle Heizungen. Das macht sie nachhaltiger. Das funktioniert mittels eines flüssigen Kühlmittels, das bereits bei geringen Temperaturen gasförmig wird. Dieses nimmt die Umweltwärme aus der Erde, der Luft oder dem Grundwasser auf und verdampft dadurch. Ein sogenannter Verdichter erhöht mithilfe von Strom den Druck, sodass sich der Dampf auf bis zu 100 Grad Celsius erwärmt. Die Dampfwärme geht dann ins Heizsystem. Dabei sinkt die Temperatur, ein Ventil vermindert den Druck, sodass das Kühlmittel wieder flüssig wird. Der Kreislauf beginnt von vorn. Offizielle Daten über den weiteren Siegeszug der Wärmepumpe 2022 gibt es vom Bundesamt noch nicht, aber viele Indizien dafür. Zum Beispiel zeigen Zahlen des Verbands der Heizungsindustrie ein Wachstum von 42 Prozent im Vergleich zum Vorjahr bei allen neuen Heizungen in Neu- und Altbauten. Eine noch steilere Kurve also. Alexandra Hilpert"},{"date":"3.12.2022","title":"Der Anteil der Demenz­erkrankten sinkt","author":"Enno Schöningh","link":"https://taz.de/die-gute-nachricht/!5897189&s=gute%2Bnachricht&SuchRahmen=Print/","category":"health","text":"Ende des Jahres 2021 lebten 1,8 Millionen Menschen in Deutschland mit Demenz. Und die Deutsche Alzheimer Gesellschaft geht davon aus, dass die Zahl der Demenzkranken weiter zunehmen wird, weil Deutschland altert und die Wahrscheinlichkeit, an Demenz zu erkranken, im höheren Alter steigt.Doch neue wissenschaftliche Erkenntnisse geben Hoffnung. Denn immer weniger Alte erkranken an Demenz. Laut einer Studie sank in den USA der Anteil an Demenzkranken bei den über 65-Jährigen von 12,2 Prozent im Jahr 2000 auf 8,5 Prozent im Jahr 2016. Eine weitere Studie sieht diesen rückläufigen Trend auch für Europa.For­sche­r:in­nen nennen mehrere mögliche Gründe für die positive Entwicklung. Einer davon ist die Ernährung. Bei Menschen, die viel Gemüse, Früchte und Nüsse essen, setze der geistige Abbau deutlich später ein. Die Menschen, die sich sehr gesund ernährten, hätten demnach ein vergleichbares Demenzrisiko wie elf Jahre jüngere Menschen. Also, ran an den Kohl!Enno Schöningh"},{"date":"26.11.2022","title":"Die meisten geplanten Kohlekraftwerke werden abgesagt","author":"Lalon Sander","link":"https://taz.de/die-gute-nachricht/!5894927&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"In der Abschlusserklärung des Klimagipfels in Ägypten haben die teilnehmenden Länder bekräftigt: Die Welt muss aus der Kohle aussteigen. Tatsächlich werden heute noch immer neue Kraftwerke geplant und gebaut. Aber es werden weniger. Seit das Pariser Abkommen 2015 unterschrieben wurde, ist ein Großteil der Pläne für neue Kohlekraftwerke wieder abgeblasen worden. Das zeigen neue Zahlen des Umwelt-Thinktanks E3G. In dieser Zeit gingen 368 Gigawatt neuer Kohlekapazität ans Netz, während mehr als 1.200 Gigawatt an anvisierter Kapazität gecancelt wurden. So beispielsweise das Kohlekraftprojekt Łęczna in Polen an der ukrainischen Grenze. Mit dessen Absage ist die EU jetzt die erste größere Region weltweit, in der keine neuen Kohlekraftwerke mehr geplant werden. Bald könnte Nordamerika folgen – unter dem Slogan „Bring Back Coal“ hatte Ex-Präsident Donald Trump ein neues Kraftwerk planen lassen, was demnächst wieder gestoppt werden dürfte. Insgesamt haben nur noch 34 Länder neue Kohlekraftwerke in Planung. Etwa 66 Prozent der geplanten Kapazität befindet sich dabei in China, während Indien, die Türkei, Bangladesch, Vietnam und die Mongolei weitere 20 Prozent ausmachen. Kohleverstromung beenden Bereits 2021 analysierte die Internationale Energieagentur (IEA): jede weitere Investition in Kohlekraft bedrohe das 1,5-Grad-Ziel. Allerdings sind die bereits gebauten Kohlekraftwerke die weitaus größere Herausforderung für das Klima. „Mehr als 95% des weltweiten Kohleverbrauchs findet in Ländern statt, die ein Klimaneutralitätsziel haben“, sagte IEA-Chef Fatih Birol bei der Veröffentlichung des diesjährigen Kohle-Berichts. Ein wichtiges ungelöstes Problem sei, wie mit den riesigen existierenden Kohleanlagen umgegangen werden solle. Nicht nur müsse es ein Ende des Neubaus geben, sondern auch einen schnelleren Ausstieg, schreibt die IEA kürzlich in einem Bericht. Reichere Länder müssten bereits 2035 die Kohleverstromung beenden, der Rest der Welt bis 2040. Und bis 2050 müsste auch die Verwendung von Kohle in anderen Bereichen um 90% gesunken sein."},{"date":"19.11.2022","title":"Das Ozonloch schrumpft weiter","author":"Alexandra Hilpert","link":"https://taz.de/die-gute-nachricht/!5893486&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Streng genommen ist das Ozonloch gar kein Loch, sondern eine dramatische Ausdünnung des Ozongehalts in der Stratosphäre, eine der Schichten der Gashülle, die die Erde umgibt. Britische Forscher bewiesen 1985 erstmals die Existenz des Ozonlochs, das sich mit rasender Geschwindigkeit zu vergrößern schien. Das machte vielen Menschen Angst. „Lebensgefahr aus der Dose“, titelte der Spiegel 1987. Als der am weitesten verbreitete ozonschädigende Stoff galt nämlich FCKW (Fluorchlorkohlen­wasserstoffe), das als Kühlmittel in Sprühdosen verwendet wurde. Die Angst vor dem Ozonkollaps war berechtigt, denn Ozon bildet für die Lebewesen auf der Erde einen wichtigen Schutz: Es filtert UV-Strahlung und schützt uns damit zum Beispiel vor Krebserkrankungen. Mit dem Montreal-Protokoll von 1987 einigten sich 189 Staaten auf Regeln, um die Ozonschicht zu retten, etwa einen schrittweisen Verzicht auf Chemikalien, die zum Abbau von Ozon führen. Lange wuchs das Loch weiter, am größten war es im Jahr 2000: Auf 29,9 Millionen Quadratkilometern erstreckte es sich über der Antarktis. 2022 betrug die maximale Ausdehnung des Ozonlochs nur noch 26,5 Millionen Quadratkilometer. Das zeigen jüngst erschienene Daten der US-Bundesbehörde für Raumfahrt und Flugwissenschaft. Bis sich die Ozonschicht vollständig erholt hat, dauert es allerdings noch eine Weile – 50 bis 100 Jahre lautet die aktuelle Prognose. Ozonschädigende Stoffe brauchen so lange, bis sie abgebaut sind. Alexandra Hilpert"},{"date":"12.11.2022","title":"Australiens Buckelwale sind nicht mehr gefährdet","author":"Malene Gürgen","link":"https://taz.de/die-gute-nachricht/!5891775&s=gute%2Bnachricht&SuchRahmen=Print/","category":"climate_environment","text":"Seit etwa 15 Millionen Jahren ziehen Buckelwale durch die Ozeane. Den Sommer verbringen die etwa 13 Meter langen Tiere in den Polarmeeren, für den Winter schwimmen sie in tropische und subtropische Gewässer. Rund 8.000 Kilometer legen sie bei ihrer Reise zurück. Doch lange Zeit wurden die Buckelwale immer seltener. Die Jagd auf Wale begann schon im 16. Jahrhundert und nahm dermaßen zu, dass die Tiere Mitte des 20. Jahrhunderts fast ausgerottet waren.Von heute aus betrachtet ist die Geschichte des Buckelwales eine Erfolgsgeschichte des Artenschutzes. Seit 1966 steht der Wal unter Schutz. 1986 wurden kommerzieller Walfang verboten und Schutzgebiete in der Arktis eingerichtet. Das brachte die Wende, und eine langsame Erholung begann. In diesem Jahr hat nun auch das australische Umweltministerium den Buckelwal von der Liste der gefährdeten Arten gestrichen: Die Zahl der Tiere in Australiens Gewässern ist von 300 Tieren im Jahr 1966 auf 40.000 gestiegen. Weltweit sind es sogar doppelt so viele. Malene Gürgen"}];

    function renderFilters(){const counts=countBy(state.allRows,row=>row.category);const categories=Object.keys(CATEGORY_LABELS).filter(category=>category==="all"||counts.get(category));document.getElementById("filters").innerHTML=categories.map(category=>{const count=category==="all"?state.allRows.length:counts.get(category);return `<button class="chip" type="button" data-category="${category}" aria-pressed="${category===state.category}">${CATEGORY_LABELS[category]} (${count})</button>`}).join("");document.querySelectorAll(".chip").forEach(button=>{button.addEventListener("click",()=>{state.category=button.dataset.category;update()})})}
    function update(){state.visibleRows=state.allRows.filter(row=>{const categoryMatches=state.category==="all"||row.category===state.category;const haystack=`${row.date} ${row.title} ${row.author} ${labelFor(row.category)} ${row.text}`.toLowerCase();return categoryMatches&&(!state.search||haystack.includes(state.search))});document.querySelectorAll(".chip").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.category===state.category)));document.querySelector(".grid").classList.toggle("is-filtered",state.category!=="all");document.getElementById("visibleCount").textContent=state.visibleRows.length;document.getElementById("totalCount").textContent=`von ${state.allRows.length} Einträgen`;renderStats();renderTable()}
    function renderStats(){renderBars("authors",topCounts(state.visibleRows,row=>row.author||"Ohne Angabe",8),"#c62828");renderBars("categories",topCounts(state.visibleRows,row=>labelFor(row.category),10),(_,label)=>colorForLabel(label));const latestDate=state.allRows.reduce((latest,row)=>row.dateObj>latest?row.dateObj:latest,new Date(0));renderBars("topics3",topCounts(rowsSince(state.visibleRows,latestDate,3),row=>labelFor(row.category),5),(_,label)=>colorForLabel(label));renderBars("topics12",topCounts(rowsSince(state.visibleRows,latestDate,12),row=>labelFor(row.category),5),(_,label)=>colorForLabel(label))}
    function renderTable(){const tbody=document.getElementById("rows");tbody.innerHTML=state.visibleRows.map(row=>`<tr><td class="muted">${dateFormatter.format(row.dateObj)}</td><td class="title-cell"><a href="${escapeAttr(row.link)}" target="_blank" rel="noopener">${escapeHtml(row.title)}</a></td><td>${escapeHtml(row.author||"Ohne Angabe")}</td><td><span class="tag">${labelFor(row.category)}</span></td></tr>`).join("");document.getElementById("empty").hidden=state.visibleRows.length>0}
    function renderBars(id,items,color){const container=document.getElementById(id);if(!items.length){container.innerHTML=`<div class="muted">Keine Daten</div>`;return}const max=Math.max(...items.map(item=>item.count));container.innerHTML=items.map(item=>{const width=Math.max(5,Math.round(item.count/max*100));const barColor=typeof color==="function"?color(item.key,item.label):color;return `<div class="bar-row"><div class="bar-label" title="${escapeAttr(item.label)}">${escapeHtml(item.label)}</div><div class="bar-track"><div class="bar-fill" style="--w:${width}%;--bar:${barColor}"></div></div><div class="bar-value">${item.count}</div></div>`}).join("")}
    function topCounts(rows,keyFn,limit){return[...countBy(rows,keyFn)].map(([label,count])=>({key:label,label,count})).sort((a,b)=>b.count-a.count||collator.compare(a.label,b.label)).slice(0,limit)}
    function countBy(rows,keyFn){const map=new Map();rows.forEach(row=>{const key=keyFn(row);map.set(key,(map.get(key)||0)+1)});return map}
    function rowsSince(rows,latestDate,months){const cutoff=new Date(latestDate);cutoff.setMonth(cutoff.getMonth()-months);return rows.filter(row=>row.dateObj>=cutoff)}
    function normalizeRow(row){return{date:row.date,dateObj:parseGermanDate(row.date),title:row.title||"",author:row.author||"",link:row.link||"",category:row.category||"other",text:row.text||""}}
    function parseGermanDate(value){const[day,month,year]=value.split(".").map(Number);return new Date(year,month-1,day)}
    function labelFor(category){return CATEGORY_LABELS[category]||category}
    function colorForLabel(label){const category=Object.entries(CATEGORY_LABELS).find(([,value])=>value===label)?.[0];return CATEGORY_COLORS[category]||"#73736b"}
    function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function escapeAttr(value){return escapeHtml(value).replaceAll("`","&#096;")}
  </script>
</body>
